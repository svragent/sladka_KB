<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karta zaměstnance</title>
<!-- v3.9 -->
<style>
  :root{
    --cream:#F7EFE0;
    --paper:#FFFDF8;
    --cocoa:#3B2A20;
    --cocoa-soft:#6B5744;
    --caramel:#B9793A;
    --caramel-deep:#8F5A24;
    --cherry:#A63446;
    --honey:#C98B1F;
    --sage:#5B7B52;
    --sky:#4B6E8C;
    --line:#E7D9BE;
    --line-soft:#F0E5CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--cocoa);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";
    font-size:14px;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:0;}
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
  @media (max-width:760px){
    .app{grid-template-columns:1fr;}
    .sidebar{border-right:none;border-bottom:1px solid var(--line);}
    .main{padding:20px 14px 60px;}
  }
  .sidebar{background:var(--paper);border-right:1px solid var(--line);padding:20px 16px;}
  .sidebar h1{font-size:19px;line-height:1.25;}
  .sidebar .sub{color:var(--cocoa-soft);font-size:12px;margin-top:4px;margin-bottom:12px;}
  .mode-badge{
    display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;
    margin-bottom:14px;background:var(--line-soft);color:var(--caramel-deep);
    border:1px solid transparent;cursor:pointer;font-family:inherit;
  }
  .mode-badge:hover{border-color:var(--caramel);}
  .mode-badge.employee{background:#DCE6F0;color:#2F4E6B;}
  .mode-badge.employee:hover{border-color:#6B8CAE;}
  .emp-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
  .emp-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;
  }
  .emp-item:hover{background:var(--line-soft);}
  .emp-item.active{background:var(--cream);border-color:var(--caramel);}
  .emp-item .nm{font-weight:600;}
  .add-btn{
    margin-top:14px;width:100%;padding:9px;border-radius:8px;
    border:1.5px dashed var(--caramel);background:transparent;color:var(--caramel-deep);
    font-weight:600;cursor:pointer;font-size:13px;
  }
  .add-btn:hover{background:var(--line-soft);}
  .add-form{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .add-form input{
    font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);
    border-radius:6px;background:var(--paper);color:var(--cocoa);
  }
  .add-form .row{display:flex;gap:6px;}
  .add-form button{flex:1;padding:7px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;}
  .add-form .confirm{background:var(--caramel);color:#fff;}
  .add-form .cancel{background:var(--line-soft);color:var(--cocoa-soft);}
  .backup-row{display:flex;gap:6px;margin-top:12px;}
  .backup-btn{
    flex:1;padding:7px 4px;border-radius:6px;border:1px solid var(--line);
    background:var(--paper);color:var(--cocoa-soft);font-size:11px;cursor:pointer;
  }
  .backup-btn:hover{background:var(--line-soft);}
  .mode-btn{
    margin-top:16px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);color:var(--cocoa);font-size:12px;font-weight:600;cursor:pointer;
  }
  .mode-btn:hover{background:var(--line-soft);}
  .mode-note{font-size:10.5px;color:var(--cocoa-soft);margin-top:10px;line-height:1.4;}
  .version-tag{font-size:9.5px;color:var(--line);margin-top:16px;text-align:right;user-select:none;}
  .badges-row{display:flex;gap:6px;margin:1px 0 5px;flex-wrap:wrap;}
  .badge-ico{font-size:16px;line-height:1;cursor:default;}
  .badge-num{font-size:9px;font-weight:700;color:var(--cocoa-soft);margin-left:1px;vertical-align:middle;}
  .emp-badge{font-size:13px;flex-shrink:0;margin-left:6px;}

  .title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .search-input{
    width:100%;font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);
    border-radius:6px;background:var(--paper);color:var(--cocoa);margin-bottom:8px;
  }
  .help-btn{
    width:22px;height:22px;border-radius:50%;border:1px solid var(--caramel);
    background:var(--paper);color:var(--caramel-deep);font-weight:700;font-size:12px;
    cursor:pointer;flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,sans-serif;padding:0;
  }
  .help-btn:hover{background:var(--line-soft);}
  .help-overlay{
    position:fixed;inset:0;background:rgba(59,42,32,.45);z-index:50;
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;
  }
  .help-modal{
    background:var(--paper);border-radius:14px;max-width:560px;width:100%;
    padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .help-modal h2{font-size:18px;margin-bottom:4px;}
  .help-sub{font-size:12px;color:var(--cocoa-soft);margin-bottom:16px;}
  .help-modal h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--caramel-deep);margin:16px 0 6px;font-family:-apple-system,sans-serif;font-weight:700;}
  .help-modal h3:first-of-type{margin-top:0;}
  .help-modal p{font-size:13px;line-height:1.55;color:var(--cocoa);margin:0 0 4px;}

  #printArea{display:none;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;color:#222;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";font-size:13px;}
    #printArea h1{font-family:Georgia,serif;font-size:20px;margin:0 0 4px;}
    #printArea .pr-group{margin-top:12px;break-inside:avoid;}
    #printArea .pr-group b{font-size:13px;}
    #printArea ul{margin:4px 0 0 18px;padding:0;}
    #printArea li{margin-bottom:2px;}
  }
  .main{padding:26px 30px 60px;max-width:760px;}
  .empty-state{color:var(--cocoa-soft);padding-top:60px;text-align:center;}
  .stamp{
    display:inline-flex;align-items:center;justify-content:center;
    width:64px;height:64px;border-radius:50%;border:2px solid currentColor;
    font-family:Georgia,serif;font-weight:700;font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;text-align:center;
    transform:rotate(-6deg);line-height:1.15;flex-shrink:0;
  }
  .photo-wrap{position:relative;width:64px;height:64px;flex-shrink:0;}
  .photo-click{cursor:pointer;display:block;}
  .photo-ov{
    position:absolute;inset:0;border-radius:50%;background:rgba(59,42,32,.62);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:700;line-height:1.2;text-align:center;opacity:0;transition:opacity .15s;
  }
  .photo-ov b{font-size:16px;}
  .photo-click:hover .photo-ov, .photo-click:focus-within .photo-ov{opacity:1;}
  @media (min-width:761px){
    .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;align-self:start;}
  }
  @media (max-width:760px){
    .emp-item{padding:10px 12px !important;font-size:14px !important;}
    .card-head{flex-wrap:wrap;}
    .meta-row{flex-wrap:wrap;}
    .to-list{display:inline-block !important;}
  }
  .to-list{display:none;margin-bottom:12px;background:none;border:none;padding:0;color:var(--caramel-deep);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .month-table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
  .month-table th,.month-table td{border-bottom:1px solid var(--line-soft);padding:7px 6px;text-align:left;vertical-align:top;}
  .month-table th{font-size:10.5px;text-transform:uppercase;color:var(--cocoa-soft);letter-spacing:.04em;}
  .month-table td.num{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .table-scroll{overflow-x:auto;max-width:100%;}
  .main{min-width:0;}
  .mail-to{width:100%;font-family:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--cocoa);}
  .report-text{width:100%;min-height:160px;font-family:inherit;font-size:12.5px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--cocoa);}
  .cfg-tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap;}
  .cfg-tab{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--cocoa-soft);font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .cfg-tab.on{background:var(--cocoa);color:#fff;border-color:var(--cocoa);}
  .cfg-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:12px;color:var(--cocoa-soft);}
  .cfg-field input,.cfg-field select,.cfg-field textarea,.cfg-select{
    font-family:inherit;font-size:13.5px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--cocoa);min-width:0;
  }
  .cfg-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:10px;}
  .q-edit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--paper);}
  .q-head{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--caramel-deep);letter-spacing:.04em;margin-bottom:6px;}
  .q-tools{display:flex;gap:2px;}
  .q-tool{border:none;background:var(--line-soft);color:var(--cocoa-soft);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:12px;}
  .q-tool:hover{background:var(--line);color:var(--cocoa);}
  .q-text{width:100%;font-family:inherit;font-size:13.5px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;resize:vertical;min-height:44px;background:#fff;color:var(--cocoa);}
  .opt-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .opt-row input[type=text]{flex:1;min-width:0;font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--cocoa);}
  .opt-row.ok input[type=text]{border-color:var(--sage);background:#EEF4EA;}
  .opt-row input[type=radio]{width:18px;height:18px;accent-color:var(--sage);flex-shrink:0;}
  .add-link{border:none;background:none;color:var(--caramel-deep);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 0;}
  .cfg-msg{font-size:12.5px;margin-top:8px;}
  .cfg-msg.err{color:var(--cherry);font-weight:600;}
  .cfg-msg.ok{color:#3E5C36;font-weight:600;}
  .cl-group{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--paper);}
  .cl-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .cl-row input[type=text],.cl-row input[type=number],.cl-row select{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--cocoa);min-width:0;}
  .cl-row .grow{flex:1 1 180px;}
  .cl-row .icon-in{width:52px;text-align:center;flex:0 0 auto;}
  .cl-row .sel-group{flex:0 1 150px;}
  .cl-head input[type=text]{font-weight:700;}
  .cl-items{margin-left:10px;padding-left:10px;border-left:2px solid var(--line-soft);}
  .lvl-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end;margin-bottom:10px;}
  .kb-row{border-bottom:1px solid var(--line-soft);padding:10px 0;}
  .kb-row b{font-size:13px;}
  .kb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
  .kb-chip{display:inline-flex;align-items:center;gap:4px;background:var(--line-soft);border-radius:12px;padding:3px 4px 3px 10px;font-size:12px;}
  .kb-chip button{border:none;background:none;cursor:pointer;color:var(--cocoa-soft);font-size:13px;padding:0 4px;}
  .hist-item{border-bottom:1px solid var(--line-soft);padding:8px 0;font-size:13px;}
  .hist-item pre{white-space:pre-wrap;font-family:inherit;font-size:12px;background:var(--cream);border-radius:8px;padding:8px;margin:6px 0 0;}
  .photo-wrap img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line);display:block;}
  .photo-wrap input[type=file]{display:none;}
  .photo-label{
    position:absolute;bottom:-4px;right:-4px;background:var(--paper);border:1px solid var(--line);
    border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    font-size:11px;cursor:pointer;
  }
  .card-head{display:flex;gap:16px;align-items:center;margin-bottom:22px;}
  .card-head .fields{flex:1;min-width:0;}
  .card-head input, select.level-select{
    font-family:inherit;font-size:14px;border:none;border-bottom:1px solid var(--line);
    background:transparent;padding:3px 2px;color:var(--cocoa);width:100%;margin-bottom:4px;
  }
  .card-head input:focus, select:focus{outline:none;border-bottom-color:var(--caramel);}
  .name-input{font-family:Georgia,serif;font-size:20px;font-weight:700;border-bottom:none!important;}
  div.name-input{margin-bottom:4px;}
  .meta-row{display:flex;gap:14px;font-size:12px;color:var(--cocoa-soft);flex-wrap:wrap;}
  .meta-row label{display:flex;flex-direction:column;gap:2px;}
  .wage-line{margin-top:6px;font-size:12px;color:var(--caramel-deep);font-weight:600;}

  section.block{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:18px;
  }
  section.block h2{
    font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--cocoa-soft);
    margin-bottom:10px;font-family:-apple-system,sans-serif;font-weight:700;
  }
  .progress-bar{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin-bottom:14px;display:flex;}
  .progress-seg{height:100%;transition:width .2s;}

  .group-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--caramel-deep);margin:14px 0 6px;letter-spacing:.04em;}
  .group-label:first-child{margin-top:0;}
  .item{border-bottom:1px solid var(--line-soft);}
  .item:last-child{border-bottom:none;}
  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 4px;cursor:pointer;user-select:none;
  }
  .item-row .txt{font-size:13px;}
  .chev{display:inline-block;width:14px;color:var(--cocoa-soft);font-size:11px;}
  .chip{
    display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;
    background:var(--line-soft);color:var(--cocoa-soft);margin-left:4px;vertical-align:1px;
  }
  .chip.ok{background:#DCEAD4;color:#3E5C36;}
  .state-pill{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:4px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;
  }
  .s0{background:#EDEAE2;color:var(--cocoa-soft);}
  .s1{background:#F6E3B4;color:#7A5A0E;}
  .s2{background:#DCEAD4;color:#3E5C36;}
  .s3{background:#DCE6F0;color:#2F4E6B;}

  .item-detail{padding:2px 4px 14px 18px;}
  .dl{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--cocoa-soft);margin:10px 0 4px;letter-spacing:.04em;}
  .guide-input{
    width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:8px;background:var(--paper);color:var(--cocoa);min-height:56px;resize:vertical;
  }
  .guide-view{font-size:13px;line-height:1.5;background:var(--cream);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;}
  .guide-view a{color:var(--caramel-deep);}
  .muted{color:var(--cocoa-soft);font-size:12px;}
  .read-row{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:13px;cursor:pointer;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .btn{
    background:var(--caramel);color:#fff;border:none;border-radius:8px;
    padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:var(--line-soft);color:var(--cocoa-soft);}
  .btn.red{background:var(--cherry);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .link-btn{
    margin-top:10px;background:none;border:none;color:var(--cocoa-soft);
    font-size:11px;text-decoration:underline;cursor:pointer;padding:0;display:block;
  }
  .quiz{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper);margin-top:8px;}
  .q{margin-bottom:12px;}
  .qt{font-weight:600;font-size:13px;margin-bottom:4px;}
  .opt{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13px;cursor:pointer;}
  .draft-note{font-size:11px;color:#7A5A0E;background:#FBF1DA;border-radius:6px;padding:6px 8px;margin-bottom:10px;}
  .rev-opt{padding:6px 9px;border-radius:6px;font-size:13px;margin:3px 0;background:var(--line-soft);color:var(--cocoa-soft);}
  .rev-correct{background:#DCEAD4;color:#2F4A28;font-weight:600;}
  .rev-wrong{background:#F7DDE0;color:#7A2233;font-weight:600;}
  .result{padding:9px 12px;border-radius:8px;font-size:13px;margin-top:6px;}
  .result.ok{background:#DCEAD4;color:#3E5C36;}
  .result.fail{background:#F7DDE0;color:#8A2A3A;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--cocoa-soft);margin-bottom:10px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .banner{border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;}
  .banner.ok{background:#DCEAD4;color:#3E5C36;}
  .banner.yellow{background:#F6E3B4;color:#6A4E0C;}
  .banner.red{background:#F7DDE0;color:#8A2A3A;font-weight:600;}
  .bonus-summary{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--cream);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;
  }
  .bonus-summary b{font-family:Georgia,serif;font-size:16px;}
  .vio-form{display:grid;grid-template-columns:1fr 150px;gap:8px;margin:14px 0 8px;}
  .vio-form select,.vio-form input{
    font-family:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);
    border-radius:6px;background:var(--paper);color:var(--cocoa);min-width:0;
  }
  .vio-form .full{grid-column:1 / -1;}
  .vio-row{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
  .vio-row:last-child{border-bottom:none;}
  .vio-main{flex:1;min-width:0;overflow-wrap:anywhere;}
  .vio-date{font-size:11px;color:var(--cocoa-soft);}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:12px;white-space:nowrap;}
  .badge.y{background:#F6E3B4;color:#7A5A0E;}
  .badge.r{background:#F7DDE0;color:#8A2A3A;}
  .badge.x{background:#EDEAE2;color:var(--cocoa-soft);}

  .note-form{display:flex;gap:8px;margin-bottom:10px;}
  .note-form textarea{
    flex:1;font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:8px;resize:vertical;min-height:38px;
  }
  .note-form button{background:var(--caramel);color:#fff;border:none;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer;font-size:13px;}
  .note-item{padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;overflow-wrap:anywhere;}
  .note-item:last-child{border-bottom:none;}
  .note-date{font-size:10.5px;color:var(--cocoa-soft);margin-bottom:2px;}
  .danger-link{color:var(--cherry);font-size:11px;background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--caramel);outline-offset:2px;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="title-row">
      <h1>Karta zaměstnance</h1>
      <button class="help-btn" id="helpBtn" title="Nápověda" aria-label="Nápověda">?</button>
    </div>
    <div class="sub">Digitální adaptační checklist</div>

function uid(){ return 'e' + Date.now() + Math.random().toString(36).slice(2,7); }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
// Vybere, které otázky z banky testu T se v tomto pokusu zobrazí (náhodně, pokud je banka
// větší než T.display) a vrátí pole jejich indexů v T.questions – v tomto pořadí se zobrazí.
function pickSelIdx(T){
  const all = T.questions.map((_, i) => i);
  if(T.display && T.display < T.questions.length) return shuffle(all).slice(0, T.display);
  return all;
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(s){
  return escapeHtml(s)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, '<br>');
}

function toBase64Utf8(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 32768){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  }
  return btoa(bin);
}
async function publishToGitHub(){
  let token = lsGet('kb-gh-token');   // stejný token jako ve znalostní bázi
  if(!token){
    token = (prompt('Vlož GitHub token (uloží se jen v tomto prohlížeči):') || '').trim();
    if(!token) return;
    lsSet('kb-gh-token', token);
  }
  const btn = $('publishBtn');
  btn.disabled = true;
  $('modeNote').textContent = 'Publikuji…';
  const url = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE;
  const headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'};
  try{
    const getRes = await fetch(url + '?ref=main', {headers: headers, cache: 'no-store'});
    if(getRes.status === 401 || getRes.status === 403) throw new Error('auth');
    let sha = null, remoteAt = '';
    if(getRes.ok){
      const info = await getRes.json();
      sha = info.sha;
      if(info.content){
        const bytes = Uint8Array.from(atob(info.content.replace(/\s/g, '')), c=>c.charCodeAt(0));
        const m = new TextDecoder().decode(bytes).match(/"publishedAt":\s*"([^"]*)"/);
        if(m) remoteAt = m[1];
      }
    } else if(getRes.status !== 404){
      throw new Error('get');
    }
    // Ochrana proti přepsání: publikoval mezitím někdo jiný?
    const baseAt = lsGet('card-base-published-at') || '';
    if(baseAt && remoteAt && remoteAt > baseAt){
      if(!confirm('Na webu je novější verze, kterou mezitím publikoval někdo jiný (' + fmtStamp(remoteAt) + ').\n\nKdyž budeš pokračovat, jeho změny se PŘEPÍŠOU tvými.\n\nOpravdu publikovat?')){
        $('modeNote').textContent = 'Publikace zrušena – na webu je novější verze. Ulož si zálohu svých změn a domluv se, kdo co upravoval.';
        btn.disabled = false;
        return;
      }
    }
    const publishedAt = new Date().toISOString();
    const data = {};
    for(const e of employees){ data[e.id] = await loadEmployee(e.id); }
    const payload = {publishedAt: publishedAt, employees: employees, data: data, guides: guides, settings: SETTINGS};
    const text = 'const CARD_DATA = ' + JSON.stringify(payload, null, 1) + ';\n';
    const body = {message: 'Karta – publikace ' + publishedAt.slice(0, 16).replace('T', ' '), content: toBase64Utf8(text), branch: 'main'};
    if(sha) body.sha = sha;
    const putRes = await fetch(url, {method: 'PUT', headers: headers, body: JSON.stringify(body)});
    if(putRes.status === 401 || putRes.status === 403) throw new Error('auth');
    if(!putRes.ok) throw new Error('put');
    lsSet('card-published-at', publishedAt);
    lsSet('card-base-published-at', publishedAt);
    lsSet('card-unpublished', '0');
    $('modeNote').textContent = 'Publikováno. Ostatním se změny ukážou do pár minut po obnovení stránky.';
  }catch(e){
    if(e.message === 'auth'){
      try{ localStorage.removeItem('kb-gh-token'); }catch(err){}
      $('modeNote').textContent = 'Publikace selhala: neplatný token nebo chybí oprávnění. Při dalším pokusu zadej token znovu.';
    } else {
      $('modeNote').textContent = 'Publikace selhala (síť nebo GitHub). Zkus to znovu.';
    }
  }
  btn.disabled = false;
}

function normalize(d){

    const old = EXPECTATIONS.filter(e=>d.monthly[e[0]] === 1 || d.monthly[e[0]] === 2)
      .map(e=>e[1] + (d.monthly[e[0]] === 2 ? ' (červená)' : ' (žlutá)'));
    if(old.length){
      d.notes.push({date:todayStr(), author:'systém',

             '. Datum nebylo uloženo – pokud mají platit, zapiš je ručně jako prohřešek se správným datem.'});

}

/* ==================== PROHŘEŠKY (30denní okno) ==================== */
// Každý prohřešek má datum. Druhý (a další) prohřešek do 30 dnů od nějakého dřívějšího = červená.
// Prohřešek zapsaný jako "red" je červená rovnou. Žlutá platí 30 dnů od data.
function rateViolations(list){
  const sorted = list.slice().sort((a,b)=> (toDay(a.date) - toDay(b.date)) || String(a.id).localeCompare(String(b.id)));
  const out = [];
  sorted.forEach(v=>{
    let sev;
    if(v.type === 'red') sev = 'red';
    else sev = out.some(p=> toDay(v.date) - toDay(p.date) <= VIOLATION_DAYS * DAY) ? 'red' : 'yellow';
    out.push(Object.assign({}, v, {sev}));
  });
  return out;
}
function evaluateViolations(list){
  // Prohřešky před poslední uzávěrkou se do aktuální karty a ohodnocení nepočítají (zůstávají v historii jako „uzavřeno“).
  const from = SETTINGS.closedFrom || '';
  const closed = rateViolations(list).filter(v=>from && v.date < from).map(v=>Object.assign(v, {closed:true}));
  const out = rateViolations(list.filter(v=>!from || v.date >= from));
  const today = toDay(todayStr());
  const reds = out.filter(v=>v.sev === 'red');
  const active = out.filter(v=>v.sev === 'yellow' && (today - toDay(v.date)) <= VIOLATION_DAYS * DAY);
  let until = null;
  if(active.length) until = Math.max.apply(null, active.map(v=>toDay(v.date))) + VIOLATION_DAYS * DAY;
  return {list:closed.concat(out), reds, active, until, bonusPct: reds.length ? 0 : (active.length ? 50 : 100)};
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image load failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  h += '<label class="read-row"><input type="checkbox" data-read="' + id + '"' + (L.read ? ' checked' : '') + '> Návod jsem si přečetl/a</label>';
  if(T){
    const canStart = leader || !KB_LINKS[id] || L.read;
    h += '<div class="dl">Test: ' + escapeHtml(T.title) + '</div>';
    if(!leader){
      if(L.passed) h += '<div class="result ok">Splněno (' + L.score + ' %).</div>';
      else if(L.score !== null && L.score !== undefined) h += '<div class="muted">Poslední pokus: ' + L.score + ' % (potřeba ' + needText(T) + ').</div>';
    } else {
      h += '<div class="muted">Náhled otázek pro vedoucího – vyhodnocení se neukládá do karty zaměstnance.</div>';
      if(L.passed) h += '<div class="muted">Zaměstnanec má test splněný (' + L.score + ' %).</div>';
      else if(L.score !== null && L.score !== undefined) h += '<div class="muted">Poslední pokus zaměstnance: ' + L.score + ' %.</div>';
    }
    if(quiz && quiz.id === id) h += quizHtml(id, leader);
    else if(leader && reviewId === id && L.answers) h += reviewHtml(id, d);
    else {
      h += '<div class="row"><button class="btn" data-start-test="' + id + '"' + (canStart ? '' : ' disabled') + '>' +
                (leader ? 'Náhled testu' : (L.passed ? 'Zopakovat test' : 'Spustit test')) + '</button>';
      if(leader && L.answers) h += '<button class="btn ghost" data-review-open="' + id + '">Zobrazit odpovědi zaměstnance</button>';
      h += (canStart ? '' : '<span class="muted">Nejdřív zaškrtni, že sis přečetl/a návod.</span>') + '</div>';
    }
  }
  if(leader) h += '<button class="link-btn" data-reset-learn="' + id + '">Vynulovat přečtení a test</button>';
  h += '</div>';
  return h;
}

function questionsReviewHtml(questions, answers){
  return questions.map((q,i)=>{
    const chosen = answers ? answers[i] : null;
    return '<div class="q"><div class="qt">' + (i + 1) + '. ' + escapeHtml(q.q) + '</div>' +
      q.options.map((o,j)=>{
        const isCorrect = (j === q.correct);
        const isChosen = (chosen != null && j === chosen);
        let cls = 'rev-opt';
        if(isCorrect) cls += ' rev-correct';
        if(isChosen && !isCorrect) cls += ' rev-wrong';
        return '<div class="' + cls + '">' + (isChosen ? '● ' : '○ ') + escapeHtml(o) + '</div>';
      }).join('') +
    '</div>';
  }).join('');
}

function reviewHtml(id, d){
  const T = TESTS[id];
  const L = d.learn[id] || {};
  const answers = L.answers || [];
  // Starší záznamy (před zavedením rotace otázek) nemají L.questionIdx – u nich se
  // vždy zobrazovaly všechny otázky v pořadí 0..N, takže identita je správná náhrada.
  const idx = L.questionIdx || answers.map((_, i) => i);
  const shownQ = idx.map(i => T.questions[i]).filter(Boolean);
  let h = '<div class="quiz">';
  h += '<div class="muted">Odpovědi zaměstnance' + (L.attemptedAt ? ' z ' + fmtStr(L.attemptedAt) : '') +
       ' – výsledek ' + (L.score != null ? L.score + ' %' : '?') + (L.passed ? ' (splněno).' : ' (nesplněno).') +
       ' Plná tečka ● = co zaměstnanec zaškrtl, zeleně je vždy správná odpověď.</div>';
  h += questionsReviewHtml(shownQ, answers);
  h += '<div class="row"><button class="btn ghost" data-review-close="1">Zavřít</button></div></div>';
  return h;
}

function needText(T){ return T.passMin ? (T.passMin + ' správných z ' + T.questions.length) : (T.passPct + ' %'); }

// Odznaky se vždy jen ODVOZUJÍ z toho, co appka už zná (checklist, prohřešky) – nic se kvůli nim neukládá.
function cleanMonthsStreak(violations, startDate){
  if(!startDate) return 0;  // bez data nástupu nejde poctivě říct, jak dlouho je "bez prohřešku"
  const startKey = String(startDate).slice(0, 7);
  const now = new Date();
  let streak = 0;
  for(let i = 0; i < 24; i++){
    const dt = new Date(Date.UTC(now.getFullYear(), now.getMonth() - i, 1));
    const key = dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0');
    if(key < startKey) break;  // před nástupem se streak nepočítá
    if(violations.some(v => String(v.date).slice(0, 7) === key)) break;
    streak++;
  }
  return streak;
}

function computeBadges(d){
  const badges = [];
  const phaseIcons = {'Nováček':'🌱', 'Pokročilý':'☕', 'Expert':'🏆'};
  CHECKLIST_GROUPS.forEach(g=>{
    const icon = (g.icon !== undefined) ? g.icon : phaseIcons[g.group];
    if(!icon || !g.items.length) return;
    if(g.items.every(it => d.checklist[it[0]] === 2)){
      badges.push({icon: icon, title: 'Fáze „' + g.group + '“ dokončena'});
    }
  });
  if(ALL_ITEM_IDS.every(id => d.checklist[id] === 2)){
    badges.push({icon:'🏅', title:'Celá karta hotová – pracuje samostatně úplně ve všem'});
  }
  const streak = cleanMonthsStreak(d.violations || [], d.startDate);
  if(streak >= 1){
    badges.push({icon:'🛡️', text:String(streak), title: streak + ' ' + (streak === 1 ? 'měsíc' : (streak < 5 ? 'měsíce' : 'měsíců')) + ' bez prohřešku'});
  }
  return badges;
}

function badgesHtml(d){
  const badges = computeBadges(d);
  if(!badges.length) return '';
  return '<div class="badges-row">' + badges.map(b=>
    '<span class="badge-ico" title="' + escapeHtml(b.title) + '">' + b.icon + (b.text ? '<span class="badge-num">' + escapeHtml(b.text) + '</span>' : '') + '</span>'
  ).join('') + '</div>';
}

function topBadgeIcon(d){
  const badges = computeBadges(d);
  if(!badges.length) return '';
  const priority = ['🏅', '🏆', '☕', '🌱', '🛡️'];
  for(const p of priority){ const b = badges.find(x => x.icon === p); if(b) return b.icon; }
  return badges[0].icon;
}

function violationsChartHtml(evList){
  const now = new Date();
  const months = [];
  for(let i = 5; i >= 0; i--){
    const dt = new Date(Date.UTC(now.getFullYear(), now.getMonth() - i, 1));
    months.push({
      key: dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0'),
      label: String(dt.getUTCMonth() + 1).padStart(2, '0') + '/' + String(dt.getUTCFullYear()).slice(2)
    });
  }
  const counts = {};
  months.forEach(m => { counts[m.key] = {yellow:0, red:0}; });
  evList.forEach(v=>{
    const key = String(v.date).slice(0, 7);
    if(counts[key]) counts[key][v.sev === 'red' ? 'red' : 'yellow']++;
  });
  const totals = months.map(m => counts[m.key].yellow + counts[m.key].red);
  const max = Math.max(1, Math.max.apply(null, totals));
  const barW = 24, gap = 12, chartH = 52;
  const totalW = months.length * (barW + gap);
  let bars = '';
  months.forEach((m, i)=>{
    const c = counts[m.key];
    const total = c.yellow + c.red;
    const hY = (c.yellow / max) * chartH;
    const hR = (c.red / max) * chartH;
    const x = i * (barW + gap);
    let y = chartH;
    if(hR > 0){ y -= hR; bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + hR + '" fill="#A63446" rx="2"></rect>'; }
    if(hY > 0){ y -= hY; bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + hY + '" fill="#C98B1F" rx="2"></rect>'; }
    if(total === 0){ bars += '<rect x="' + x + '" y="' + (chartH - 2) + '" width="' + barW + '" height="2" fill="#E7D9BE" rx="1"></rect>'; }
    else { bars += '<text x="' + (x + barW / 2) + '" y="' + (y - 4) + '" font-size="9" fill="#6B5744" text-anchor="middle">' + total + '</text>'; }
    bars += '<text x="' + (x + barW / 2) + '" y="' + (chartH + 13) + '" font-size="9" fill="#6B5744" text-anchor="middle">' + m.label + '</text>';
  });
  return '<div class="dl" style="margin-top:14px">Prohřešky po měsících</div>' +
    '<svg viewBox="0 0 ' + totalW + ' ' + (chartH + 18) + '" style="width:100%;max-width:260px;height:' + (chartH + 18) + 'px;display:block">' + bars + '</svg>' +
    '<div class="muted" style="margin-top:2px"><span style="color:#C98B1F;font-weight:700">■</span> žlutá &nbsp; <span style="color:#A63446;font-weight:700">■</span> červená</div>';
}

async function selectEmployee(id){
  activeId = id;
  openItemId = null;
  quiz = null;
  reviewId = null;
  mainEl.innerHTML = '<div class="empty-state">Načítám…</div>';
  activeData = await loadEmployee(id);
  if(!activeData){ activeData = blankEmployee('Nový zaměstnanec'); activeData.id = id; }
  await renderList();
  renderMain(true);
  if(window.matchMedia('(max-width:760px)').matches) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
}

  // checkbox "přečteno"
  mainEl.querySelectorAll('[data-read]').forEach(cb=>{
    cb.onchange = async ()=>{
      const id = cb.dataset.read;
      const L = ensureLearn(d, id);
      L.read = cb.checked;
      if(L.read && TESTS[id] && !L.passed && d.checklist[id] === 0) d.checklist[id] = 3;
      if(!L.read && d.checklist[id] === 3 && !L.passed) d.checklist[id] = 0;
      await persist();
      renderMain();
    };
  });

  // test
  mainEl.querySelectorAll('[data-start-test]').forEach(b=>{
    b.onclick = ()=>{
      const tid = b.dataset.startTest;
      quiz = {id:tid, result:null, preview:(MODE==='leader'), selIdx:pickSelIdx(TESTS[tid])};
      renderMain();
    };
  });
  mainEl.querySelectorAll('[data-quiz-close]').forEach(b=>{
    b.onclick = ()=>{ quiz = null; renderMain(); };
  });
  mainEl.querySelectorAll('[data-quiz-retry]').forEach(b=>{
    b.onclick = ()=>{ quiz = {id:quiz.id, result:null, preview:quiz.preview, selIdx:pickSelIdx(TESTS[quiz.id])}; renderMain(); };
  });
  const submit = $('quizSubmit');
  if(submit) submit.onclick = async ()=>{
    const id = quiz.id;
    const T = TESTS[id];
    const shownQ = quiz.selIdx.map(i => T.questions[i]);
    const answers = shownQ.map((q,i)=>{
      const el = mainEl.querySelector('input[name="q' + i + '"]:checked');
      return el ? parseInt(el.value, 10) : null;
    });
    if(answers.indexOf(null) !== -1){ $('quizMsg').textContent = 'Odpověz prosím na všechny otázky.'; return; }
    let correct = 0;
    shownQ.forEach((q,i)=>{ if(answers[i] === q.correct) correct++; });
    const total = shownQ.length;
    const pct = Math.round(correct / total * 100);
    const passed = T.passMin ? correct >= T.passMin : pct >= T.passPct;
    if(!quiz.preview){
      const L = ensureLearn(d, id);
      if(passed){ L.passed = true; L.score = pct; }
      else if(!L.passed){ L.score = pct; }
      L.answers = answers.slice();
      L.questionIdx = quiz.selIdx.slice();
      L.attemptedAt = todayStr();
      const cur = d.checklist[id];
      if(passed){ if(RANK[T.onPass] > RANK[cur]) d.checklist[id] = T.onPass; }
      else if(cur === 0){ d.checklist[id] = 3; }
      await persist();
    }
    quiz.result = {correct, total, pct, passed, answers: answers.slice(), selIdx: quiz.selIdx.slice()};
    renderMain();
  };

  const printBtn = $('printBtn');
  if(printBtn) printBtn.onclick = ()=>{
    $('printArea').innerHTML = printCardHtml(d, leader);
    window.print();
  };

  if(!leader) return;

  // ruční změna stavu
  mainEl.querySelectorAll('[data-cycle]').forEach(p=>{
    p.onclick = async e=>{
      e.stopPropagation();
      const id = p.dataset.cycle;
      d.checklist[id] = CYCLE[(CYCLE.indexOf(d.checklist[id]) + 1) % CYCLE.length];
      await persist();
      renderMain();
    };
  });

  // návody (sdílené)
  mainEl.querySelectorAll('[data-guide]').forEach(ta=>{
    ta.onchange = async ()=>{
      guides[ta.dataset.guide] = ta.value;
      try{ await saveGuides(); }catch(e){ console.error('Uložení návodu selhalo', e); }
      renderMain();
    };
  });

  mainEl.querySelectorAll('[data-review-open]').forEach(b=>{
    b.onclick = ()=>{ reviewId = b.dataset.reviewOpen; quiz = null; renderMain(); };
  });
  mainEl.querySelectorAll('[data-review-close]').forEach(b=>{
    b.onclick = ()=>{ reviewId = null; renderMain(); };
  });

  mainEl.querySelectorAll('[data-reset-learn]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.resetLearn;
      delete d.learn[id];
      if(d.checklist[id] === 3) d.checklist[id] = 0;
      quiz = null;
      if(reviewId === id) reviewId = null;
      await persist();
      renderMain();
    };
  });

  // hlavička
  $('f-name').onchange = async e=>{
    d.name = e.target.value || 'Nový zaměstnanec';
    await persist();
    const idx = employees.find(x=>x.id === d.id);
    if(idx) idx.name = d.name;
    await saveIndex();
    await renderList();
  };
  $('reportOneBtn').onclick = ()=>{
    sendReport('Report zaměstnance – ' + d.name + ' – ' + todayStr(), buildSingleReport(d));
  };
  $('f-phone').onchange = async e=>{ d.phone = e.target.value; await persist(); };
  $('f-start').onchange = async e=>{ d.startDate = e.target.value; await persist(); };
  $('f-level').onchange = async e=>{ d.level = e.target.value; await persist(); renderMain(); };
  $('photoInput').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    try{ d.photo = await resizeImage(file, 300, 0.82); await persist(); renderMain(); }
    catch(err){ console.error('Zpracování fotky selhalo', err); }
  });

  // prohřešky
  const addVio = async type=>{
    let date = $('vioDate').value || todayStr();
    if(date > todayStr()) date = todayStr();
    d.violations.push({id:uid(), date, category:$('vioCat').value, type, note:$('vioNote').value.trim()});
    await persist();
    renderMain();
  };
  $('addVio').onclick = ()=>addVio('auto');
  $('addVioRed').onclick = ()=>addVio('red');
  mainEl.querySelectorAll('[data-del-vio]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(btn.dataset.armed !== '1'){ btn.dataset.armed = '1'; btn.textContent = 'Opravdu?'; return; }
      d.violations = d.violations.filter(v=>v.id !== btn.dataset.delVio);
      await persist();
      renderMain();
    };
  });

  // poznámky
  $('addNote').onclick = async ()=>{
    const text = $('noteText').value.trim();
    if(!text) return;
    d.notes.push({date:todayStr(), author:$('noteAuthor').value.trim(), text});
    await persist();
    renderMain();
  };

  // smazání zaměstnance
  const delBtn = $('deleteEmp');
  delBtn.onclick = async ()=>{
    if(delBtn.dataset.armed !== '1'){
      delBtn.dataset.armed = '1';
      delBtn.textContent = 'Opravdu smazat? (klikni znovu)';
      return;
    }
    await deleteEmployee(d.id);
    employees = employees.filter(x=>x.id !== d.id);
    await saveIndex();
    activeId = null; activeData = null; openItemId = null; quiz = null;
    await renderList();
    mainEl.innerHTML = '<div class="empty-state">Vyber zaměstnance vlevo, nebo přidej nového.</div>';
  };
}

function employeeReportLines(d){
  const ev = evaluateViolations(d.violations);
  const totalItems = ALL_ITEM_IDS.length;
  const doneItems = ALL_ITEM_IDS.filter(id=>d.checklist[id] === 2).length;
  const cardState = ev.reds.length ? 'ČERVENÁ KARTA' : (ev.active.length ? 'žlutá karta do ' + fmtMs(ev.until) : 'bez karty');
  const lines = [];
  lines.push('• ' + d.name + ' (' + LEVELS[d.level].label + ')');
  lines.push('  Postup: ' + doneItems + '/' + totalItems + ' položek samostatně. Prohřešky: ' + cardState + '. Osobní ohodnocení: ' + ev.bonusPct + ' %.');
  const testIds = ALL_ITEM_IDS.filter(id=>TESTS[id]);
  testIds.forEach(id=>{
    const label = (CHECKLIST_GROUPS.flatMap(g=>g.items).find(it=>it[0] === id) || [id, id])[1];
    const L = d.learn[id] || {};
    const stav = L.passed ? ('splněn, ' + L.score + ' %') : (L.score != null ? ('nesplněn, poslední pokus ' + L.score + ' %') : 'zatím neproběhl');
    lines.push('  - Test „' + label + '“: ' + stav);
  });
  return lines;
}

async function buildFullReport(){
  const lines = ['Report karet zaměstnanců – ' + fmtStr(todayStr()), ''];
  for(const e of employees){
    const d = normalize(await loadEmployee(e.id));
    if(!d) continue;
    lines.push.apply(lines, employeeReportLines(d));
    lines.push('');
  }
  return lines.join('\n');
}

function buildSingleReport(d){
  const lines = ['Report zaměstnance – ' + fmtStr(todayStr()), ''];
  lines.push.apply(lines, employeeReportLines(d));
  return lines.join('\n');
}

function sendReport(subject, body){
  if(body.length > 1500){
    window.prompt('Report je delší, e-mailový odkaz by ho mohl oříznout. Zkopíruj si text (Ctrl+C, Ctrl+A) a vlož do e-mailu s předmětem: ' + subject, body);
    return;
  }
  window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

/* ==================== MĚSÍČNÍ REPORT A UZÁVĚRKA ==================== */
function periodText(){
  return (SETTINGS.closedFrom ? 'od ' + fmtStr(SETTINGS.closedFrom) : 'od začátku') + ' do ' + fmtStr(todayStr());
}
async function buildMonthRows(){
  const rows = [];
  for(const e of employees){
    const d = normalize(await loadEmployee(e.id));
    if(!d) continue;
    const ev = evaluateViolations(d.violations);
    const cur = ev.list.filter(v=>!v.closed);
    const tests = ALL_ITEM_IDS.filter(id=>TESTS[id]);
    rows.push({
      d: d,
      done: ALL_ITEM_IDS.filter(id=>d.checklist[id] === 2).length,
      yellow: cur.filter(v=>v.sev === 'yellow').length,
      red: cur.filter(v=>v.sev === 'red').length,
      bonus: ev.bonusPct,
      testsOk: tests.filter(id=>(d.learn[id] || {}).passed).length,
      testsAll: tests.length
    });
  }
  rows.sort((a, b)=>a.d.name.localeCompare(b.d.name, 'cs'));
  return rows;
}
async function buildMonthText(){
  const lines = ['Měsíční report karet zaměstnanců – období ' + periodText(), ''];
  for(const e of employees){
    const d = normalize(await loadEmployee(e.id));
    if(!d) continue;
    lines.push.apply(lines, employeeReportLines(d));
    lines.push('');
  }
  return lines.join('\n');
}
async function renderMonthReport(){
  activeId = null;
  activeData = null;
  await renderList();
  const rows = await buildMonthRows();
  const text = await buildMonthText();
  let h = '<button class="to-list" id="toListBtn">↑ Seznam zaměstnanců</button>' +
    '<section class="block"><h2>Měsíční report a uzávěrka</h2>' +
    '<div class="muted">Období: <b>' + periodText() + '</b>. Na začátku měsíce report odešli a pak období uzavři – prohřešky se tím vynulují a osobní ohodnocení začne nový měsíc od 100 %. Pokrok v checklistu a testy zůstávají.</div>';
  if(!rows.length){
    h += '<div class="muted" style="margin-top:12px">Zatím nejsou žádní zaměstnanci.</div>';
  } else {
    h += '<div class="table-scroll"><table class="month-table"><tr><th>Zaměstnanec</th><th>Úroveň</th><th>Pokrok</th><th>Prohřešky</th><th>Ohodnocení</th><th>Testy</th></tr>' +
      rows.map(r=>'<tr><td>' + escapeHtml(r.d.name) + '</td><td>' + LEVELS[r.d.level].label + '</td>' +
        '<td class="num">' + r.done + ' / ' + ALL_ITEM_IDS.length + '</td>' +
        '<td class="num">' + (r.yellow || r.red ? (r.yellow ? r.yellow + '× žlutá ' : '') + (r.red ? r.red + '× červená' : '') : '–') + '</td>' +
        '<td class="num"><b>' + r.bonus + ' %</b></td><td class="num">' + r.testsOk + ' / ' + r.testsAll + '</td></tr>').join('') +
      '</table></div>';
  }
  h += '<div class="dl" style="margin-top:14px">Komu poslat report</div>' +
    '<input class="mail-to" id="mailTo" placeholder="např. andrej@sladkadilna.cz, ucetni@…" value="' + escapeHtml(SETTINGS.emails || '') + '">' +
    '<div class="muted" style="margin-top:4px">Adresy odděl čárkou. Uloží se pro příště.</div>' +
    '<div class="dl" style="margin-top:14px">Text reportu</div>' +
    '<textarea class="report-text" id="reportText" readonly>' + escapeHtml(text) + '</textarea>' +
    '<div class="row" style="margin-top:8px">' +
      '<button class="btn" id="mailReport">✉ Připravit e-mail</button>' +
      '<button class="btn ghost" id="copyReport">Zkopírovat text</button>' +
    '</div>' +
    '<div class="row" style="margin-top:18px">' +
      '<button class="btn red" id="closeMonth" data-armed="0">Uzavřít období a vynulovat prohřešky</button>' +
    '</div><div class="muted" id="monthMsg" style="margin-top:6px"></div>' +
    '</section>';
  if(SETTINGS.history && SETTINGS.history.length){
    h += '<section class="block"><h2>Uzavřená období</h2>' + SETTINGS.history.map(x=>
      '<div class="hist-item"><details><summary>' + (x.from ? fmtStr(x.from) : 'začátek') + ' – ' + fmtStr(x.closedAt) + '</summary><pre>' + escapeHtml(x.text) + '</pre></details></div>'
    ).join('') + '</section>';
  }
  mainEl.innerHTML = h;
  window.scrollTo(0, 0);
  if(window.matchMedia('(max-width:760px)').matches) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
  $('toListBtn').onclick = ()=>{ window.scrollTo({top:0, behavior:'smooth'}); };
  $('mailTo').onchange = async ()=>{ SETTINGS.emails = $('mailTo').value.trim(); await saveSettings(); };
  $('mailReport').onclick = async ()=>{
    SETTINGS.emails = $('mailTo').value.trim();
    await saveSettings();
    const to = SETTINGS.emails.split(/[,;\s]+/).filter(Boolean).join(',');
    const subject = 'Měsíční report karet zaměstnanců – ' + periodText();
    if(text.length > 1500){
      $('monthMsg').textContent = 'Report je dlouhý, e-mail by ho mohl oříznout. Otevírám e-mail s předmětem a adresou – text vlož tlačítkem „Zkopírovat text“.';
      window.location.href = 'mailto:' + encodeURIComponent(to).replace(/%2C/g, ',') + '?subject=' + encodeURIComponent(subject);
      return;
    }
    window.location.href = 'mailto:' + encodeURIComponent(to).replace(/%2C/g, ',') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text);
  };
  $('copyReport').onclick = async ()=>{
    const ta = $('reportText');
    try{ await navigator.clipboard.writeText(ta.value); $('monthMsg').textContent = 'Text zkopírován – vlož ho do e-mailu (Ctrl+V).'; }
    catch(e){ ta.focus(); ta.select(); $('monthMsg').textContent = 'Text je označený – zkopíruj ho Ctrl+C.'; }
  };
  $('closeMonth').onclick = async ()=>{
    const b = $('closeMonth');
    if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Opravdu uzavřít? Klikni znovu'; return; }
    SETTINGS.history = [{closedAt: todayStr(), from: SETTINGS.closedFrom || '', text: text}].concat(SETTINGS.history || []).slice(0, 24);
    SETTINGS.closedFrom = todayStr();
    await saveSettings();
    await renderMonthReport();
    $('monthMsg').textContent = 'Období uzavřeno. Nové období začíná dnes.';
  };
}

          '<button class="q-tool" data-opt-del="' + i + ',' + j + '" title="Smazat odpověď">✕</button></div>'
        ).join('') +
        '<button class="add-link" data-opt-add="' + i + '">+ odpověď</button></div>'
      ).join('') +

      '<div class="row" style="margin-top:14px"><button class="btn" id="cfgSave">Uložit test</button>' +
      '<button class="btn ghost" id="cfgCancel">Zahodit změny</button>' +
      (TESTS[cfgTestId] ? '<button class="btn red" id="cfgDelTest" data-armed="0">Smazat test</button>' : '') + '</div>' +
      '<div class="muted" style="margin-top:6px">Změna otázek neruší už splněné testy. Po uložení nezapomeň kartu publikovat.</div>';
  }
  h += '<div class="cfg-msg' + (msgKind ? ' ' + msgKind : '') + '" id="cfgMsg">' + (msg || '') + '</div>';
  mainEl.innerHTML = cfgShell(h);
  bindCfgShell();
  $('cfgTestSel').onchange = ()=>{
    if(cfgDraft && JSON.stringify(cfgDraft) !== JSON.stringify(TESTS[cfgTestId] || null) && !confirm('Máš neuložené změny v testu. Zahodit je?')){ $('cfgTestSel').value = cfgTestId; return; }
    cfgTestId = $('cfgTestSel').value; cfgDraft = null; renderCfgTests();
  };
  if(!T){
    $('cfgCreate').onclick = ()=>{
      cfgDraft = {title: itemLabel(cfgTestId), passPct: 80, onPass: 2, draft: true, questions: [{q:'', options:['', ''], correct:0}]};
      renderCfgTests();
    };
    return;
  }
  $('cfgTitle').oninput = e=>{ T.title = e.target.value; };
  $('cfgMode').onchange = e=>{
    if(e.target.value === 'min'){ T.passMin = Math.max(1, Math.round((T.passPct || 80) / 100 * (T.display || T.questions.length))); delete T.passPct; }
    else { T.passPct = 80; delete T.passMin; }
    renderCfgTests();
  };
  $('cfgNeed').oninput = e=>{ const v = parseInt(e.target.value, 10) || 0; if(T.passMin !== undefined) T.passMin = v; else T.passPct = v; };
  $('cfgDisplay').oninput = e=>{ const v = parseInt(e.target.value, 10); if(v > 0) T.display = v; else delete T.display; };
  $('cfgOnPass').onchange = e=>{ T.onPass = parseInt(e.target.value, 10); };
  $('cfgDraftChk').onchange = e=>{ T.draft = e.target.checked; };
  $('cfgTodo').oninput = e=>{ T.todo = e.target.value; if(!T.todo) delete T.todo; };
  mainEl.querySelectorAll('[data-q]').forEach(el=>{ el.oninput = ()=>{ T.questions[+el.dataset.q].q = el.value; }; });
  mainEl.querySelectorAll('[data-opt]').forEach(el=>{ el.oninput = ()=>{ const p = el.dataset.opt.split(','); T.questions[+p[0]].options[+p[1]] = el.value; }; });
  mainEl.querySelectorAll('[data-corr]').forEach(el=>{
    el.onchange = ()=>{
      T.questions[+el.dataset.corr].correct = +el.value;
      el.closest('.q-edit').querySelectorAll('.opt-row').forEach((r, j)=>r.classList.toggle('ok', j === +el.value));
    };
  });
  const move = (i, d)=>{ const j = i + d; if(j < 0 || j >= T.questions.length) return; const x = T.questions[i]; T.questions[i] = T.questions[j]; T.questions[j] = x; renderCfgTests(); };
  mainEl.querySelectorAll('[data-q-up]').forEach(b=>{ b.onclick = ()=>move(+b.dataset.qUp, -1); });
  mainEl.querySelectorAll('[data-q-down]').forEach(b=>{ b.onclick = ()=>move(+b.dataset.qDown, 1); });
  mainEl.querySelectorAll('[data-q-del]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Smazat?'; return; }
      T.questions.splice(+b.dataset.qDel, 1); renderCfgTests();
    };
  });
  mainEl.querySelectorAll('[data-opt-add]').forEach(b=>{ b.onclick = ()=>{ T.questions[+b.dataset.optAdd].options.push(''); renderCfgTests(); }; });
  mainEl.querySelectorAll('[data-opt-del]').forEach(b=>{
    b.onclick = ()=>{
      const p = b.dataset.optDel.split(',').map(Number);
      const q = T.questions[p[0]];
      if(q.options.length <= 2){ $('cfgMsg').className = 'cfg-msg err'; $('cfgMsg').textContent = 'Otázka musí mít aspoň dvě odpovědi.'; return; }
      q.options.splice(p[1], 1);
      if(q.correct === p[1]) q.correct = 0; else if(q.correct > p[1]) q.correct--;
      renderCfgTests();
    };
  });
  $('cfgAddQ').onclick = ()=>{
    T.questions.push({q:'', options:['', '', ''], correct:0});
    renderCfgTests();
    const all = mainEl.querySelectorAll('.q-text'); const last = all[all.length - 1];
    if(last){ last.scrollIntoView({block:'center'}); last.focus(); }
  };
  $('cfgCancel').onclick = ()=>{ cfgDraft = null; renderCfgTests('Změny zahozeny.'); };
  $('cfgSave').onclick = async ()=>{
    const err = validateTest(T);
    if(err){ renderCfgTests(err, 'err'); return; }
    T.questions.forEach(q=>{ q.q = q.q.trim(); q.options = q.options.map(o=>o.trim()); });
    TESTS[cfgTestId] = JSON.parse(JSON.stringify(T));
    SETTINGS.tests = JSON.parse(JSON.stringify(TESTS));
    await saveSettings();
    cfgDraft = null;
    renderCfgTests('Test uložen.', 'ok');
  };
  const del = $('cfgDelTest');
  if(del) del.onclick = async ()=>{
    if(del.dataset.armed !== '1'){ del.dataset.armed = '1'; del.textContent = 'Opravdu smazat test? Klikni znovu'; return; }
    delete TESTS[cfgTestId];
    SETTINGS.tests = JSON.parse(JSON.stringify(TESTS));
    await saveSettings();
    cfgDraft = null;
    renderCfgTests('Test smazán. Výsledky zaměstnanců zůstaly uložené.', 'ok');
  };
}
function validateTest(T){
  if(!T.title || !T.title.trim()) return 'Vyplň název testu.';
  if(!T.questions.length) return 'Test musí mít aspoň jednu otázku.';
  for(let i = 0; i < T.questions.length; i++){
    const q = T.questions[i];
    if(!q.q || !q.q.trim()) return 'Otázka ' + (i + 1) + ' nemá text.';
    if(q.options.filter(o=>o && o.trim()).length < q.options.length) return 'Otázka ' + (i + 1) + ' má prázdnou odpověď – vyplň ji, nebo ji smaž.';
    if(q.options.length < 2) return 'Otázka ' + (i + 1) + ' musí mít aspoň dvě odpovědi.';
    if(!(q.correct >= 0 && q.correct < q.options.length)) return 'U otázky ' + (i + 1) + ' označ správnou odpověď.';
  }
  const shown = T.display && T.display < T.questions.length ? T.display : T.questions.length;
  if(T.passMin !== undefined && (T.passMin < 1 || T.passMin > shown)) return 'Počet potřebných správných odpovědí musí být 1 až ' + shown + '.';
  if(T.passPct !== undefined && (T.passPct < 1 || T.passPct > 100)) return 'Procento pro splnění musí být 1 až 100.';
  return '';
}

      '<button class="q-tool" data-g-del="' + gi + '" title="Smazat skupinu">✕</button></span></div><div class="cl-items">' +
      g.items.map((it, ii)=>
        '<div class="cl-row"><input type="text" class="grow" data-i-name="' + gi + ',' + ii + '" value="' + escapeHtml(it[1]) + '" placeholder="Název položky">' +
        (W.length > 1 ? '<select class="sel-group" data-i-move="' + gi + ',' + ii + '" title="Přesunout do skupiny">' + W.map((x, k)=>'<option value="' + k + '"' + (k === gi ? ' selected' : '') + '>' + escapeHtml(x.group || 'Skupina ' + (k + 1)) + '</option>').join('') + '</select>' : '') +

      ).join('') +

  mainEl.querySelectorAll('[data-g-icon]').forEach(el=>{ el.oninput = ()=>{ W[+el.dataset.gIcon].icon = el.value.trim(); markWork(); }; });
  mainEl.querySelectorAll('[data-i-name]').forEach(el=>{ el.oninput = ()=>{ const p = P(el.dataset.iName); W[p[0]].items[p[1]][1] = el.value; markWork(); }; });

  mainEl.querySelectorAll('[data-g-up]').forEach(b=>{ b.onclick = ()=>swap(W, +b.dataset.gUp, +b.dataset.gUp - 1); });
  mainEl.querySelectorAll('[data-g-down]').forEach(b=>{ b.onclick = ()=>swap(W, +b.dataset.gDown, +b.dataset.gDown + 1); });
  mainEl.querySelectorAll('[data-i-up]').forEach(b=>{ const p = P(b.dataset.iUp); b.onclick = ()=>swap(W[p[0]].items, p[1], p[1] - 1); });
  mainEl.querySelectorAll('[data-i-down]').forEach(b=>{ const p = P(b.dataset.iDown); b.onclick = ()=>swap(W[p[0]].items, p[1], p[1] + 1); });
  mainEl.querySelectorAll('[data-i-move]').forEach(sel=>{
    sel.onchange = ()=>{ const p = P(sel.dataset.iMove); const it = W[p[0]].items.splice(p[1], 1)[0]; W[+sel.value].items.push(it); markWork(); renderCfgChecklist(); };

    }
    if(!W.some(g=>g.items.length)) return renderCfgChecklist('Checklist musí mít aspoň jednu položku.', 'err');
    W.forEach(g=>{ g.group = g.group.trim(); g.items.forEach(it=>{ it[1] = it[1].trim(); }); });
    SETTINGS.checklist = JSON.parse(JSON.stringify(W));
    await saveSettings();
    applyConfig();
    cfgWork = null; cfgWorkDirty = false;
    await renderList();
    renderCfgChecklist('Checklist uložen.', 'ok');
  };
}

/* ---- Úrovně a sazby ---- */
const LEVEL_COLORS = {zelena:['Zelená','var(--sage)'], karamel:['Karamelová','var(--caramel-deep)'], vinova:['Vínová','var(--cherry)'], modra:['Modrá','#3E6A8A'], cokolada:['Čokoládová','var(--cocoa)']};
function levelColor(id){
  const l = LEVELS[id];
  if(l && l.color && LEVEL_COLORS[l.color]) return LEVEL_COLORS[l.color][1];
  return id === 'expert' ? 'var(--cherry)' : id === 'pokrocily' ? 'var(--caramel-deep)' : 'var(--sage)';
}
function defaultColorKey(id){ return id === 'expert' ? 'vinova' : id === 'pokrocily' ? 'karamel' : 'zelena'; }
function renderCfgLevels(msg, kind){
  if(!cfgWork) cfgWork = Object.keys(LEVELS).map(k=>({id:k, label:LEVELS[k].label, base:LEVELS[k].base, bonus:LEVELS[k].bonus, color:LEVELS[k].color || defaultColorKey(k)}));
  const W = cfgWork;
  let h = '<div class="muted">Sazba je základní hodinová mzda. Osobní ohodnocení je částka navíc při 100 % – při žluté kartě se vyplácí polovina, při červené nic. Barva je barva razítka v kolečku zaměstnance. Pořadí určuje, jak se úrovně nabízejí na kartě.</div>' +
    W.map((l, i)=>
      '<div class="cl-group"><div class="lvl-row" style="grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1fr) auto">' +
      '<div class="cfg-field" style="margin:0">Název úrovně<input data-lv="' + i + ',label" value="' + escapeHtml(l.label) + '"></div>' +
      '<div class="cfg-field" style="margin:0">Sazba Kč/h<input type="number" min="0" data-lv="' + i + ',base" value="' + l.base + '"></div>' +
      '<div class="cfg-field" style="margin:0">Ohodnocení Kč/h<input type="number" min="0" data-lv="' + i + ',bonus" value="' + l.bonus + '"></div>' +
      '<div class="cfg-field" style="margin:0">Barva<select data-lv="' + i + ',color">' + Object.keys(LEVEL_COLORS).map(c=>'<option value="' + c + '"' + (l.color === c ? ' selected' : '') + '>' + LEVEL_COLORS[c][0] + '</option>').join('') + '</select></div>' +
      '<span class="q-tools" style="align-self:end;padding-bottom:6px"><button class="q-tool" data-l-up="' + i + '">↑</button><button class="q-tool" data-l-down="' + i + '">↓</button><button class="q-tool" data-l-del="' + i + '" title="Smazat úroveň">✕</button></span>' +
      '</div></div>'
    ).join('') +
    '<button class="add-link" id="lvlAdd">+ Přidat úroveň</button>' + cfgButtons() + cfgMsgHtml(msg, kind);
  mainEl.innerHTML = cfgShell(h);
  bindCfgShell();
  mainEl.querySelectorAll('[data-lv]').forEach(el=>{
    const handler = ()=>{ const p = el.dataset.lv.split(','); const f = p[1]; W[+p[0]][f] = (f === 'label' || f === 'color') ? el.value : (parseInt(el.value, 10) || 0); markWork(); };
    el.oninput = handler; el.onchange = handler;
  });
  const swap = (i, j)=>{ if(j < 0 || j >= W.length) return; const x = W[i]; W[i] = W[j]; W[j] = x; markWork(); renderCfgLevels(); };
  mainEl.querySelectorAll('[data-l-up]').forEach(b=>{ b.onclick = ()=>swap(+b.dataset.lUp, +b.dataset.lUp - 1); });
  mainEl.querySelectorAll('[data-l-down]').forEach(b=>{ b.onclick = ()=>swap(+b.dataset.lDown, +b.dataset.lDown + 1); });

    for(const l of W) if(!String(l.label).trim()) return renderCfgLevels('Každá úroveň musí mít název.', 'err');
    // smazanou úroveň nesmí mít žádný zaměstnanec
    const removed = Object.keys(LEVELS).filter(k=>!W.some(l=>l.id === k));
    if(removed.length){

    await saveSettings();
    applyConfig();
    cfgWork = null; cfgWorkDirty = false;
    renderCfgLevels('Úrovně a sazby uloženy.', 'ok');
  };
}

    b.onclick = ()=>{
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Smazat?'; return; }
      W.cats.splice(+b.dataset.cDel, 1); markWork(); renderCfgViolations();
    };
  });
  $('cAdd').onclick = ()=>{ W.cats.push({id:newId('c'), name:'', desc:''}); markWork(); renderCfgViolations(); const ins = mainEl.querySelectorAll('[data-c-name]'); ins[ins.length - 1].focus(); };
  $('cfgWCancel').onclick = ()=>{ cfgWork = null; cfgWorkDirty = false; renderCfgViolations('Změny zahozeny.'); };
  $('cfgWSave').onclick = async ()=>{
    if(!(W.days >= 1)) return renderCfgViolations('Doba platnosti žluté karty musí být aspoň 1 den.', 'err');
    for(const c of W.cats) if(!c.name.trim()) return renderCfgViolations('Každá kategorie musí mít název.', 'err');
    // názvy smazaných kategorií si pamatuj kvůli starým prohřeškům
    SETTINGS.oldCats = SETTINGS.oldCats || {};
    EXPECTATIONS.forEach(e=>{ if(!W.cats.some(c=>c.id === e[0])) SETTINGS.oldCats[e[0]] = e[1]; });
    SETTINGS.categories = W.cats.map(c=>({id:c.id, name:c.name.trim(), desc:(c.desc || '').trim()}));
    SETTINGS.violationDays = W.days;
    await saveSettings();
    applyConfig();
    cfgWork = null; cfgWorkDirty = false;
    renderCfgViolations('Nastavení prohřešků uloženo.', 'ok');
  };
}

/* ---- Návody ze znalostní báze ---- */
async function loadKbArticles(){
  if(kbArticles) return;
  try{
    const res = await fetch('../data.js?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('http');
    const t = await res.text();
    const j = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));
    kbArticles = (j.seedAll || []).map(a=>({id:a.id, title:a.title, section:a.section}));
    kbArticles.sort((a, b)=>a.title.localeCompare(b.title, 'cs'));
  }catch(e){
    kbArticles = [];
    kbLoadError = 'Seznam článků znalostní báze se nepodařilo načíst (funguje jen na webu GitHubu). Odebírat odkazy můžeš i tak.';
  }
}
async function renderCfgKb(){
  await loadKbArticles();
  let h = '<div class="muted">U každé položky checklistu vyber články ze znalostní báze – zaměstnanec je uvidí jako tlačítka 📖. Změny se ukládají hned.</div>' +
    (kbLoadError ? '<div class="cfg-msg err">' + kbLoadError + '</div>' : '');
  CHECKLIST_GROUPS.forEach(g=>{
    h += '<div class="dl" style="margin-top:14px">' + escapeHtml(g.group) + '</div>';
    g.items.forEach(it=>{
      const links = KB_LINKS[it[0]] || [];
      const free = kbArticles.filter(a=>!links.some(l=>l[0] === a.id));
      h += '<div class="kb-row"><b>' + escapeHtml(it[1]) + '</b><div class="kb-chips">' +
        (links.length ? links.map((l, k)=>'<span class="kb-chip">📖 ' + escapeHtml(l[1]) + '<button data-kb-del="' + it[0] + ',' + k + '" title="Odebrat">✕</button></span>').join('') : '<span class="muted">zatím žádný článek</span>') +
        '</div>' + (free.length ? '<select class="cfg-select" data-kb-add="' + it[0] + '"><option value="">+ přidat článek…</option>' +
          free.map(a=>'<option value="' + a.id + '">' + escapeHtml(a.title) + '</option>').join('') + '</select>' : '') + '</div>';
    });
  });
  h += '<div class="cfg-msg" id="cfgMsg"></div>';
  mainEl.innerHTML = cfgShell(h);
  bindCfgShell();
  const store = async ()=>{ SETTINGS.kbLinks = JSON.parse(JSON.stringify(KB_LINKS)); await saveSettings(); };
  mainEl.querySelectorAll('[data-kb-del]').forEach(b=>{
    b.onclick = async ()=>{
      const p = b.dataset.kbDel.split(',');
      KB_LINKS[p[0]].splice(+p[1], 1);
      if(!KB_LINKS[p[0]].length) delete KB_LINKS[p[0]];
      await store(); renderCfgKb();
    };
  });
  mainEl.querySelectorAll('[data-kb-add]').forEach(sel=>{
    sel.onchange = async ()=>{
      const a = kbArticles.find(x=>x.id === sel.value);
      if(!a) return;
      const id = sel.dataset.kbAdd;
      if(!KB_LINKS[id]) KB_LINKS[id] = [];
      KB_LINKS[id].push([a.id, a.title]);
      await store(); renderCfgKb();
    };
  });
}

/* ==================== HISTORIE ZMĚN (z publikací na GitHubu) ==================== */
async function fetchCardCommits(){
  const url = 'https://api.github.com/repos/' + GH_REPO + '/commits?path=' + GH_FILE + '&per_page=30';
  const token = lsGet('kb-gh-token');
  let res = token ? await fetch(url, {headers:{'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + token}, cache:'no-store'}) : null;
  if(!res || !res.ok) res = await fetch(url, {headers:{'Accept':'application/vnd.github+json'}, cache:'no-store'});
  if(!res.ok) throw new Error('commits');
  return await res.json();
}
async function fetchCardVersion(sha){
  const raw = await fetch('https://raw.githubusercontent.com/' + GH_REPO + '/' + sha + '/' + GH_FILE);
  if(!raw.ok) return null;
  const t = await raw.text();
  if(t.indexOf('CARD_DATA') === -1) return null;   // omylem nahraný jiný soubor
  try{ return JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)); }catch(e){ return null; }
}
function stLabel(v){ return STATES[v || 0] || String(v); }
function diffEmployee(p, c){
  const out = [];
  if(p.name !== c.name) out.push('jméno „' + p.name + '“ → „' + c.name + '“');
  if(p.level !== c.level) out.push('úroveň ' + ((LEVELS[p.level] || {}).label || p.level) + ' → ' + ((LEVELS[c.level] || {}).label || c.level));
  if((p.phone || '') !== (c.phone || '')) out.push('telefon');
  if((p.startDate || '') !== (c.startDate || '')) out.push('datum nástupu');
  if((p.photo || '') !== (c.photo || '')) out.push('fotka');
  const ids = Object.keys(Object.assign({}, p.checklist || {}, c.checklist || {}));
  ids.forEach(id=>{
    const a = (p.checklist || {})[id] || 0, b = (c.checklist || {})[id] || 0;
    if(a !== b) out.push(itemLabel(id) + ': ' + stLabel(a) + ' → ' + stLabel(b));
  });
  const lids = Object.keys(Object.assign({}, p.learn || {}, c.learn || {}));
  lids.forEach(id=>{
    const a = (p.learn || {})[id] || {}, b = (c.learn || {})[id] || {};
    if(!a.read && b.read) out.push(itemLabel(id) + ': návod přečten');
    if(a.read && !b.read) out.push(itemLabel(id) + ': přečtení zrušeno');
    if(!a.passed && b.passed) out.push(itemLabel(id) + ': test splněn (' + b.score + ' %)');
    else if(!b.passed && b.score != null && b.score !== a.score) out.push(itemLabel(id) + ': pokus o test ' + b.score + ' %');
    if(a.passed && !b.passed && b.score == null) out.push(itemLabel(id) + ': test vynulován');
  });
  const pv = {}, cv = {};
  (p.violations || []).forEach(v=>{ pv[v.id] = v; });
  (c.violations || []).forEach(v=>{ cv[v.id] = v; });
  Object.keys(cv).forEach(id=>{ if(!pv[id]) out.push('nový prohřešek: ' + catName(cv[id].category) + ' (' + fmtStr(cv[id].date) + ')' + (cv[id].type === 'red' ? ' – rovnou červená' : '')); });
  Object.keys(pv).forEach(id=>{ if(!cv[id]) out.push('smazán prohřešek: ' + catName(pv[id].category) + ' (' + fmtStr(pv[id].date) + ')'); });
  const pn = (p.notes || []).length, cn = (c.notes || []).length;
  if(cn > pn) (c.notes || []).slice(pn).forEach(n=>out.push('poznámka: „' + String(n.text || '').slice(0, 60) + (String(n.text || '').length > 60 ? '…' : '') + '“'));
  if(cn < pn) out.push('smazané poznámky (' + (pn - cn) + ')');
  return out;
}
function diffCardData(prev, cur){
  const groups = [];
  const P = prev.data || {}, C = cur.data || {};
  const names = {};
  (prev.employees || []).concat(cur.employees || []).forEach(e=>{ names[e.id] = e.name; });
  Object.keys(C).forEach(id=>{
    if(!P[id]){ groups.push({label:(C[id].name || names[id]), items:['nový zaměstnanec']}); return; }
    const ch = diffEmployee(P[id], C[id]);
    if(ch.length) groups.push({label:C[id].name || names[id], items:ch});
  });
  Object.keys(P).forEach(id=>{ if(!C[id]) groups.push({label:(P[id].name || names[id]), items:['karta smazána']}); });
  const ps = prev.settings || {}, cs = cur.settings || {}, set = [];
  if((ps.closedFrom || '') !== (cs.closedFrom || '')) set.push('uzávěrka období – nové období od ' + fmtStr(cs.closedFrom));
  if((ps.emails || '') !== (cs.emails || '')) set.push('adresy pro report');
  const parts = [['tests','testy'], ['kbLinks','návody z KB'], ['checklist','checklist'], ['levelList','úrovně a sazby'], ['levels','úrovně a sazby'], ['categories','kategorie prohřešků'], ['violationDays','platnost žluté karty']];
  const seen = {};
  parts.forEach(x=>{ if(JSON.stringify(ps[x[0]] || null) !== JSON.stringify(cs[x[0]] || null) && !seen[x[1]]){ seen[x[1]] = 1; set.push('změna nastavení: ' + x[1]); } });
  if(set.length) groups.push({label:'Nastavení', items:set});
  return groups;
}
async function renderCardLog(){
  activeId = null; activeData = null;
  await renderList();
  const head = '<button class="to-list" id="toListBtn">↑ Seznam zaměstnanců</button><section class="block"><h2>Historie změn</h2>' +
    '<div class="muted">Všechny publikace karty (posledních 30), od nejnovější. U každé je vidět, co se od předchozí publikace změnilo. Nepublikované změny z prohlížeče tu nejsou.</div>';
  mainEl.innerHTML = head + '<div class="muted" id="logProgress" style="margin-top:12px">Načítám historii…</div></section>';
  window.scrollTo(0, 0);
  if(window.matchMedia('(max-width:760px)').matches) mainEl.scrollIntoView({block:'start'});
  $('toListBtn').onclick = ()=>{ window.scrollTo({top:0, behavior:'smooth'}); };
  let entries = [];
  try{
    const commits = (await fetchCardCommits()).reverse();
    let prev = null;
    for(let i = 0; i < commits.length; i++){
      const pr = $('logProgress');
      if(!pr) return;   // uživatel mezitím odešel jinam
      pr.textContent = 'Načítám historii… ' + (i + 1) + '/' + commits.length;
      const data = await fetchCardVersion(commits[i].sha);
      if(!data || !Array.isArray(data.employees)) continue;
      const c = commits[i];
      const e = {date:c.commit.author.date, who:(c.author && c.author.login) || c.commit.author.name};
      e.groups = prev ? diffCardData(prev, data) : [{label:'Výchozí stav', items:['počet zaměstnanců: ' + data.employees.length]}];
      if(e.groups.length) entries.push(e);
      prev = data;
    }
  }catch(err){
    if($('logProgress')) $('logProgress').textContent = 'Historii se nepodařilo načíst z GitHubu. Zkus to za chvíli znovu.';
    return;
  }
  if(!$('logProgress')) return;
  entries = entries.reverse();
  const body = entries.length ? entries.map(e=>{
    const d = new Date(e.date);
    const when = d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    return '<div class="hist-item"><div><b>' + when + '</b> · <span class="muted">' + escapeHtml(e.who) + '</span></div>' +
      e.groups.map(g=>'<div style="margin-top:4px"><b style="color:var(--caramel-deep)">' + escapeHtml(g.label) + ':</b> ' + g.items.map(escapeHtml).join(' · ') + '</div>').join('') + '</div>';
  }).join('') : '<div class="muted" style="margin-top:12px">Zatím žádné publikované změny.</div>';
  mainEl.innerHTML = head + body + '</section>';
  $('toListBtn').onclick = ()=>{ window.scrollTo({top:0, behavior:'smooth'}); };
}

  try{
    const parsed = JSON.parse(await file.text());

    for(const id of Object.keys(parsed.data)){ await saveEmployee(normalize(parsed.data[id])); }

    if(employees.length) await selectEmployee(employees[0].id);

  }catch(e){
    $('modeNote').textContent = 'Import se nezdařil – soubor neodpovídá formátu zálohy.';
  }
  importFileInput.value = '';
});
