<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Znalostní báze – Sladká dílna</title>
<!-- offline verze – data se ukládají jen v tomto prohlížeči (localStorage) -->
<!-- v2.14 -->
<style>
  :root{
    --cream:#F7EFE0;
    --paper:#FFFDF8;
    --cocoa:#3B2A20;
    --cocoa-soft:#6B5744;
    --caramel:#B9793A;
    --caramel-deep:#8F5A24;
    --sage:#5B7B52;
    --line:#E7D9BE;
    --line-soft:#F0E5CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--cocoa);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:0;}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh;}
  @media (max-width:760px){
    .app{grid-template-columns:1fr;}
    .sidebar{border-right:none;border-bottom:1px solid var(--line);}
    .main{padding:20px 14px 60px;}
  }
  .sidebar{background:var(--paper);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;min-height:100vh;}
  .sidebar h1{font-size:18px;line-height:1.25;}
  .sidebar .sub{color:var(--cocoa-soft);font-size:12px;margin-top:4px;margin-bottom:14px;}
  
  .mode-badge{
    display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;
    margin-bottom:16px;background:var(--line-soft);color:var(--caramel-deep);
    border:none;cursor:pointer;font-family:inherit;transition:opacity 0.2s;
  }
  .mode-badge:hover{opacity:0.8;}
  .mode-badge.reader{background:#DCE6F0;color:#2F4E6B;}
  
  .section-switch{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .section-btn{
    padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--cocoa-soft);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;
  }
  .section-btn.active{background:var(--cocoa);color:#fff;border-color:var(--cocoa);}
  .axis-switch{display:flex;gap:6px;margin-bottom:14px;}
  .axis-btn{
    flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--cocoa-soft);font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .axis-btn.active{background:var(--caramel);color:#fff;border-color:var(--caramel);}
  .cat-group{margin-bottom:4px;}
  .cat-label{
    font-size:11px;font-weight:700;text-transform:uppercase;color:var(--caramel-deep);
    margin:12px 0 4px;letter-spacing:.04em;
  }
  .art-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px;}
  .art-item{
    padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;font-size:13px;
  }
  .art-item:hover{background:var(--line-soft);}
  .art-item.active{background:var(--cream);border-color:var(--caramel);}
  .art-item[draggable="true"]{cursor:grab;}
  .art-item.dragging{opacity:.4;}
  .cat-label-row{display:flex;align-items:center;gap:6px;margin:12px 0 4px;}
  .cat-label-row .cat-label{margin:0;flex:1;}
  .cat-label-edit{
    font-size:11px;font-weight:700;text-transform:uppercase;color:var(--caramel-deep);
    letter-spacing:.04em;border:none;background:transparent;outline:none;flex:1;padding:1px 2px;border-radius:4px;
  }
  .cat-label-edit:focus{background:var(--line-soft);}
  .cat-del-x{border:none;background:transparent;color:var(--cocoa-soft);cursor:pointer;font-size:13px;padding:0 3px;line-height:1;}
  .cat-del-x:hover{color:#b23b3b;}
  .cat-group.dropzone-over{background:var(--line-soft);border-radius:8px;outline:1px dashed var(--caramel);}
  .drop-indicator{height:3px;background:var(--caramel);border-radius:2px;margin:1px 0;list-style:none;pointer-events:none;}
  .cat-add-row{display:flex;gap:4px;margin:4px 0 12px;}
  .cat-add-input{flex:1;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-family:inherit;}
  .cat-add-btn{border:none;background:var(--caramel);color:#fff;border-radius:6px;width:24px;font-size:15px;cursor:pointer;line-height:1;}
  .add-btn{
    margin-top:16px;width:100%;padding:8px;border-radius:8px;
    border:1.5px dashed var(--caramel);background:transparent;color:var(--caramel-deep);
    font-weight:600;cursor:pointer;font-size:12.5px;
  }
  .add-btn:hover{background:var(--line-soft);}
  .plain-btn{
    width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--cocoa);font-weight:600;cursor:pointer;font-size:12.5px;margin-top:8px;
  }
  .plain-btn:hover{background:var(--line-soft);}
  .status{font-size:11px;color:var(--cocoa-soft);margin-top:14px;line-height:1.4;}
  .backup-row{display:flex;gap:6px;margin-top:12px;}
  .backup-btn{
    flex:1;padding:7px 4px;border-radius:6px;border:1px solid var(--line);
    background:var(--paper);color:var(--cocoa-soft);font-size:11px;cursor:pointer;
  }
  .backup-btn:hover{background:var(--line-soft);}
  .sidebar-spacer{flex:1;}
  .version-tag{font-size:9.5px;color:var(--line);margin-top:16px;text-align:right;user-select:none;}

  .main{padding:26px 30px 60px;max-width:720px;}
  .empty-state{color:var(--cocoa-soft);padding-top:60px;text-align:center;}
  .art-title{font-family:Georgia,serif;font-size:24px;font-weight:700;margin-bottom:6px;}
  .art-updated{font-size:11.5px;color:var(--cocoa-soft);margin-bottom:10px;}
  .art-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .search-box{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:12px;font-family:inherit;}
  .related-box{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);max-width:320px;}
  .related-box .art-item{cursor:pointer;}
  .search-results .cat-label{font-style:italic;}
  @media print{
    .sidebar, .row{display:none !important;}
    body.printing .main{max-width:100%;padding:0;}
  }
  .tag-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--line-soft);color:var(--cocoa-soft);}
  .art-body{font-size:15px;line-height:1.65;}
  .art-body h3, .art-h{font-family:Georgia,serif;font-weight:700;font-size:17px;margin:18px 0 6px;}
  .art-body ul, .art-ul{margin:8px 0;padding-left:22px;}
  .art-body li{margin-bottom:4px;}
  .art-body img, .inline-img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin:12px 0;display:block;}
  .fmt-toolbar{display:flex;gap:6px;margin-bottom:6px;}
  .fmt-btn{
    background:var(--line-soft);color:var(--cocoa);border:1px solid var(--line);border-radius:6px;
    padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .fmt-btn:hover{background:var(--line);}
  .img-insert{
    display:block;width:100%;margin-top:3px;background:var(--line-soft);color:var(--cocoa-soft);
    border:1px solid var(--line);border-radius:6px;font-size:10px;padding:2px 0;cursor:pointer;
  }
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:20px;}
  .btn{
    background:var(--caramel);color:#fff;border:none;border-radius:8px;
    padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .btn.ghost{background:var(--line-soft);color:var(--cocoa-soft);}
  .btn.red{background:#A63446;}

  .field-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--cocoa-soft);margin:14px 0 5px;letter-spacing:.04em;}
  .field-label:first-child{margin-top:0;}
  .field-hint{font-size:11.5px;color:var(--cocoa-soft);margin:-2px 0 6px;line-height:1.4;}
  input.f-title, input.f-video, select.f-select{
    width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;background:var(--paper);color:var(--cocoa);
  }
  input.f-title{font-family:Georgia,serif;font-size:18px;font-weight:700;}
  .tag-box{display:flex;flex-wrap:wrap;gap:7px;}
  .tag-check{
    display:flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--line);
    border-radius:8px;padding:5px 9px;cursor:pointer;background:var(--paper);
  }

  .rich-editor{
    min-height:220px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    background:var(--paper);outline:none;
  }
  .rich-editor:focus{border-color:var(--caramel);}
  .img-del-overlay{
    display:block;margin:-8px 0 12px;background:#A63446;color:#fff;border:none;border-radius:6px;
    padding:4px 9px;font-size:11.5px;cursor:pointer;
  }

  .video-block{margin-top:18px;max-width:480px;}
  .video-thumb{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
    background:var(--line-soft);cursor:pointer;
  }
  .video-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .video-play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  }
  .video-play span{
    width:54px;height:54px;border-radius:50%;background:rgba(59,42,32,.72);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .video-block iframe, .video-block video{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;}
  .video-link-btn{display:inline-block;}

  .role-row{
    display:flex;gap:8px;align-items:center;justify-content:space-between;
    background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px;
  }

  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--caramel);outline-offset:2px;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div>
      <h1>Znalostní báze</h1>
      <div class="sub">Sladká dílna</div>
      <button class="mode-badge" id="modeToggleBtn" title="Kliknutím přepneš režim"></button>

      <div id="roleSelectWrap" style="display:none;margin-bottom:14px;">
        <div class="field-label" style="margin:0 0 5px">Moje role</div>
        <select class="f-select" id="roleSelect"></select>
      </div>
      <button class="plain-btn" id="rolesBtn" style="display:none;">🔑 Spravovat role</button>
      <button class="plain-btn" id="catsBtn" style="display:none;">🏷️ Spravovat kategorie</button>

      <input class="search-box" id="searchInput" type="text" placeholder="🔍 Hledat ve všech článcích…">
      <div class="section-switch" id="sectionSwitch"></div>
      <div class="axis-switch" id="axisSwitch"></div>
      <div id="catList"></div>
      <button class="add-btn" id="addBtn" style="display:none">+ Nový článek</button>
      <div class="backup-row" id="backupRow">
        <button class="backup-btn" id="exportBtn">⬇ Uložit zálohu</button>
        <button class="backup-btn" id="importBtn">⬆ Nahrát zálohu</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="version-tag" id="versionTag"></div>
  </div>
  <div class="main" id="main">
    <div class="empty-state">Načítám…</div>
  </div>
</div>

<!-- NAČTENÍ DAT ZE SOUBORU data.js -->
<script src="data.js"></script>

<script>
const APP_VERSION = 'v2.14';

const SECTIONS = [
  {id:'sop', label:'📋 Postupy (SOP)'},
  {id:'wiki', label:'🏢 Firemní wiki'},
  {id:'troubleshooting', label:'🛟 Troubleshooting'}
];

// Ochrana pro případ, že soubor data.js chybí
const _initData = typeof INITIAL_DATA !== 'undefined' ? INITIAL_DATA : { postupCats:[], manualCats:[], wikiCats:[], troubleshootCats:[], seedAll:[] };

let POSTUP_CATS = _initData.postupCats.slice();
let MANUAL_CATS = _initData.manualCats.slice();
let WIKI_CATS = _initData.wikiCats.slice();
let TROUBLESHOOT_CATS = _initData.troubleshootCats.slice();
const SEED_ALL = _initData.seedAll.slice();

// Ke kterému seznamu kategorií patří které pole na článku – používá se pro checkboxy v editaci i pro role.
const FIELD_CATS = {
  postupTags: POSTUP_CATS,
  manualTags: MANUAL_CATS,
  wikiTags: WIKI_CATS,
  troubleshootTags: TROUBLESHOOT_CATS
};

// Editovatelné osy (jen SOP): key = interní klíč pro Spravovat kategorie, field = jméno pole na článku,
// storageKey = kam se seznam kategorií ukládá.
const EDITABLE_AXES = {
  postup: {cats:POSTUP_CATS, field:'postupTags', storageKey:'kb-postup-cats', label:'📋 Podle postupu'},
  manual: {cats:MANUAL_CATS, field:'manualTags', storageKey:'kb-manual-cats', label:'📋 Podle manuálu'},
  wiki: {cats:WIKI_CATS, field:'wikiTags', storageKey:'kb-wiki-cats', label:'🏢 Firemní wiki'},
  troubleshooting: {cats:TROUBLESHOOT_CATS, field:'troubleshootTags', storageKey:'kb-troubleshoot-cats', label:'🛟 Troubleshooting'}
};

// Jaké osy (pohledy na kategorie) appka nabízí v jednotlivých sekcích.
const SECTION_AXES = {
  sop: [
    {id:'postup', label:'Podle postupu', field:'postupTags', cats:POSTUP_CATS,
     hint:'Do jaké fáze zaškolení návod patří – stejné skupiny jako checklist v kartě zaměstnance.'},
    {id:'manual', label:'Podle manuálu', field:'manualTags', cats:MANUAL_CATS,
     hint:'Do jaké kapitoly kompletního provozního manuálu návod patří.'}
  ],
  wiki: [
    {id:'wiki', label:'Firemní wiki', field:'wikiTags', cats:WIKI_CATS,
     hint:'Kdo jsme, kde co najdeme a s čím pracujeme – ne postup práce, ale základní orientace ve firmě.'}
  ],
  troubleshooting: [
    {id:'troubleshooting', label:'Troubleshooting', field:'troubleshootTags', cats:TROUBLESHOOT_CATS,
     hint:'Rychlá pomoc, když se něco pokazí nebo nastane nestandardní situace.'}
  ]
};

let articles = [];
let roles = [];          // [{id, label, allowedCats:[categoryId,...]}]
let sectionId = 'sop';
let axisId = 'postup';
let activeId = null;
let editing = false;
let videoOpen = false;
let view = 'article';    // 'article' | 'roles' | 'cats'
let editingRoleId = null;
let readerRoleId = null;
let searchQuery = '';
let MODE = 'editor';     // 'editor' | 'reader' – UI přepínač, bez zabezpečení
try{ if(localStorage.getItem('kb-mode') === 'reader') MODE = 'reader'; }catch(e){}
try{ readerRoleId = localStorage.getItem('kb-reader-role') || null; }catch(e){}

const $ = id => document.getElementById(id);
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function currentAxes(){ return SECTION_AXES[sectionId]; }
function currentAxis(){ return currentAxes().find(a=>a.id===axisId) || currentAxes()[0]; }
function currentRole(){ return roles.find(r=>r.id===readerRoleId) || null; }
function articleAllTags(art){
  return (art.postupTags||[]).concat(art.manualTags||[]).concat(art.wikiTags||[]).concat(art.troubleshootTags||[]);
}
function articleVisibleToRole(art, role){
  if(!role) return false;
  return articleAllTags(art).some(t=>role.allowedCats.indexOf(t) !== -1);
}

/* ---------- úložiště ---------- */
function loadJSON(key){
  try{ const raw = localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveJSON(key, val, errMsg){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ if(errMsg) $('status').textContent = errMsg; return false; }
}
function loadArticles(){ return loadJSON('kb-articles'); }
function saveArticles(){ return saveJSON('kb-articles', articles, 'Uložení selhalo (localStorage plný nebo nedostupný). Zmenši obrázky nebo jich uber a zkus to znovu.'); }
function loadRoles(){ return loadJSON('kb-roles') || []; }
function saveRoles(){ return saveJSON('kb-roles', roles, 'Uložení rolí selhalo.'); }

/* ---------- kategorie ---------- */
function loadEditableCats(){
  Object.keys(EDITABLE_AXES).forEach(key=>{
    const ax = EDITABLE_AXES[key];
    const loaded = loadJSON(ax.storageKey);
    if(loaded && Array.isArray(loaded) && loaded.length){
      ax.cats.length = 0;
      loaded.forEach(c=>ax.cats.push(c));
    } else {
      saveJSON(ax.storageKey, ax.cats);
    }
  });
}
function saveEditableCats(key){
  saveJSON(EDITABLE_AXES[key].storageKey, EDITABLE_AXES[key].cats, 'Uložení kategorií selhalo.');
}

/* ---------- video ---------- */
function detectVideo(url){
  if(!url) return null;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
  if(yt) return {type:'youtube', id:yt[1]};
  if(/dropbox\.com/.test(url)) return {type:'dropbox', raw:url.replace(/\?dl=0/,'?raw=1').replace(/[?&]dl=1/,'?raw=1')};
  return {type:'other', url:url};
}
function videoBlockHtml(url){
  const v = detectVideo(url);
  if(!v) return '';
  if(v.type === 'youtube'){
    if(videoOpen){
      return '<div class="video-block"><iframe src="https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>';
    }
    return '<div class="video-block"><div class="video-thumb" id="videoThumb">' +
      '<img src="https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg" alt="Náhled videa">' +
      '<div class="video-play"><span>▶</span></div></div></div>';
  }
  if(v.type === 'dropbox'){
    if(videoOpen){
      return '<div class="video-block"><video src="' + escapeHtml(v.raw) + '" controls autoplay></video></div>';
    }
    return '<div class="video-block"><div class="video-thumb" id="videoThumb" style="background:var(--cocoa)">' +
      '<div class="video-play"><span>▶</span></div></div></div>';
  }
  return '<div class="video-block"><a class="btn video-link-btn" href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">▶ Přehrát video</a></div>';
}

/* ---------- obrázky ---------- */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image load failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- init ---------- */
function init(){
  loadEditableCats();

  const existing = loadArticles();
  articles = existing || [];
  articles.forEach(a=>{
    if(!a.images) a.images = [];
    if(a.videoUrl == null) a.videoUrl = '';
    if(!a.section) a.section = 'sop';
    if(!a.wikiTags) a.wikiTags = [];
    if(!a.troubleshootTags) a.troubleshootTags = [];
    if(!a.related) a.related = [];
  });
  
  const prostory = articles.find(a=>a.id === 'prostory');
  if(prostory && prostory.section !== 'wiki'){
    prostory.section = 'wiki';
    prostory.wikiTags = ['prostory_zazemi'];
  }
  
  let added = false;
  SEED_ALL.forEach(s=>{
    if(!articles.find(a=>a.id === s.id)){
      articles.push(Object.assign({}, s));
      added = true;
    }
  });
  
  let migrated = false;
  articles.forEach(a=>{
    if(a.body == null){
      a.body = legacyContentToHtml(a);
      migrated = true;
    }
  });
  if(added || migrated || !existing || prostory) saveArticles();

  roles = loadRoles();
  if(articles.length) activeId = articles[0].id;
  $('versionTag').textContent = APP_VERSION;
  $('searchInput').oninput = ()=>{ searchQuery = $('searchInput').value; renderCatList(); };
  applyMode();
  render();
}

function applyMode(){
  const isEditor = MODE === 'editor';
  $('modeToggleBtn').innerHTML = (isEditor ? 'Role: Editor' : 'Role: Čtenář') + ' &nbsp;🔄';
  $('modeToggleBtn').className = 'mode-badge' + (isEditor ? '' : ' reader');
  $('addBtn').style.display = isEditor ? 'block' : 'none';
  $('backupRow').style.display = isEditor ? 'flex' : 'none';
  $('rolesBtn').style.display = isEditor ? 'block' : 'none';
  $('catsBtn').style.display = isEditor ? 'block' : 'none';
  $('roleSelectWrap').style.display = isEditor ? 'none' : 'block';
  if(!isEditor) renderRoleSelect();
  $('status').textContent = 'Offline verze – data se ukládají jen v tomto prohlížeči. Pro přenos použij zálohu.';
}

function renderRoleSelect(){
  const sel = $('roleSelect');
  sel.innerHTML = '<option value="">— vyber roli —</option>' +

function renderCatList(){
  const isEditor = MODE === 'editor';
  const role = isEditor ? null : currentRole();
  if(!isEditor && !role){
    $('catList').innerHTML = '<div class="status">Vyber svou roli nahoře – appka ti pak ukáže návody pro tebe.</div>';
    return;
  }
  const q = searchQuery.trim().toLowerCase();
  if(q){
    let pool = articles.filter(a=> isEditor || articleVisibleToRole(a, role));
    pool = pool.filter(a=> (a.title||'').toLowerCase().indexOf(q)!==-1 || (a.content||'').toLowerCase().indexOf(q)!==-1);
    let html = '<div class="cat-group search-results"><div class="cat-label">Výsledky hledání (' + pool.length + ')</div>';
    html += pool.length
      ? '<ul class="art-list">' + pool.map(a=>'<li class="art-item' + (a.id===activeId ? ' active' : '') + '" data-open="' + a.id + '">' + escapeHtml(a.title) + '</li>').join('') + '</ul>'
      : '<div class="status">Nic nenalezeno.</div>';
    html += '</div>';
    $('catList').innerHTML = html;
    $('catList').querySelectorAll('[data-open]').forEach(el=>{
      el.onclick = ()=>{ activeId = el.dataset.open; editing = false; videoOpen = false; view = 'article'; render(); };
    });
    return;
  }
  const axis = currentAxis();
  const itemLi = a => '<li class="art-item' + (a.id===activeId ? ' active' : '') + '"' +
    (isEditor ? ' draggable="true"' : '') + ' data-open="' + a.id + '">' + escapeHtml(a.title) + '</li>';
  let html = '';
  axis.cats.forEach(cat=>{
    if(!isEditor && role.allowedCats.indexOf(cat.id) === -1) return;
    const items = articles.filter(a=>a.section===sectionId && (a[axis.field]||[]).indexOf(cat.id) !== -1);
    if(!isEditor && !items.length) return;
    html += '<div class="cat-group" data-catgroup="' + cat.id + '">' +
      (isEditor
        ? '<div class="cat-label-row"><input class="cat-label-edit" data-cat-rename2="' + cat.id + '" value="' + escapeHtml(cat.label) + '"><button class="cat-del-x" title="Smazat kategorii" data-cat-del2="' + cat.id + '">×</button></div>'
        : '<div class="cat-label">' + escapeHtml(cat.label) + '</div>') +
      '<ul class="art-list">' + items.map(itemLi).join('') + '</ul></div>';
  });
  if(isEditor){
    html += '<div class="cat-add-row"><input class="cat-add-input" id="newCatInline" placeholder="+ Nová kategorie"><button class="cat-add-btn" id="addCatInline">+</button></div>';
    const unTagged = articles.filter(a=>a.section===sectionId && !(a[axis.field]||[]).length);
    html += '<div class="cat-group" data-catgroup="__none__"><div class="cat-label">Nezařazeno</div><ul class="art-list">' +
      (unTagged.length ? unTagged.map(itemLi).join('') : '<li class="art-item" style="cursor:default;color:var(--cocoa-soft);">–</li>') +
      '</ul></div>';
  }
  $('catList').innerHTML = html || '<div class="status">' + (isEditor ? 'V téhle sekci zatím nejsou žádné kategorie.' : 'Pro tvoji roli zatím nejsou povolené žádné kategorie v téhle sekci.') + '</div>';
  $('catList').querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ activeId = el.dataset.open; editing = false; videoOpen = false; view = 'article'; render(); };
  });
  if(!isEditor) return;

  // --- drag & drop článků mezi kategoriemi, s indikátorem přesné pozice ---
  let draggedId = null;
  function clearIndicator(){
    const ind = $('catList').querySelector('.drop-indicator');
    if(ind) ind.remove();
  }
  $('catList').querySelectorAll('.art-item[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ draggedId = el.dataset.open; el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); clearIndicator(); });
  });
  $('catList').querySelectorAll('.cat-group').forEach(group=>{
    const list = group.querySelector('.art-list');
    group.addEventListener('dragover', e=>{
      e.preventDefault();
      group.classList.add('dropzone-over');
      if(!list) return;
      const hovered = e.target.closest('.art-item');
      clearIndicator();
      const line = document.createElement('li');
      line.className = 'drop-indicator';
      if(hovered && hovered.dataset.open !== draggedId){
        const rect = hovered.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        hovered.insertAdjacentElement(before ? 'beforebegin' : 'afterend', line);
      } else if(!hovered){
        list.appendChild(line);
      }
    });
    group.addEventListener('dragleave', e=>{
      if(!group.contains(e.relatedTarget)){ group.classList.remove('dropzone-over'); clearIndicator(); }
    });
    group.addEventListener('drop', e=>{
      e.preventDefault();
      group.classList.remove('dropzone-over');
      const indicator = $('catList').querySelector('.drop-indicator');
      if(!draggedId){ clearIndicator(); return; }
      const art = articles.find(a=>a.id===draggedId);
      if(!art){ clearIndicator(); return; }
      const catId = group.dataset.catgroup;
      art[axis.field] = (catId === '__none__') ? [] : [catId];
      // najdi, před/za kterým článkem indikátor skončil, a podle toho přeskládej pořadí v datech
      let beforeId = null, afterId = null;
      if(indicator){
        const nextLi = indicator.nextElementSibling;
        const prevLi = indicator.previousElementSibling;
        if(nextLi && nextLi.dataset.open) beforeId = nextLi.dataset.open;
        else if(prevLi && prevLi.dataset.open) afterId = prevLi.dataset.open;
      }
      const idx = articles.indexOf(art);
      if(idx !== -1) articles.splice(idx, 1);
      let insertAt = articles.length;
      if(beforeId){
        const i = articles.findIndex(a=>a.id===beforeId);
        if(i !== -1) insertAt = i;
      } else if(afterId){
        const i = articles.findIndex(a=>a.id===afterId);
        if(i !== -1) insertAt = i + 1;
      }
      articles.splice(insertAt, 0, art);
      saveArticles();
      draggedId = null;
      clearIndicator();
      renderCatList();
    });
  });

  // --- přejmenování kategorie ---
  $('catList').querySelectorAll('[data-cat-rename2]').forEach(inp=>{
    inp.onchange = ()=>{
      const cat = axis.cats.find(c=>c.id===inp.dataset.catRename2);
      if(cat){
        cat.label = inp.value.trim() || cat.label;
        inp.value = cat.label;
        saveEditableCats(axis.id);
      }
    };
  });

  // --- smazání kategorie ---
  $('catList').querySelectorAll('[data-cat-del2]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = '✓?'; return; }
      const id = b.dataset.catDel2;
      const idx = axis.cats.findIndex(c=>c.id===id);
      if(idx !== -1) axis.cats.splice(idx, 1);
      articles.forEach(a=>{ if(a[axis.field]) a[axis.field] = a[axis.field].filter(t=>t!==id); });
      roles.forEach(r=>{ r.allowedCats = r.allowedCats.filter(t=>t!==id); });
      saveEditableCats(axis.id);
      saveArticles();
      saveRoles();
      renderCatList();
    };
  });

  // --- nová kategorie ---
  const addBtn2 = $('addCatInline');
  if(addBtn2) addBtn2.onclick = ()=>{
    const input = $('newCatInline');
    const name = input.value.trim();
    if(!name) return;
    axis.cats.push({id:uid(), label:name});
    saveEditableCats(axis.id);
    renderCatList();
  };
}

function renderMain(){
  const isEditor = MODE === 'editor';
  const art = articles.find(a=>a.id===activeId);
  if(!isEditor){
    const role = currentRole();
    if(!role){
      $('main').innerHTML = '<div class="empty-state">Nejdřív si vlevo vyber svou roli.</div>';
      return;
    }
    if(!art || !articleVisibleToRole(art, role)){
      $('main').innerHTML = '<div class="empty-state">Vyber návod vlevo, nebo pro tvoji roli zatím není žádný zpřístupněný.</div>';
      return;
    }
  }
  if(!art){
    $('main').innerHTML = '<div class="empty-state">Vyber článek vlevo' + (isEditor ? ', nebo přidej nový.' : '.') + '</div>';
    return;
  }
  if(editing && isEditor){
    $('main').innerHTML = editFormHtml(art);
    bindEditForm(art);
    return;
  }
  const tagsHtml = POSTUP_CATS.filter(c=>(art.postupTags||[]).indexOf(c.id)!==-1)
    .concat(MANUAL_CATS.filter(c=>(art.manualTags||[]).indexOf(c.id)!==-1))
    .concat(WIKI_CATS.filter(c=>(art.wikiTags||[]).indexOf(c.id)!==-1))
    .concat(TROUBLESHOOT_CATS.filter(c=>(art.troubleshootTags||[]).indexOf(c.id)!==-1))
    .map(c=>'<span class="tag-chip">' + escapeHtml(c.label) + '</span>').join('');
  const role = isEditor ? null : currentRole();
  const relatedIds = (art.related||[]).slice();
  articles.forEach(a=>{ if((a.related||[]).indexOf(art.id)!==-1 && relatedIds.indexOf(a.id)===-1) relatedIds.push(a.id); });
  const relatedArts = relatedIds
    .map(id=>articles.find(a=>a.id===id))
    .filter(a=> a && (isEditor || articleVisibleToRole(a, role)));
  const relatedHtml = relatedArts.length
    ? '<div class="related-box"><div class="cat-label">Souvisí s</div><ul class="art-list">' +
      relatedArts.map(a=>'<li class="art-item" data-open="' + a.id + '">' + escapeHtml(a.title) + '</li>').join('') +
      '</ul></div>'
    : '';
  $('main').innerHTML =
    '<div class="art-title">' + escapeHtml(art.title) + '</div>' +
    (art.updatedAt ? '<div class="art-updated">Poslední úprava: ' + escapeHtml(art.updatedAt) + '</div>' : '') +
    '<div class="art-tags">' + tagsHtml + '</div>' +
    '<div class="art-body">' + (art.body || '') + '</div>' +
    videoBlockHtml(art.videoUrl) +
    relatedHtml +
    '<div class="row"><button class="btn" id="printBtn">🖨️ Tisk</button>' +
    (isEditor ? '<button class="btn" id="editBtn">Upravit</button><button class="btn red" id="delBtn">Smazat</button>' : '') +
    '</div>';
  const thumb = $('videoThumb');
  if(thumb) thumb.onclick = ()=>{ videoOpen = true; renderMain(); };
  document.querySelectorAll('.related-box [data-open]').forEach(el=>{
    el.onclick = ()=>{ activeId = el.dataset.open; editing = false; videoOpen = false; render(); };
  });
  $('printBtn').onclick = ()=>{
    document.body.classList.add('printing');
    window.print();
    document.body.classList.remove('printing');
  };
  if(isEditor){
    $('editBtn').onclick = ()=>{ editing = true; render(); };
    $('delBtn').onclick = ()=>{
      if($('delBtn').dataset.armed !== '1'){
        $('delBtn').dataset.armed = '1';
        $('delBtn').textContent = 'Opravdu smazat?';
        return;
      }
      articles = articles.filter(a=>a.id !== art.id);
      saveArticles();
      activeId = null;
      render();
    };
  }
}

function inlineFormat(escapedText){
  return escapedText.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

// JEDNORÁZOVÁ MIGRACE
function legacyContentToHtml(art){
  const lines = (art.content || '').split('\n');
  const out = [];
  let i = 0;
  while(i < lines.length){
    const raw = lines[i];
    const trimmed = raw.trim();

    const imgMatch = trimmed.match(/^\{img:(\d+)\}$/);
    if(imgMatch){
      const src = (art.images || [])[parseInt(imgMatch[1], 10)];
      if(src) out.push('<img src="' + src + '" alt="">');
      i++; continue;
    }
    if(trimmed === '{video}'){ i++; continue; }
    if(trimmed.indexOf('## ') === 0){
      out.push('<h3>' + inlineFormat(escapeHtml(trimmed.slice(3))) + '</h3>');
      i++; continue;
    }
    if(trimmed.indexOf('- ') === 0){
      const items = [];
      while(i < lines.length && lines[i].trim().indexOf('- ') === 0){
        items.push('<li>' + inlineFormat(escapeHtml(lines[i].trim().slice(2))) + '</li>');
        i++;
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    if(trimmed === ''){ out.push('<br>'); i++; continue; }
    out.push('<div>' + inlineFormat(escapeHtml(raw)) + '</div>');
    i++;
  }
  const referenced = referencedImageIndexes(art.content);
  (art.images || []).forEach((src, idx)=>{ if(referenced.indexOf(idx) === -1) out.push('<img src="' + src + '" alt="">'); });
  return out.join('');
}

function referencedImageIndexes(content){
  const idx = [];
  const re = /\{img:(\d+)\}/g;
  let m;
  while((m = re.exec(content || '')) !== null) idx.push(parseInt(m[1], 10));
  return idx;
}

function bindEditForm(art){
  if(!art.images) art.images = [];
  const sectionSel = $('f-section');
  sectionSel.onchange = ()=>{
    $('sectionTagsArea').innerHTML = sectionTagsHtml(sectionSel.value, art);
  };

  const bodyEl = $('f-body');

  const fmtBold = $('fmtBold');
  if(fmtBold) fmtBold.onclick = ()=>{ bodyEl.focus(); document.execCommand('bold'); };
  const fmtHeading = $('fmtHeading');
  if(fmtHeading) fmtHeading.onclick = ()=>{ bodyEl.focus(); document.execCommand('formatBlock', false, 'H3'); };
  const fmtBullet = $('fmtBullet');
  if(fmtBullet) fmtBullet.onclick = ()=>{ bodyEl.focus(); document.execCommand('insertUnorderedList'); };

  let savedRange = null;
  function saveRange(){
    const sel = window.getSelection();
    if(sel.rangeCount && bodyEl.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0);
  }
  bodyEl.addEventListener('mouseup', saveRange);
  bodyEl.addEventListener('keyup', saveRange);
  function restoreRange(){
    if(!savedRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  const fmtClear = $('fmtClear');
  if(fmtClear) fmtClear.onclick = ()=>{
    bodyEl.focus();
    document.execCommand('removeFormat');
    document.execCommand('formatBlock', false, 'DIV');
  };

  function removeImgOverlay(){
    const existing = bodyEl.querySelector('.img-del-overlay');
    if(existing) existing.remove();
  }
  bodyEl.addEventListener('click', e=>{
    if(e.target.tagName === 'IMG'){
      removeImgOverlay();
      const img = e.target;
      const overlay = document.createElement('button');
      overlay.type = 'button';
      overlay.className = 'img-del-overlay';
      overlay.textContent = '× Smazat tento obrázek';
      overlay.onclick = (ev)=>{ ev.stopPropagation(); img.remove(); overlay.remove(); };
      img.insertAdjacentElement('afterend', overlay);
    } else {
      removeImgOverlay();
    }
  });

  const fmtImg = $('fmtImg');
  const bodyImgInput = $('bodyImgInput');
  if(fmtImg) fmtImg.onclick = ()=>{ saveRange(); bodyImgInput.click(); };
  if(bodyImgInput){
    bodyImgInput.addEventListener('change', async ()=>{
      const file = bodyImgInput.files && bodyImgInput.files[0];
      bodyImgInput.value = '';
      if(!file) return;
      try{
        const dataUrl = await resizeImage(file, 900, 0.72);
        bodyEl.focus();
        restoreRange();
        document.execCommand('insertImage', false, dataUrl);
      }catch(e){}
    });
  }

  bodyEl.addEventListener('paste', async (e)=>{
    const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
    const imgItem = items.find(it=>it.type && it.type.indexOf('image/') === 0);
    if(imgItem){
      e.preventDefault();
      const file = imgItem.getAsFile();
      if(!file) return;
      try{
        const dataUrl = await resizeImage(file, 900, 0.72);
        document.execCommand('insertImage', false, dataUrl);
      }catch(err){}
      return;
    }
    e.preventDefault();
    const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
    document.execCommand('insertText', false, text);
  });

  $('saveBtn').onclick = ()=>{
    art.title = $('f-title').value.trim() || 'Bez názvu';
    art.section = $('f-section').value;
    art.body = $('f-body').innerHTML;
    art.videoUrl = $('f-video').value.trim();
    SECTION_AXES[art.section].forEach(axis=>{
      art[axis.field] = Array.from(document.querySelectorAll('[data-tag="' + axis.field + '"]:checked')).map(el=>el.value);
    });
    art.related = Array.from(document.querySelectorAll('[data-related]:checked')).map(el=>el.value);
    art.updatedAt = new Date().toISOString().slice(0,10);
    if(art.isNew){ delete art.isNew; articles.push(art); }
    const ok = saveArticles();
    if(ok){
      activeId = art.id;
      sectionId = art.section;
      axisId = currentAxes()[0].id;
      editing = false;
      videoOpen = false;
      render();
    }
  };
  $('cancelBtn').onclick = ()=>{
    editing = false;
    if(art.isNew) activeId = null;
    render();
  };
}

    '<input class="f-title" id="r-name" value="' + escapeHtml(role.label||'') + '">' +
    '<div class="field-hint">Nová role zatím nevidí žádnou kategorii – zaškrtni tady, co jí zpřístupníš.</div>' +
    '<div class="field-label">📋 Postupy – podle postupu</div>' +
    roleCatBoxHtml(POSTUP_CATS, role.allowedCats) +
    '<div class="field-label">📋 Postupy – podle manuálu</div>' +
    roleCatBoxHtml(MANUAL_CATS, role.allowedCats) +
    '<div class="field-label">🏢 Firemní wiki</div>' +
    roleCatBoxHtml(WIKI_CATS, role.allowedCats) +
    '<div class="field-label">🛟 Troubleshooting</div>' +
    roleCatBoxHtml(TROUBLESHOOT_CATS, role.allowedCats) +
    '<div class="row"><button class="btn" id="saveRoleBtn">Uložit</button><button class="btn ghost" id="cancelRoleBtn">Zrušit</button></div>';
}

function bindRoleEditForm(role){
  $('saveRoleBtn').onclick = ()=>{
    role.label = $('r-name').value.trim() || 'Bez názvu';
    role.allowedCats = Array.from(document.querySelectorAll('[data-role-cat]:checked')).map(el=>el.value);
    const idx = roles.findIndex(r=>r.id===role.id);
    if(idx !== -1) roles[idx] = role;
    saveRoles();
    editingRoleId = null;
    render();
  };
  $('cancelRoleBtn').onclick = ()=>{ editingRoleId = null; render(); };
}

function renderRolesMain(){
  if(editingRoleId){
    const role = roles.find(r=>r.id===editingRoleId);
    if(!role){ editingRoleId = null; }
    else{
      $('main').innerHTML = roleEditHtml(role);
      bindRoleEditForm(role);
      return;
    }
  }
  let html = '<div class="art-title">Role</div>' +
    '<div class="field-hint">Role určuje, které kategorie návodů (napříč všemi sekcemi) čtenář v této roli uvidí. Nová role zatím nevidí nic.</div>' +
    '<div class="row"><input class="f-title" id="newRoleName" placeholder="Název nové role (např. Plac, Kuchyně, Vedoucí)" style="flex:1;font-size:14px;font-weight:400;font-family:inherit;"><button class="btn" id="addRoleBtn">Přidat roli</button></div>';
  if(roles.length){
    html += roles.map(r=>
      '<div class="role-row"><span>' + escapeHtml(r.label) + ' <span class="tag-chip">' + r.allowedCats.length + ' kategorií</span></span>' +
      '<span><button class="btn ghost" data-edit-role="' + r.id + '">Upravit</button> <button class="btn red" data-del-role="' + r.id + '">Smazat</button></span></div>'
    ).join('');
  } else {
    html += '<div class="status" style="margin-top:14px">Zatím žádné role.</div>';
  }
  html += '<div class="row"><button class="btn ghost" id="backToArticles">Zpět na návody</button></div>';
  $('main').innerHTML = html;
  $('addRoleBtn').onclick = ()=>{
    const name = $('newRoleName').value.trim();
    if(!name) return;
    const r = {id:uid(), label:name, allowedCats:[]};
    roles.push(r);
    saveRoles();
    editingRoleId = r.id;
    render();
  };
  document.querySelectorAll('[data-edit-role]').forEach(b=>{
    b.onclick = ()=>{ editingRoleId = b.dataset.editRole; render(); };
  });
  document.querySelectorAll('[data-del-role]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Opravdu?'; return; }
      const delId = b.dataset.delRole;
      roles = roles.filter(r=>r.id !== delId);
      saveRoles();
      if(readerRoleId === delId){
        readerRoleId = null;
        try{ localStorage.removeItem('kb-reader-role'); }catch(e){}
      }
      render();
    };
  });
  $('backToArticles').onclick = ()=>{ view = 'article'; render(); };
}

/* ---------- kategorie (jen editor) ---------- */
function catsAxisSectionHtml(key){
  const ax = EDITABLE_AXES[key];
  let html = '<div class="field-label">' + escapeHtml(ax.label) + '</div>';
  html += ax.cats.map(c=>
    '<div class="role-row">' +
      '<input class="f-title" data-cat-rename="' + key + ':' + c.id + '" value="' + escapeHtml(c.label) + '" style="font-size:13px;font-weight:400;font-family:inherit;flex:1;margin-right:8px;">' +
      '<button class="btn red" data-cat-del="' + key + ':' + c.id + '">Smazat</button>' +
    '</div>'
  ).join('');
  html += '<div class="row"><input class="f-title" id="newCat-' + key + '" placeholder="Nová kategorie" style="flex:1;font-size:13px;font-weight:400;font-family:inherit;"><button class="btn" data-cat-add="' + key + '">Přidat</button></div>';
  return html;
}

function renderCatsMain(){
  let html = '<div class="art-title">Kategorie</div>' +
    '<div class="field-hint">Úprava kategorií pro všechny čtyři osy. Přejmenování nezmění zařazení existujících článků; smazání kategorie ji odebere ze všech článků i rolí, které ji používaly.</div>' +
    catsAxisSectionHtml('postup') +
    catsAxisSectionHtml('manual') +
    catsAxisSectionHtml('wiki') +
    catsAxisSectionHtml('troubleshooting') +
    '<div class="row"><button class="btn ghost" id="backToArticles2">Zpět na návody</button></div>';
  $('main').innerHTML = html;

  document.querySelectorAll('[data-cat-rename]').forEach(inp=>{
    inp.onchange = ()=>{
      const [key, id] = inp.dataset.catRename.split(':');
      const cat = EDITABLE_AXES[key].cats.find(c=>c.id===id);
      if(cat){
        cat.label = inp.value.trim() || cat.label;
        inp.value = cat.label;
        saveEditableCats(key);
      }
    };
  });
  document.querySelectorAll('[data-cat-del]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Opravdu?'; return; }
      const [key, id] = b.dataset.catDel.split(':');
      const ax = EDITABLE_AXES[key];
      const idx = ax.cats.findIndex(c=>c.id===id);
      if(idx !== -1) ax.cats.splice(idx, 1);
      articles.forEach(a=>{
        if(a[ax.field]){ a[ax.field] = a[ax.field].filter(t=>t!==id); }
      });
      roles.forEach(r=>{ r.allowedCats = r.allowedCats.filter(t=>t!==id); });
      saveEditableCats(key);
      saveArticles();
      saveRoles();
      renderCatsMain();
    };
  });
  document.querySelectorAll('[data-cat-add]').forEach(b=>{
    b.onclick = ()=>{
      const key = b.dataset.catAdd;
      const input = $('newCat-' + key);
      const name = input.value.trim();
      if(!name) return;
      EDITABLE_AXES[key].cats.push({id:uid(), label:name});
      saveEditableCats(key);
      renderCatsMain();
    };
  });
  $('backToArticles2').onclick = ()=>{ view = 'article'; render(); };
}

function render(){
  renderSectionSwitch();
  renderAxisSwitch();
  renderCatList();
  if(view === 'roles') renderRolesMain();
  else if(view === 'cats') renderCatsMain();
  else renderMain();
}

$('modeToggleBtn').onclick = ()=>{
  MODE = (MODE === 'editor') ? 'reader' : 'editor';
  try{ localStorage.setItem('kb-mode', MODE); }catch(e){}
  editing = false;
  view = 'article';
  applyMode();
  render();
};
$('rolesBtn').onclick = ()=>{ view = 'roles'; editingRoleId = null; render(); };
$('catsBtn').onclick = ()=>{ view = 'cats'; render(); };
$('addBtn').onclick = ()=>{
  activeId = uid();
  editing = true;
  videoOpen = false;
  view = 'article';
  const blank = {id:activeId, isNew:true, section:sectionId, title:'', body:'', content:'', postupTags:[], manualTags:[], wikiTags:[], troubleshootTags:[], images:[], videoUrl:'', related:[]};
  renderSectionSwitch();
  renderAxisSwitch();
  renderCatList();
  $('main').innerHTML = editFormHtml(blank);
  bindEditForm(blank);
};

$('exportBtn').onclick = ()=>{
  const payload = {
    articles, roles,
    postupCats: POSTUP_CATS,
    manualCats: MANUAL_CATS,
    wikiCats: WIKI_CATS,
    troubleshootCats: TROUBLESHOOT_CATS
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'znalostni-baze-zaloha.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
$('importBtn').onclick = ()=>$('importFile').click();
$('importFile').addEventListener('change', ()=>{
  const file = $('importFile').files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const newArticles = Array.isArray(parsed) ? parsed : parsed.articles;
      const newRoles = Array.isArray(parsed) ? [] : (parsed.roles || []);
      if(!Array.isArray(newArticles)) throw new Error('neplatný formát');
      articles = newArticles;
      articles.forEach(a=>{
        if(!a.images) a.images = [];
        if(a.videoUrl == null) a.videoUrl = '';
        if(!a.section) a.section = 'sop';
        if(!a.wikiTags) a.wikiTags = [];
        if(!a.troubleshootTags) a.troubleshootTags = [];
      });
      roles = newRoles;
      if(!Array.isArray(parsed) && Array.isArray(parsed.postupCats) && parsed.postupCats.length){
        POSTUP_CATS.length = 0;
        parsed.postupCats.forEach(c=>POSTUP_CATS.push(c));
        saveEditableCats('postup');
      }
      if(!Array.isArray(parsed) && Array.isArray(parsed.manualCats) && parsed.manualCats.length){
        MANUAL_CATS.length = 0;
        parsed.manualCats.forEach(c=>MANUAL_CATS.push(c));
        saveEditableCats('manual');
      }
      if(!Array.isArray(parsed) && Array.isArray(parsed.wikiCats) && parsed.wikiCats.length){
        WIKI_CATS.length = 0;
        parsed.wikiCats.forEach(c=>WIKI_CATS.push(c));
        saveEditableCats('wiki');
      }
      if(!Array.isArray(parsed) && Array.isArray(parsed.troubleshootCats) && parsed.troubleshootCats.length){
        TROUBLESHOOT_CATS.length = 0;
        parsed.troubleshootCats.forEach(c=>TROUBLESHOOT_CATS.push(c));
        saveEditableCats('troubleshooting');
      }
      saveArticles();
      saveRoles();
      activeId = articles.length ? articles[0].id : null;
      editing = false;
      videoOpen = false;
      view = 'article';
      render();
      $('status').textContent = 'Záloha nahrána.';
    }catch(e){
      $('status').textContent = 'Import se nezdařil – soubor neodpovídá formátu zálohy.';
    }
  };
  reader.readAsText(file);
  $('importFile').value = '';
});

init();
</script>
</body>
</html>
