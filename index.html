<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3B2A20">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sladká dílna">
<title>Znalostní báze – Sladká dílna</title>
<!-- data se čtou z data.js; editor ukládá rozpracované změny do prohlížeče a tlačítkem Publikovat je zapíše do data.js na GitHubu -->
<!-- v2.51 -->
<style>
  :root{
    --cream:#F7EFE0;
    --paper:#FFFDF8;
    --cocoa:#3B2A20;
    --cocoa-soft:#6B5744;
    --caramel:#B9793A;
    --caramel-deep:#8F5A24;
    --sage:#5B7B52;
    --line:#E7D9BE;
    --line-soft:#F0E5CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--cocoa);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:0;}
  .home-btn{
    border:none;background:none;cursor:pointer;font-size:15px;padding:0 2px;line-height:1;opacity:.8;
  }
  .home-btn:hover{opacity:1;}
  .title-tools{display:flex;align-items:center;gap:6px;}
  /* 12) spodní lišta na mobilu */
  .bottom-nav{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;justify-content:space-around;
    background:var(--paper);border-top:1px solid var(--line);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom, 0px));box-shadow:0 -2px 10px rgba(59,42,32,.08);
  }
  .bottom-nav button{
    flex:1;border:none;background:none;font-family:inherit;font-size:10.5px;color:var(--cocoa-soft);
    display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;padding:2px 0;
  }
  .bottom-nav button b{font-size:18px;line-height:1.15;font-weight:400;}
  .bottom-nav button.on{color:var(--caramel-deep);font-weight:700;}
  /* 11) odškrtávací postup */
  .chk-head{
    position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 0 6px;margin-bottom:10px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .chk-count{font-size:12.5px;font-weight:700;color:var(--cocoa);}
  .chk-bar{flex:1;min-width:120px;height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;}
  .chk-bar span{display:block;height:100%;background:var(--sage);transition:width .2s;}
  .chk-reset{border:none;background:none;font:inherit;font-size:11.5px;color:var(--cocoa-soft);text-decoration:underline;cursor:pointer;padding:0;}
  .chk-note{width:100%;font-size:11px;color:var(--cocoa-soft);}
  .chk-item{position:relative;padding-left:32px !important;cursor:pointer;border-radius:6px;transition:background .15s;}
  .chk-item:hover{background:var(--line-soft);}
  .chk-item::before{
    content:'';position:absolute;left:4px;top:3px;width:18px;height:18px;border-radius:5px;
    border:2px solid var(--caramel);background:var(--paper);
  }
  .chk-item.done{color:var(--cocoa-soft);text-decoration:line-through;text-decoration-color:var(--line);}
  .chk-item.done::before{background:var(--sage);border-color:var(--sage);}
  .chk-item.done::after{content:'✓';position:absolute;left:8px;top:2px;color:#fff;font-size:13px;font-weight:700;}
  li.chk-item{list-style:none;margin-left:-22px;}
  .chk-all{background:#E3EBDD;color:#3E5C36;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-top:12px;}

  .sidebar{background:var(--paper);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;min-height:100vh;}
  .sidebar h1{font-size:18px;line-height:1.25;}
  .sidebar .sub{color:var(--cocoa-soft);font-size:12px;margin-top:4px;margin-bottom:14px;}
  
  .mode-badge{
    display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;
    margin-bottom:16px;background:var(--line-soft);color:var(--caramel-deep);
    border:none;cursor:pointer;font-family:inherit;transition:opacity 0.2s;
  }
  .mode-badge:hover{opacity:0.8;}
  .mode-badge.reader{background:#DCE6F0;color:#2F4E6B;}
  
  .section-switch{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .section-btn{
    padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--cocoa-soft);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;
  }
  .section-btn.active{background:var(--cocoa);color:#fff;border-color:var(--cocoa);}
  .sec-wrap{display:flex;gap:4px;align-items:stretch;}
  .sec-wrap .section-btn{flex:1;min-width:0;}
  .sec-tool{
    border:none;background:transparent;color:var(--cocoa-soft);cursor:pointer;font-size:12px;
    padding:0 5px;border-radius:6px;opacity:0;transition:opacity .15s;
  }
  .sec-wrap:hover .sec-tool, .sec-wrap.active .sec-tool, .sec-tool:focus-visible{opacity:1;}
  .sec-tool:hover{background:var(--line-soft);color:var(--cocoa);}
  .sec-tool.armed{opacity:1;color:#A63446;font-weight:700;}
  .sec-add{
    align-self:flex-start;border:none;background:none;padding:2px 2px;font:inherit;font-size:11.5px;
    color:var(--cocoa-soft);cursor:pointer;opacity:.75;
  }
  .sec-add:hover{opacity:1;color:var(--caramel-deep);}
  .sec-form{display:flex;gap:4px;}
  .sec-form input{flex:1;min-width:0;font-size:12.5px;padding:6px 8px;border:1px solid var(--caramel);border-radius:8px;font-family:inherit;background:var(--paper);color:var(--cocoa);}
  .sec-form button{border:none;border-radius:8px;width:30px;cursor:pointer;font-size:13px;}
  .sec-form .ok{background:var(--caramel);color:#fff;}
  .sec-form .no{background:var(--line-soft);color:var(--cocoa-soft);}
  .axis-switch{display:flex;gap:6px;margin-bottom:14px;}
  .axis-btn{
    flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--cocoa-soft);font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .axis-btn.active{background:var(--caramel);color:#fff;border-color:var(--caramel);}
  .cat-group{margin-bottom:4px;}
  .cat-label{
    font-size:11px;font-weight:700;text-transform:uppercase;color:var(--caramel-deep);
    margin:12px 0 4px;letter-spacing:.04em;
  }
  .art-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px;}
  .art-item{
    padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;font-size:13px;
  }
  .art-item:hover{background:var(--line-soft);}
  .art-item.active{background:var(--cream);border-color:var(--caramel);}
  .art-item[draggable="true"]{cursor:grab;}
  .art-item.dragging{opacity:.4;}
  .cat-label-row{display:flex;align-items:center;gap:6px;margin:12px 0 4px;}
  .cat-label-row .cat-label{margin:0;flex:1;}
  .cat-label-edit{
    font-size:11px;font-weight:700;text-transform:uppercase;color:var(--caramel-deep);
    letter-spacing:.04em;border:none;background:transparent;outline:none;flex:1;padding:1px 2px;border-radius:4px;
  }
  .cat-label-edit:focus{background:var(--line-soft);}
  .cat-del-x{border:none;background:transparent;color:var(--cocoa-soft);cursor:pointer;font-size:13px;padding:0 3px;line-height:1;}
  .cat-del-x:hover{color:#b23b3b;}
  .cat-group.dropzone-over{background:var(--line-soft);border-radius:8px;outline:1px dashed var(--caramel);}
  .drop-indicator{height:3px;background:var(--caramel);border-radius:2px;margin:1px 0;list-style:none;pointer-events:none;}
  .cat-add-row{display:flex;gap:4px;margin:4px 0 12px;}
  .cat-add-input{flex:1;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-family:inherit;}
  .cat-add-btn{border:none;background:var(--caramel);color:#fff;border-radius:6px;width:24px;font-size:15px;cursor:pointer;line-height:1;}
  .add-btn{
    margin-top:16px;width:100%;padding:8px;border-radius:8px;
    border:1.5px dashed var(--caramel);background:transparent;color:var(--caramel-deep);
    font-weight:600;cursor:pointer;font-size:12.5px;
  }
  .add-btn:hover{background:var(--line-soft);}
  .plain-btn{
    width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    color:var(--cocoa);font-weight:600;cursor:pointer;font-size:12.5px;margin-top:8px;
  }
  .plain-btn:hover{background:var(--line-soft);}
  .status{font-size:11px;color:var(--cocoa-soft);margin-top:14px;line-height:1.4;}
  .backup-row{display:flex;gap:6px;margin-top:12px;}
  .backup-btn{
    flex:1;padding:7px 4px;border-radius:6px;border:1px solid var(--line);
    background:var(--paper);color:var(--cocoa-soft);font-size:11px;cursor:pointer;
  }
  .backup-btn:hover{background:var(--line-soft);}
  .sidebar-spacer{flex:1;}
  .ed-foot{position:sticky;bottom:-20px;margin:12px -16px -20px;padding:10px 16px 12px;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 14px rgba(59,42,32,.06);z-index:5;}
  .ed-foot .status{margin:0 0 8px;}
  .ed-foot .status:empty{display:none;}
  .ed-foot .version-tag{margin:6px 0 0;color:var(--cocoa-soft);opacity:.7;}
  .ed-row{display:flex;gap:6px;}
  .ed-btn{min-width:0;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 7px;font:inherit;font-size:12.5px;font-weight:700;color:var(--cocoa);cursor:pointer;white-space:nowrap;}
  .ed-btn:hover{background:var(--line-soft);}
  .ed-btn.pub{flex:1;background:var(--caramel-deep);border-color:var(--caramel-deep);color:#fff;}
  .ed-btn.pub:disabled{opacity:.6;cursor:default;}
  .ed-btn.gear{font-size:16px;padding:6px 11px;line-height:1;}
  .tools-menu{display:none;position:absolute;right:12px;bottom:calc(100% + 6px);width:240px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(59,42,32,.2);padding:6px;}
  .tools-menu.open{display:block;}
  .tools-menu button, .tools-menu a{display:block;width:100%;box-sizing:border-box;text-align:left;border:none;background:none;font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;color:var(--cocoa);cursor:pointer;text-decoration:none;}
  .tools-menu button:hover, .tools-menu a:hover{background:var(--line-soft);}
  .tools-menu hr{border:none;border-top:1px solid var(--line-soft);margin:4px 0;}
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .help-btn{
    width:22px;height:22px;border-radius:50%;border:1px solid var(--caramel);
    background:var(--paper);color:var(--caramel-deep);font-weight:700;font-size:12px;
    cursor:pointer;flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,sans-serif;padding:0;
  }
  .help-btn:hover{background:var(--line-soft);}
  .to-list-btn{display:none;}
  .cat-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .cat-toggle:hover{color:var(--caramel);}
  .cat-chev{display:inline-block;width:10px;font-size:9px;transition:transform .15s;color:var(--cocoa-soft);}
  .cat-group.closed .cat-chev{transform:rotate(-90deg);}
  .cat-group.closed .art-list{display:none;}
  .cat-count{font-weight:600;color:var(--cocoa-soft);font-size:10.5px;letter-spacing:0;}
  .cat-chev-btn{border:none;background:transparent;cursor:pointer;padding:0 2px;line-height:1;}
  .log-entry{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 14px;margin-top:10px;}
  .log-head{font-size:13px;margin-bottom:4px;color:var(--cocoa-soft);}
  .log-head b{color:var(--cocoa);}
  .log-line{font-size:13px;line-height:1.6;}
  .log-label{font-weight:700;color:var(--caramel-deep);}
  .log-sep{margin:0 6px;color:var(--line);}
  .log-art{background:none;border:none;padding:0;font:inherit;color:var(--caramel-deep);text-decoration:underline;cursor:pointer;text-align:left;}
  .log-preview{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;}
  .crumbs{font-size:12px;color:var(--cocoa-soft);margin-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
  .crumb{background:none;border:none;padding:0;font:inherit;color:var(--caramel-deep);cursor:pointer;}
  .crumb:hover{text-decoration:underline;}
  .crumb-sep{color:var(--line);}
  .badge-new{
    display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;text-transform:uppercase;
    padding:1px 6px;border-radius:8px;background:var(--caramel);color:#fff;vertical-align:1px;
  }
  .badge-new.upd{background:var(--sage);}
  .search-snippet{display:block;font-size:11.5px;color:var(--cocoa-soft);margin-top:2px;line-height:1.35;}
  .search-snippet mark{background:#F6E3B4;color:inherit;padding:0 1px;border-radius:2px;}
  .toc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 18px;}
  .toc summary{
    font-size:11px;font-weight:700;text-transform:uppercase;color:var(--caramel-deep);letter-spacing:.04em;
    cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;
  }
  .toc summary::-webkit-details-marker{display:none;}
  .toc summary::after{content:'▾';font-size:12px;transition:transform .15s;}
  .toc:not([open]) summary::after{transform:rotate(-90deg);}
  .toc-group{margin-top:9px;}
  .toc-group-title{font-size:12.5px;font-weight:700;color:var(--cocoa);margin-bottom:3px;cursor:pointer;}
  .toc-group-title:hover{color:var(--caramel-deep);}
  .toc-items{font-size:13px;line-height:1.7;color:var(--cocoa-soft);}
  .toc-item{color:var(--caramel-deep);cursor:pointer;display:inline-block;max-width:100%;}
  .main{min-width:0;}
  .toc{max-width:100%;overflow-wrap:anywhere;}
  .toc-item:hover{text-decoration:underline;}
  .toc-sep{margin:0 6px;color:var(--line);}
  .art-body img{cursor:zoom-in;}
  .lightbox{
    position:fixed;inset:0;z-index:1000;background:rgba(30,20,14,.88);display:flex;align-items:center;
    justify-content:center;padding:16px;cursor:zoom-out;
  }
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff;}
  .lightbox-close{
    position:fixed;top:calc(12px + env(safe-area-inset-top, 0px));right:14px;width:38px;height:38px;border-radius:50%;
    border:none;background:rgba(255,255,255,.9);color:#3B2A20;font-size:20px;cursor:pointer;
  }
  .pn-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);}
  .pn-btn{
    text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    cursor:pointer;font-family:inherit;color:var(--cocoa);min-width:0;
  }
  .pn-btn:hover{border-color:var(--caramel);}
  .pn-btn.next{text-align:right;grid-column:2;}
  .pn-dir{display:block;font-size:11px;color:var(--cocoa-soft);margin-bottom:2px;}
  .pn-title{display:block;font-size:13.5px;font-weight:600;overflow-wrap:anywhere;}
  .pn-pos{font-size:11px;color:var(--cocoa-soft);margin-top:8px;text-align:center;}
  .home-hello{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px;text-wrap:balance;}
  .home-sub{color:var(--cocoa-soft);font-size:14px;margin-bottom:22px;}
  .hin{color:inherit;background:transparent;border:1px dashed transparent;border-radius:6px;padding:2px 5px;margin-left:-6px;width:calc(100% + 12px);box-sizing:border-box;display:block;}
  .hin:hover{border-color:var(--line);}
  .hin:focus{outline:none;border-color:var(--caramel);border-style:solid;background:#fff;}
  .hin::placeholder{color:#B8A894;font-weight:400;}
  .home-sub.hin{font-family:inherit;}
  .home-tiles.edit{grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));}
  .tile-e{cursor:default;gap:4px;}
  .tile-e:hover{background:var(--paper);}
  .tile-e.picking{border-color:var(--caramel);}
  .tile-e .hin{font-family:inherit;margin-left:-6px;}
  .tile-e textarea.dsc{resize:none;line-height:1.35;}
  .te-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .te-ico{font-size:24px;line-height:1;background:none;border:1px dashed var(--line);border-radius:8px;padding:4px 6px;cursor:pointer;min-width:40px;}
  .te-ico:hover{border-color:var(--caramel);background:#fff;}
  .te-ico img{width:40px;height:40px;object-fit:contain;display:block;}
  .home-tile .tile-img{width:56px;height:56px;object-fit:contain;display:block;}
  .pick-img{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .art-body a.kb-link{color:var(--caramel-deep);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
  .edit-tabs{display:flex;gap:4px;margin-bottom:8px;}
  .edit-tab{border:1px solid var(--line);background:var(--paper);color:var(--cocoa-soft);border-radius:8px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
  .edit-tab.on{background:var(--cocoa);border-color:var(--cocoa);color:#fff;}
  .edit-preview{border:1px dashed var(--line);border-radius:8px;padding:12px 16px;background:var(--cream);}
  .home-hero{display:flex;align-items:center;gap:24px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 22px;margin-bottom:22px;}
  .home-hero.nohero{display:block;background:none;border:none;padding:0;border-radius:0;}
  .hero-img{max-width:280px;max-height:150px;display:block;object-fit:contain;}
  .hero-txt{flex:1;min-width:0;}
  .home-hero .home-sub{margin-bottom:0;}
  .hero-tools{display:flex;gap:4px;margin-top:6px;}
  .hero-add{border:1px dashed var(--line);background:none;color:var(--cocoa-soft);font:inherit;font-size:12px;border-radius:8px;padding:4px 10px;cursor:pointer;margin-bottom:8px;}
  .hero-add:hover{border-color:var(--caramel);color:var(--caramel-deep);}
  .ri-img{width:24px;height:24px;object-fit:contain;display:block;}
  .sec-ico img{width:20px;height:20px;object-fit:contain;display:block;margin:auto;}
  .sec-title-img{width:24px;height:24px;object-fit:contain;vertical-align:-4px;margin-right:4px;}
  @media (max-width:760px){ .home-hero{flex-direction:column;align-items:flex-start;gap:10px;} .hero-img{max-width:100%;} }
  .te-tools{display:flex;gap:2px;opacity:.35;}
  .tile-e:hover .te-tools, .tile-e:focus-within .te-tools{opacity:1;}
  @media (hover:none){ .te-tools{opacity:1;} }
  .te-tools button{border:none;background:var(--line-soft);color:var(--cocoa-soft);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px;}
  .te-tools button.armed{color:#A63446;font-weight:700;}
  .te-target{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:4px;border-top:1px dashed var(--line-soft);font-size:12px;color:var(--cocoa-soft);}
  .te-target select{flex:1;min-width:0;font-family:inherit;font-size:11.5px;border:1px solid transparent;background:transparent;color:var(--cocoa-soft);padding:2px;border-radius:5px;cursor:pointer;}
  .te-target select:hover{border-color:var(--line);}
  .te-target.bad select{color:#A63446;border-color:#A63446;}
  .te-go{border:none;background:none;color:var(--caramel-deep);font:inherit;font-size:11.5px;cursor:pointer;padding:2px;}
  .te-pick{grid-column:1/-1;background:var(--paper);border:1px solid var(--caramel);border-radius:12px;padding:10px;}
  .tile-add-e{border-style:dashed;align-items:center;justify-content:center;color:var(--cocoa-soft);min-height:150px;}
  .tile-add-e .ico{color:var(--caramel);}
  .sec-ico{background:var(--paper) !important;border:1px solid var(--caramel) !important;font-size:15px !important;}
  .sec-pick{background:var(--paper);border:1px solid var(--caramel);border-radius:10px;padding:8px;margin-top:4px;}
  .ico-pick{}
  .ico-cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .ico-cat{border:1px solid var(--line);background:#fff;color:var(--cocoa-soft);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;}
  .ico-cat.on{background:var(--caramel);border-color:var(--caramel);color:#fff;}
  .ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;}
  .ico-opt{border:1px solid transparent;background:#fff;border-radius:8px;font-size:22px;height:40px;cursor:pointer;padding:0;}

function rebuildSections(){
  SECTIONS.length = 0;
  BASE_SECTIONS.forEach(x=>{
    if(BASE_SECTION_STATE.deleted.indexOf(x.id) !== -1) return;
    SECTIONS.push({id:x.id, label:BASE_SECTION_STATE.renamed[x.id] || x.label});
  });
  Object.keys(SECTION_AXES).forEach(k=>{ if(!BASE_SECTIONS.some(b=>b.id === k)) delete SECTION_AXES[k]; });
  Object.keys(EDITABLE_AXES).forEach(k=>{ if(EDITABLE_AXES[k].custom) delete EDITABLE_AXES[k]; });
  CUSTOM_SECTIONS.forEach(cs=>{
    SECTIONS.push({id:cs.id, label:cs.label, custom:true});
    SECTION_AXES[cs.id] = [{id:cs.id, label:cs.label, field:'customTags', cats:cs.cats}];
    EDITABLE_AXES[cs.id] = {cats:cs.cats, field:'customTags', custom:true};
  });
}

}

/* ---------- publikování na GitHub ---------- */
const GH_REPO = 'svragent/sladka_KB';
const GH_FILE = 'data.js';
function getUnpublishedFlag(){
  try{ return localStorage.getItem('kb-unpublished'); }catch(e){ return null; }
}
function setUnpublishedFlag(val){
  try{ localStorage.setItem('kb-unpublished', val); }catch(e){}
}
function updatePublishStatus(){
  if(MODE !== 'editor'){ $('status').textContent = ''; return; }
  $('status').textContent = getUnpublishedFlag() === '1'
    ? 'Máš nepublikované změny – klikni na ☁ Publikovat na web.'
    : 'Vše je publikované.';
}
function markUnpublished(){
  setUnpublishedFlag('1');
  updatePublishStatus();
}
function toBase64Utf8(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 32768){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  }
  return btoa(bin);
}
async function hashText(str){
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).slice(0, 10).map(b=>b.toString(16).padStart(2, '0')).join('');
}
async function publishToGitHub(){
  if(editing){ $('status').textContent = 'Nejdřív článek ulož nebo zruš úpravu.'; return; }
  let token = null;
  try{ token = localStorage.getItem('kb-gh-token'); }catch(e){}
  if(!token){
    token = (prompt('Vlož GitHub token (uloží se jen v tomto prohlížeči):') || '').trim();
    if(!token) return;
    try{ localStorage.setItem('kb-gh-token', token); }catch(e){}
  }
  const btn = $('publishBtn');
  btn.disabled = true;
  $('status').textContent = 'Publikuji…';
  const publishedAt = new Date().toISOString();
  const apiBase = 'https://api.github.com/repos/' + GH_REPO + '/contents/';
  const url = apiBase + GH_FILE;
  const headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'};
  try{
    // Ochrana proti přepsání: publikoval mezitím někdo jiný?
    const baseAt = loadJSON('kb-base-published-at') || '';
    const checkRes = await fetch(url + '?ref=main', {headers: headers, cache: 'no-store'});
    if(checkRes.status === 401 || checkRes.status === 403 || checkRes.status === 404) throw new Error('auth');
    if(!checkRes.ok) throw new Error('get');
    const checkInfo = await checkRes.json();
    let remoteAt = '';
    if(checkInfo.content){
      const bytes = Uint8Array.from(atob(checkInfo.content.replace(/\s/g, '')), c=>c.charCodeAt(0));
      const m = new TextDecoder().decode(bytes).match(/"publishedAt":\s*"([^"]*)"/);
      if(m) remoteAt = m[1];
    }
    if(baseAt && remoteAt && remoteAt > baseAt){
      const d = new Date(remoteAt);
      const when = d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
      if(!confirm('Na webu je novější verze, kterou mezitím publikoval někdo jiný (' + when + ').\n\nKdyž budeš pokračovat, jeho změny se PŘEPÍŠOU tvými.\n\nOpravdu publikovat?')){
        $('status').textContent = 'Publikace zrušena – na webu je novější verze. Ulož si zálohu svých změn a domluv se, kdo co upravoval.';
        btn.disabled = false;
        return;
      }
    }

    // Obrázky vložené v textu nahraj jako samostatné soubory do složky images/
    const imgMap = {};
    const found = [];
    articles.forEach(a=>{
      const re = /src="(data:image\/(png|jpe?g|gif|webp);base64,([^"]+))"/g;
      let m;
      while((m = re.exec(a.body || '')) !== null){
        if(imgMap[m[1]] === undefined){
          imgMap[m[1]] = '';
          found.push({dataUrl: m[1], ext: (m[2] === 'jpeg' ? 'jpg' : m[2]), b64: m[3]});
        }
      }
    });
    const addImg = v=>{
      const m = String(v || '').match(/^data:image\/(png|jpe?g|gif|webp);base64,(.+)$/);
      if(m && imgMap[v] === undefined){
        imgMap[v] = '';
        found.push({dataUrl: v, ext: (m[1] === 'jpeg' ? 'jpg' : m[1]), b64: m[2]});
      }
    };
    HOME.tiles.forEach(t=>addImg(t.img));
    addImg(HOME.hero);
    Object.keys(SECTION_ICONS).forEach(k=>addImg(SECTION_ICONS[k]));
    for(let i = 0; i < found.length; i++){
      $('status').textContent = 'Nahrávám obrázky ' + (i + 1) + '/' + found.length + '…';
      const f = found[i];
      const name = 'images/' + (await hashText(f.b64)) + '.' + f.ext;
      const imgRes = await fetch(apiBase + name, {
        method: 'PUT',
        headers: headers,
        body: JSON.stringify({message: 'Obrázek ' + name, content: f.b64, branch: 'main'})
      });
      if(imgRes.status === 401 || imgRes.status === 403) throw new Error('auth');
      if(!imgRes.ok && imgRes.status !== 422) throw new Error('img'); // 422 = soubor už na GitHubu je
      imgMap[f.dataUrl] = name;
    }
    $('status').textContent = 'Publikuji…';
    const payload = {
      publishedAt: publishedAt,
      postupCats: POSTUP_CATS,
      manualCats: MANUAL_CATS,
      wikiCats: WIKI_CATS,
      troubleshootCats: TROUBLESHOOT_CATS,
      customSections: CUSTOM_SECTIONS,
      baseSections: BASE_SECTION_STATE,
      home: Object.assign({}, HOME, {
        hero: (HOME.hero && imgMap[HOME.hero]) ? imgMap[HOME.hero] : HOME.hero,
        tiles: HOME.tiles.map(t=> (t.img && imgMap[t.img]) ? Object.assign({}, t, {img: imgMap[t.img]}) : t)
      }),
      branches: BRANCHES,
      sectionIcons: Object.keys(SECTION_ICONS).reduce((o, k)=>{ o[k] = imgMap[SECTION_ICONS[k]] || SECTION_ICONS[k]; return o; }, {}),
      roles: roles,
      seedAll: articles.map(a=>{
        const c = Object.assign({}, a);
        delete c.content;
        delete c.images;
        delete c.isNew;
        if(c.body) c.body = c.body.replace(/src="(data:image\/[^"]+)"/g, (all, d)=> imgMap[d] ? 'src="' + imgMap[d] + '"' : all);
        return c;
      })
    };
    const text = 'const INITIAL_DATA = ' + JSON.stringify(payload, null, 1) + ';\n';
    const getRes = await fetch(url + '?ref=main', {headers: headers, cache: 'no-store'});
    if(getRes.status === 401 || getRes.status === 403 || getRes.status === 404) throw new Error('auth');
    if(!getRes.ok) throw new Error('get');
    const info = await getRes.json();
    const putRes = await fetch(url, {
      method: 'PUT',
      headers: headers,
      body: JSON.stringify({
        message: 'Publikace ' + publishedAt.slice(0, 16).replace('T', ' '),
        content: toBase64Utf8(text),
        sha: info.sha,
        branch: 'main'
      })
    });
    if(putRes.status === 401 || putRes.status === 403) throw new Error('auth');
    if(!putRes.ok) throw new Error('put');
    saveJSON('kb-published-at', publishedAt);
    saveJSON('kb-base-published-at', publishedAt);
    setUnpublishedFlag('0');
    $('status').textContent = 'Publikováno. Na webu se změny projeví do pár minut.';
  }catch(e){
    if(e.message === 'auth'){
      try{ localStorage.removeItem('kb-gh-token'); }catch(err){}
      $('status').textContent = 'Publikace selhala: neplatný token nebo chybí oprávnění. Při dalším pokusu zadej token znovu.';
    } else {
      $('status').textContent = 'Publikace selhala (síť nebo GitHub). Zkus to znovu.';
    }
  }
  btn.disabled = false;
}

/* ---------- kategorie ---------- */
function loadEditableCats(){
  const cs = loadJSON('kb-custom-sections');
  if(Array.isArray(cs)) CUSTOM_SECTIONS = cs;
  const bs = loadJSON('kb-base-sections');
  if(bs && typeof bs === 'object'){ BASE_SECTION_STATE = bs; normBaseState(); }
  const hm = loadJSON('kb-home');
  if(hm && Array.isArray(hm.tiles)) HOME = hm;
  const si = loadJSON('kb-section-icons');
  if(si && typeof si === 'object') SECTION_ICONS = si;
  const br = loadJSON('kb-branches');
  if(Array.isArray(br)) BRANCHES = br;
  rebuildSections();
  Object.keys(EDITABLE_AXES).forEach(key=>{
    const ax = EDITABLE_AXES[key];
    if(ax.custom) return;
    const loaded = loadJSON(ax.storageKey);
    if(loaded && Array.isArray(loaded) && loaded.length){
      ax.cats.length = 0;
      loaded.forEach(c=>ax.cats.push(c));
    } else {
      saveJSON(ax.storageKey, ax.cats);
    }
  });
}
function saveEditableCats(key){
  if(EDITABLE_AXES[key] && EDITABLE_AXES[key].custom){ saveCustomSections(); return; }
  if(saveJSON(EDITABLE_AXES[key].storageKey, EDITABLE_AXES[key].cats, 'Uložení kategorií selhalo.')) markUnpublished();
}

/* ---------- video ---------- */
function detectVideo(url){
  if(!url) return null;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
  if(yt) return {type:'youtube', id:yt[1]};
  if(/dropbox\.com/.test(url)) return {type:'dropbox', raw:url.replace(/\?dl=0/,'?raw=1').replace(/[?&]dl=1/,'?raw=1')};
  return {type:'other', url:url};
}
function videoBlockHtml(url){
  const v = detectVideo(url);
  if(!v) return '';
  if(v.type === 'youtube'){
    if(videoOpen){
      return '<div class="video-block"><iframe src="https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>';
    }
    return '<div class="video-block"><div class="video-thumb" id="videoThumb">' +
      '<img src="https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg" alt="Náhled videa">' +
      '<div class="video-play"><span>▶</span></div></div></div>';
  }
  if(v.type === 'dropbox'){
    if(videoOpen){
      return '<div class="video-block"><video src="' + escapeHtml(v.raw) + '" controls autoplay></video></div>';
    }
    return '<div class="video-block"><div class="video-thumb" id="videoThumb" style="background:var(--cocoa)">' +
      '<div class="video-play"><span>▶</span></div></div></div>';
  }
  return '<div class="video-block"><a class="btn video-link-btn" href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">▶ Přehrát video</a></div>';
}

// Video vložené kamkoli do textu článku: <div class="kb-video" data-url="…">
function inlineVideoHtml(url, idx){
  const v = detectVideo(url);
  if(!v) return '';
  if(v.type === 'youtube'){
    return '<div class="video-block"><div class="video-thumb" data-inline-video="' + idx + '">' +
      '<img src="https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg" alt="Náhled videa">' +
      '<div class="video-play"><span>▶</span></div></div></div>';
  }
  if(v.type === 'dropbox'){
    return '<div class="video-block"><div class="video-thumb" data-inline-video="' + idx + '" style="background:var(--cocoa)">' +
      '<div class="video-play"><span>▶</span></div></div></div>';
  }
  return '<div class="video-block"><a class="btn video-link-btn" href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">▶ Přehrát video</a></div>';
}
function bindInlineVideos(container){
  const urls = [];
  container.querySelectorAll('.kb-video').forEach(el=>{
    const url = el.getAttribute('data-url') || '';
    urls.push(url);
    const wrap = document.createElement('div');
    wrap.innerHTML = inlineVideoHtml(url, urls.length - 1);
    el.replaceWith(...wrap.childNodes);
  });
  container.querySelectorAll('[data-inline-video]').forEach(th=>{
    th.onclick = ()=>{
      const v = detectVideo(urls[parseInt(th.dataset.inlineVideo, 10)]);
      if(!v) return;
      th.outerHTML = (v.type === 'youtube')
        ? '<iframe src="https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'
        : '<video src="' + escapeHtml(v.raw) + '" controls autoplay></video>';
    };
  });
}

// Staré pole „Video (odkaz)“ → video na konec textu článku
function migrateVideoField(a){
  if(!a.videoUrl) return false;
  a.body = (a.body || '') + '<div class="kb-video" contenteditable="false" data-url="' + escapeHtml(a.videoUrl) + '">🎬 Video: ' + escapeHtml(a.videoUrl) + '</div>';
  a.videoUrl = '';
  return true;
}

/* ---------- obrázky ---------- */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image load failed'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Malý obrázek pro dlaždici: průhledné obrázky (PNG, SVG, WebP, GIF) zůstanou PNG, fotky JPEG
function resizeTileImage(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image load failed'));
      img.onload = ()=>{
        let w = img.naturalWidth || img.width || maxDim, h = img.naturalHeight || img.height || maxDim;
        const k = Math.min(1, maxDim / Math.max(w, h));
        if(/svg/.test(file.type)) { const k2 = maxDim / Math.max(w, h); w = Math.round(w * k2); h = Math.round(h * k2); }
        else { w = Math.round(w * k); h = Math.round(h * k); }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(/jpe?g/.test(file.type) ? canvas.toDataURL('image/jpeg', 0.88) : canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- init ---------- */
function init(){
  const existing = loadArticles();
  const unpublished = getUnpublishedFlag();
  const publishedAt = _initData.publishedAt || '';
  const localPublishedAt = loadJSON('kb-published-at') || '';
  // Lokální kopii použij, když má editor nepublikované změny,
  // nebo když web ještě neukazuje poslední publikaci z tohoto prohlížeče.
  const useLocal = !!existing && ((MODE === 'editor' && unpublished === '1') || localPublishedAt > publishedAt);

  if(useLocal){
    loadEditableCats();
    articles = existing;
    roles = loadJSON('kb-roles') ? loadRoles() : (Array.isArray(_initData.roles) ? JSON.parse(JSON.stringify(_initData.roles)) : []);
  } else {
    articles = JSON.parse(JSON.stringify(SEED_ALL));
    roles = Array.isArray(_initData.roles) ? JSON.parse(JSON.stringify(_initData.roles)) : loadRoles();
  }
  articles.forEach(a=>{
    if(!a.images) a.images = [];
    if(a.videoUrl == null) a.videoUrl = '';
    if(!a.section) a.section = 'sop';
    if(!a.wikiTags) a.wikiTags = [];
    if(!a.troubleshootTags) a.troubleshootTags = [];
    if(!a.customTags) a.customTags = [];
    if(!a.related) a.related = [];
    if(!a.files) a.files = [];
    if(!a.branches) a.branches = [];
    if(!sectionExists(a.section)) a.section = firstSectionId();
  });
  if(branchId && !BRANCHES.some(b=>b.id === branchId)) branchId = '';
  if(!sectionExists(sectionId)){ sectionId = firstSectionId(); axisId = currentAxes()[0].id; }
  
  const prostory = articles.find(a=>a.id === 'prostory');
  if(prostory && prostory.section !== 'wiki'){
    prostory.section = 'wiki';
    prostory.wikiTags = ['prostory_zazemi'];
  }
  
  let migrated = false;
  articles.forEach(a=>{
    if(a.body == null){
      a.body = legacyContentToHtml(a);
      migrated = true;
    }
    if(migrateVideoField(a)) migrated = true;
  });
  if(useLocal){
    if(migrated) saveArticles();
  } else if(MODE === 'editor'){
    saveArticles();
    saveRoles();
    Object.keys(EDITABLE_AXES).forEach(key=>saveEditableCats(key));
    saveCustomSections();
    saveBaseSections();
    saveHome();
    saveBranches();
    saveSectionIcons();
    setUnpublishedFlag('0');
    saveJSON('kb-base-published-at', publishedAt);
  }

  if(articles.length) activeId = articles[0].id;
  // první návštěva: vše bereme jako přečtené, značky se ukážou až u dalších změn
  if(!loadJSON('kb-seen')){
    const seen = {};
    articles.forEach(a=>{ seen[a.id] = a.updatedAt || ''; });
    saveJSON('kb-seen', seen);
  }
  const fromLink = openFromHash();
  if(!fromLink){ view = 'home'; activeId = null; }
  if(openBranchesHash()) activeId = null;
  window.addEventListener('hashchange', ()=>{ if(handleEditorHash()){ location.reload(); return; } if(openBranchesHash()){ render(); return; } if(openFromHash()){ render(); scrollToMainOnMobile(); } });
  let versionText = APP_VERSION;
  if(publishedAt){
    const d = new Date(publishedAt);
    versionText += ' · data: ' + d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear() + ' ' +
      d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  $('versionTag').textContent = versionText;
  $('searchInput').oninput = ()=>{ searchQuery = $('searchInput').value; renderSectionSwitch(); renderAxisSwitch(); renderCatList(); };
  applyMode();
  render();
  if(fromLink) scrollToMainOnMobile();
}

  $('railCard').style.display = isEditor ? 'flex' : 'none';

  updatePublishStatus();

let secEdit = null;   // null | 'new' | id sekce, která se přejmenovává
let secIcoV = '', secNameV = '', secPickOpen = false, secImgV = '';
// Rozdělí název sekce na ikonu (emoji na začátku) a text
function splitSecLabel(l){
  const m = String(l || '').match(/^(\S+)\s+(.+)$/);
  if(m && !/[A-Za-z0-9\u00C0-\u024F]/.test(m[1])) return {ico:m[1], name:m[2]};
  return {ico:'', name:String(l || '')};
}
function secStart(id, label){
  const p = splitSecLabel(label);
  secEdit = id; secIcoV = p.ico || (id === 'new' ? '📁' : ''); secNameV = p.name; secPickOpen = false;
  secImgV = (id !== 'new' && SECTION_ICONS[id]) || '';
}
function secFormHtml(){
  return '<div class="sec-form"><button class="sec-ico" id="secIcoBtn" title="Vybrat ikonu nebo obrázek sekce">' + (secImgV ? '<img src="' + escapeHtml(secImgV) + '" alt="">' : escapeHtml(secIcoV || '+')) + '</button>' +
    '<input id="secInput" maxlength="40" placeholder="Název sekce" value="' + escapeHtml(secNameV) + '">' +
    '<button class="ok" id="secOk" title="Uložit">✓</button><button class="no" id="secNo" title="Zrušit">✕</button></div>' +
    (secPickOpen ? '<div class="sec-pick"><div class="pick-img"><button type="button" class="btn ghost" id="secImgBtn">🖼 Obrázek z počítače…</button>' +
      (secImgV ? '<button type="button" class="btn ghost" id="secImgDel">✕ Odebrat</button>' : '') +
      '<input type="file" id="secImgInput" accept="image/*" style="display:none;"></div>' + icoPickerHtml() + '</div>' : '');
}
function shortSec(n){ return String(n || '').replace(/\s*\(.*?\)\s*/g, ' ').trim(); }
function renderSectionSwitch(){
  const isEditor = MODE === 'editor';
  const onHome = view === 'home';
  $('sectionSwitch').innerHTML = SECTIONS.map(s=>{
    const p = splitSecLabel(s.label);
    return '<button class="rail-btn' + (!onHome && s.id === sectionId ? ' on' : '') + '" data-section="' + s.id + '" title="' + escapeHtml(s.label) + '">' +
      '<span class="ri">' + secIconHtml(s, p) + '</span>' + escapeHtml(shortSec(p.name)) + '</button>';
  }).join('') + (isEditor ? '<button class="rail-add" id="secAddBtn" title="Přidat sekci">+</button>' : '');
  $('railHome').classList.toggle('on', onHome);
  let head = '';
  if(isEditor && secEdit === 'new'){
    head = '<div class="panel-h">Nová sekce</div>' + secFormHtml();
  } else if(!onHome && !searchQuery.trim()){
    const s = SECTIONS.find(x=>x.id === sectionId);
    if(s){
      if(isEditor && secEdit === s.id) head = secFormHtml();
      else head = '<div class="sec-head"><span class="sec-title">' + (SECTION_ICONS[s.id] ? '<img class="sec-title-img" src="' + escapeHtml(SECTION_ICONS[s.id]) + '" alt="">' + escapeHtml(splitSecLabel(s.label).name) : escapeHtml(s.label)) + '</span>' +
        (isEditor ? '<button class="sec-tool" data-sec-rename="' + s.id + '" title="Přejmenovat sekci a změnit ikonu">✎</button><button class="sec-tool" data-sec-del="' + s.id + '" title="Smazat sekci">✕</button>' : '') +
        '</div>';
    }
  }
  $('secHead').innerHTML = head;
  if(isEditor) bindSectionTools();
  $('sectionSwitch').querySelectorAll('[data-section]').forEach(b=>{
    b.onclick = ()=>openSection(b.dataset.section);
  });
}
// První článek sekce, který čtenář smí vidět (v pořadí kategorií)
function firstVisibleInSection(id){
  const isEditor = MODE === 'editor';
  const role = isEditor ? null : currentRole();
  const vis = a => a.section === id && (isEditor || articleVisibleToRole(a, role));
  const ax = (SECTION_AXES[id] || [])[0];
  if(ax){
    for(const c of ax.cats){
      const f = articles.find(a=>vis(a) && (a[ax.field] || []).indexOf(c.id) !== -1);
      if(f) return f;
    }
  }
  return articles.find(vis) || null;
}
// Klik na sekci v liště: na počítači otevře její první článek, na mobilu ukáže seznam
function openSection(id){
  if(!canLeaveEdit()) return;
  sectionId = id;
  axisId = currentAxes()[0].id;
  editing = false;
  videoOpen = false;
  searchQuery = '';
  $('searchInput').value = '';
  view = 'article';
  if(isMobile()){
    render();
    document.body.classList.add('m-panel');
    window.scrollTo(0, 0);
    return;
  }
  const first = firstVisibleInSection(id);
  activeId = first ? first.id : null;
  render();
  window.scrollTo(0, 0);
}

function bindSectionTools(){
  const add = $('secAddBtn');
  if(add) add.onclick = ()=>{ secStart('new', ''); renderSectionSwitch(); if(isMobile()){ document.body.classList.add('m-panel'); window.scrollTo(0, 0); } $('secInput').focus(); };
  const input = $('secInput');
  if(input){
    input.oninput = ()=>{ secNameV = input.value; };
    $('secIcoBtn').onclick = ()=>{ secPickOpen = !secPickOpen; renderSectionSwitch(); };
    $('secHead').querySelectorAll('[data-ico-cat]').forEach(b=>{ b.onclick = ()=>{ icoCat = +b.dataset.icoCat; renderSectionSwitch(); }; });
    $('secHead').querySelectorAll('[data-ico]').forEach(b=>{ b.onclick = ()=>{ secIcoV = b.dataset.ico; secImgV = ''; secPickOpen = false; renderSectionSwitch(); $('secInput').focus(); }; });
    if($('secImgBtn')){
      $('secImgBtn').onclick = ()=>$('secImgInput').click();
      $('secImgInput').onchange = async ()=>{
        const f = $('secImgInput').files[0];
        $('secImgInput').value = '';
        if(!f) return;
        try{ secImgV = await resizeTileImage(f, 96); secPickOpen = false; renderSectionSwitch(); }
        catch(e){ $('status').textContent = 'Obrázek se nepodařilo načíst.'; }
      };
    }
    if($('secImgDel')) $('secImgDel').onclick = ()=>{ secImgV = ''; secPickOpen = false; renderSectionSwitch(); };
    const finish = ok=>{
      const name = input.value.trim() ? ((secIcoV ? secIcoV + ' ' : '') + input.value.trim()) : '';
      if(ok && name){
        if(secEdit === 'new'){
          const id = 'sec_' + Date.now().toString(36);
          CUSTOM_SECTIONS.push({id: id, label: name, cats: []});
          rebuildSections();
          saveCustomSections();
          sectionId = id; axisId = id; activeId = null; view = 'article';
        } else {
          const cs = CUSTOM_SECTIONS.find(x=>x.id === secEdit);
          if(cs){ cs.label = name; saveCustomSections(); }
          else { BASE_SECTION_STATE.renamed[secEdit] = name; saveBaseSections(); }
          rebuildSections();
        }
        const tid = secEdit === 'new' ? sectionId : secEdit;
        if(secImgV) SECTION_ICONS[tid] = secImgV; else delete SECTION_ICONS[tid];
        saveSectionIcons();
      }
      secEdit = null;
      render();
    };
    $('secOk').onclick = ()=>finish(true);
    $('secNo').onclick = ()=>finish(false);
    input.onkeydown = e=>{ if(e.key === 'Enter') finish(true); if(e.key === 'Escape') finish(false); };
  }
  $('secHead').querySelectorAll('[data-sec-rename]').forEach(b=>{
    b.onclick = ()=>{ const sx = SECTIONS.find(x=>x.id === b.dataset.secRename); secStart(b.dataset.secRename, sx ? sx.label : ''); renderSectionSwitch(); const i = $('secInput'); i.focus(); i.select(); };
  });
  $('secHead').querySelectorAll('[data-sec-del]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.secDel;
      const count = articles.filter(a=>a.section === id).length;
      if(count){
        $('status').textContent = 'Sekci nejde smazat, protože v ní jsou články (' + count + '). Nejdřív je přesuň do jiné sekce nebo smaž.';
        return;
      }
      if(SECTIONS.length <= 1){
        $('status').textContent = 'Poslední sekci nejde smazat – znalostní báze musí mít aspoň jednu.';
        return;
      }
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = 'Smazat?'; return; }
      const cs = CUSTOM_SECTIONS.find(x=>x.id === id);
      if(cs){
        const catIds = cs.cats.map(c=>c.id);
        CUSTOM_SECTIONS = CUSTOM_SECTIONS.filter(x=>x.id !== id);
        saveCustomSections();
        if(catIds.length){ roles.forEach(r=>{ r.allowedCats = r.allowedCats.filter(t=>catIds.indexOf(t) === -1); }); saveRoles(); }
      } else {
        if(BASE_SECTION_STATE.deleted.indexOf(id) === -1) BASE_SECTION_STATE.deleted.push(id);
        saveBaseSections();
      }
      rebuildSections();
      if(sectionId === id){ sectionId = firstSectionId(); axisId = currentAxes()[0].id; activeId = null; }
      render();
    };
  });
}

function renderAxisSwitch(){
  const axes = currentAxes();
  if(axes.length <= 1 || view === 'home' || searchQuery.trim()){
    $('axisSwitch').innerHTML = '';
    $('axisSwitch').style.display = 'none';
    return;

  $('axisSwitch').style.display = 'flex';
  $('axisSwitch').innerHTML = axes.map(a=>
    '<button class="axis-btn' + (a.id===axisId ? ' active' : '') + '" data-axis="' + a.id + '">' + escapeHtml(a.label) + '</button>'
  ).join('');
  $('axisSwitch').querySelectorAll('[data-axis]').forEach(b=>{
    b.onclick = ()=>{ if(!canLeaveEdit()) return; axisId = b.dataset.axis; editing = false; render(); };
  });
}

function renderCatList(){
  const isEditor = MODE === 'editor';
  const role = isEditor ? null : currentRole();
  if(!isEditor && !role){
    $('catList').innerHTML = '<div class="status">Klikni v liště na 👤 a vyber svou roli – appka ti pak ukáže návody pro tebe.</div>';
    return;
  }
  const q = fold(searchQuery.trim());
  if(q){
    let pool = articles.filter(a=> isEditor || articleVisibleToRole(a, role));
    pool = pool.filter(a=> fold(a.title).indexOf(q)!==-1 || fold(plainText(a.body)).indexOf(q)!==-1);
    let html = '<div class="cat-group search-results"><div class="cat-label">Výsledky hledání (' + pool.length + ')</div>';
    html += pool.length
      ? '<ul class="art-list">' + pool.map(a=>'<li class="art-item' + (a.id===activeId ? ' active' : '') + '" data-open="' + a.id + '">' + escapeHtml(a.title) + artBadge(a) + searchSnippet(a, q) + '</li>').join('') + '</ul>'
      : '<div class="status">Nic nenalezeno.</div>';
    html += '</div>';
    $('catList').innerHTML = html;
    $('catList').querySelectorAll('[data-open]').forEach(el=>{
      el.onclick = ()=>{ if(!canLeaveEdit()) return; activeId = el.dataset.open; editing = false; videoOpen = false; view = 'article'; render(); scrollToMainOnMobile(); };
    });
    return;
  }
  if(view === 'home'){
    const nw = homeNewList(a=> isEditor || articleVisibleToRole(a, role));
    $('catList').innerHTML = nw.list.length
      ? '<div class="panel-h">' + escapeHtml(nw.title) + '</div>' + nw.list.map(a=>{
          const sec = SECTIONS.find(x=>x.id === a.section);
          return '<button class="new-item" data-open="' + a.id + '">' + escapeHtml(a.title) + artBadge(a) +
            '<small>' + escapeHtml(sec ? shortSec(splitSecLabel(sec.label).name) : '') + (a.updatedAt ? ' · ' + escapeHtml(fmtUpdated(a.updatedAt)) : '') + '</small></button>';
        }).join('')
      : '';
    $('catList').querySelectorAll('[data-open]').forEach(el=>{ el.onclick = ()=>openArticle(el.dataset.open); });
    return;
  }
  const axis = currentAxis();
  const itemLi = a => '<li class="art-item' + (a.id===activeId ? ' active' : '') + '"' +
    (isEditor ? ' draggable="true"' : '') + ' data-open="' + a.id + '">' + escapeHtml(a.title) + artBadge(a) + '</li>';
  let html = '';
  // Na mobilu je rozbalená jen kategorie s otevřeným článkem, na počítači všechny – pokud je uživatel sám nepřepnul.
  const activeInSec = articles.some(a=>a.id === activeId && a.section === sectionId);
  let firstOpenDone = false;
  const isOpen = (catId, items)=>{
    if(catId in catOpen) return catOpen[catId];
    if(!isMobile() || items.some(a=>a.id === activeId)) return true;
    if(!activeInSec && !firstOpenDone && items.length){ firstOpenDone = true; return true; }
    return false;
  };
  const chev = '<span class="cat-chev">▼</span>';
  axis.cats.forEach(cat=>{
    const items = articles.filter(a=>a.section===sectionId && (a[axis.field]||[]).indexOf(cat.id) !== -1 &&
      (isEditor || articleVisibleToRole(a, role)));
    if(!isEditor && !items.length) return;
    const count = '<span class="cat-count">' + items.length + '</span>';
    html += '<div class="cat-group' + (isOpen(cat.id, items) ? '' : ' closed') + '" data-catgroup="' + cat.id + '">' +
      (isEditor
        ? '<div class="cat-label-row"><button class="cat-chev-btn" data-cat-toggle="' + cat.id + '" title="Rozbalit / sbalit">' + chev + '</button><input class="cat-label-edit" data-cat-rename2="' + cat.id + '" value="' + escapeHtml(cat.label) + '">' + count + '<button class="cat-del-x" title="Smazat kategorii" data-cat-del2="' + cat.id + '">×</button></div>'
        : '<div class="cat-label cat-toggle" data-cat-toggle="' + cat.id + '">' + chev + '<span>' + escapeHtml(cat.label) + '</span>' + count + '</div>') +
      '<ul class="art-list">' + items.map(itemLi).join('') + '</ul></div>';
  });
  if(isEditor){
    html += '<div class="cat-add-row"><input class="cat-add-input" id="newCatInline" placeholder="+ Nová kategorie"><button class="cat-add-btn" id="addCatInline">+</button></div>';
    const unTagged = articles.filter(a=>a.section===sectionId && !(a[axis.field]||[]).length);
    html += '<div class="cat-group" data-catgroup="__none__"><div class="cat-label">Nezařazeno</div><ul class="art-list">' +
      (unTagged.length ? unTagged.map(itemLi).join('') : '<li class="art-item" style="cursor:default;color:var(--cocoa-soft);">–</li>') +
      '</ul></div>';
  }
  $('catList').innerHTML = html || '<div class="status">' + (isEditor ? 'V téhle sekci zatím nejsou žádné kategorie.' : 'Pro tvoji roli zatím nejsou povolené žádné kategorie v téhle sekci.') + '</div>';
  $('catList').querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{
      if(!canLeaveEdit()) return;
      const g = el.closest('[data-catgroup]');
      navCatId = g ? g.dataset.catgroup : null;
      activeId = el.dataset.open; editing = false; videoOpen = false; view = 'article'; render(); scrollToMainOnMobile();
    };
  });
  $('catList').querySelectorAll('[data-cat-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const g = el.closest('.cat-group');
      const nowOpen = g.classList.contains('closed');
      g.classList.toggle('closed', !nowOpen);
      catOpen[el.dataset.catToggle] = nowOpen;
    };
  });
  if(!isEditor) return;

  // --- drag & drop článků mezi kategoriemi, s indikátorem přesné pozice ---
  let draggedId = null;
  function clearIndicator(){
    const ind = $('catList').querySelector('.drop-indicator');
    if(ind) ind.remove();
  }
  $('catList').querySelectorAll('.art-item[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ draggedId = el.dataset.open; el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); clearIndicator(); });
  });
  $('catList').querySelectorAll('.cat-group').forEach(group=>{
    const list = group.querySelector('.art-list');
    group.addEventListener('dragover', e=>{
      e.preventDefault();
      group.classList.add('dropzone-over');
      if(!list) return;
      const hovered = e.target.closest('.art-item');
      clearIndicator();
      const line = document.createElement('li');
      line.className = 'drop-indicator';
      if(hovered && hovered.dataset.open !== draggedId){
        const rect = hovered.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        hovered.insertAdjacentElement(before ? 'beforebegin' : 'afterend', line);
      } else if(!hovered){
        list.appendChild(line);
      }
    });
    group.addEventListener('dragleave', e=>{
      if(!group.contains(e.relatedTarget)){ group.classList.remove('dropzone-over'); clearIndicator(); }
    });
    group.addEventListener('drop', e=>{
      e.preventDefault();
      group.classList.remove('dropzone-over');
      const indicator = $('catList').querySelector('.drop-indicator');
      if(!draggedId){ clearIndicator(); return; }
      const art = articles.find(a=>a.id===draggedId);
      if(!art){ clearIndicator(); return; }
      const catId = group.dataset.catgroup;
      art[axis.field] = (catId === '__none__') ? [] : [catId];
      // najdi, před/za kterým článkem indikátor skončil, a podle toho přeskládej pořadí v datech
      let beforeId = null, afterId = null;
      if(indicator){
        const nextLi = indicator.nextElementSibling;
        const prevLi = indicator.previousElementSibling;
        if(nextLi && nextLi.dataset.open) beforeId = nextLi.dataset.open;
        else if(prevLi && prevLi.dataset.open) afterId = prevLi.dataset.open;
      }
      const idx = articles.indexOf(art);
      if(idx !== -1) articles.splice(idx, 1);
      let insertAt = articles.length;
      if(beforeId){
        const i = articles.findIndex(a=>a.id===beforeId);
        if(i !== -1) insertAt = i;
      } else if(afterId){
        const i = articles.findIndex(a=>a.id===afterId);
        if(i !== -1) insertAt = i + 1;
      }
      articles.splice(insertAt, 0, art);
      saveArticles();
      draggedId = null;
      clearIndicator();
      renderCatList();
    });
  });

  // --- přejmenování kategorie ---
  $('catList').querySelectorAll('[data-cat-rename2]').forEach(inp=>{
    inp.onchange = ()=>{
      const cat = axis.cats.find(c=>c.id===inp.dataset.catRename2);
      if(cat){
        cat.label = inp.value.trim() || cat.label;
        inp.value = cat.label;
        saveEditableCats(axis.id);
      }
    };
  });

  // --- smazání kategorie ---
  $('catList').querySelectorAll('[data-cat-del2]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = '✓?'; return; }
      const id = b.dataset.catDel2;
      const idx = axis.cats.findIndex(c=>c.id===id);
      if(idx !== -1) axis.cats.splice(idx, 1);
      articles.forEach(a=>{ if(a[axis.field]) a[axis.field] = a[axis.field].filter(t=>t!==id); });
      roles.forEach(r=>{ r.allowedCats = r.allowedCats.filter(t=>t!==id); });
      saveEditableCats(axis.id);
      saveArticles();
      saveRoles();
      renderCatList();
    };
  });

  // --- nová kategorie ---
  const addBtn2 = $('addCatInline');
  if(addBtn2) addBtn2.onclick = ()=>{
    const input = $('newCatInline');
    const name = input.value.trim();
    if(!name) return;
    axis.cats.push({id:uid(), label:name});
    saveEditableCats(axis.id);
    renderCatList();
  };
}

/* ---------- obsah (rozcestník) u dlouhých článků ---------- */
function buildToc(body){
  const entries = [];
  const used = {};
  Array.from(body.children).forEach(el=>{
    let label = '', main = false;
    const tx = (el.textContent || '').trim();
    if(el.tagName === 'H3'){ label = tx; main = true; }
    else if(el.tagName === 'DIV'){
      const m = tx.match(/^(.{3,70}?)\s[–-]\s/);
      if(m){
        const base = m[1].replace(/\s*\(.*?\)\s*/g, ' ').trim();
        if(base === base.toUpperCase() && /[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]{3}/.test(base)){
          label = m[1];
          if(used[label]){ const c = tx.indexOf(':'); if(c > 0 && c < 60) label = tx.slice(0, c); }
        }
      }
    }
    if(label){ used[label] = true; entries.push({el: el, label: label, main: main}); }
  });
  if(entries.length < 5) return;
  // VELKÁ PÍSMENA → běžné psaní (DOUBLE ESPRESSO → Double espresso)
  const nice = t => (t === t.toUpperCase()) ? t.charAt(0) + t.slice(1).toLowerCase() : t;
  const groups = [];
  entries.forEach((e, i)=>{
    if(e.main || !groups.length) groups.push({head: e.main ? i : -1, items: []});
    if(!e.main) groups[groups.length - 1].items.push(i);
  });
  let html = '<summary>Obsah článku</summary>';
  groups.forEach(g=>{
    html += '<div class="toc-group">';
    if(g.head !== -1) html += '<div class="toc-group-title" data-toc="' + g.head + '">' + escapeHtml(entries[g.head].label) + '</div>';
    if(g.items.length) html += '<div class="toc-items">' + g.items.map(i=>
      '<span class="toc-item" data-toc="' + i + '">' + escapeHtml(nice(entries[i].label)) + '</span>'
    ).join('<span class="toc-sep">·</span>') + '</div>';
    html += '</div>';
  });
  const toc = document.createElement('details');
  toc.className = 'toc';
  if(!isMobile()) toc.open = true;
  toc.innerHTML = html;
  body.parentNode.insertBefore(toc, body);
  toc.querySelectorAll('[data-toc]').forEach(b=>{
    b.onclick = ()=>{ entries[parseInt(b.dataset.toc, 10)].el.scrollIntoView({behavior:'smooth', block:'start'}); };
  });
}

/* ---------- předchozí / další článek v kategorii ---------- */
let navCatId = null;   // kategorie, ze které čtenář článek otevřel (článek může být ve více kategoriích)
function categorySiblings(art){
  const isEditor = MODE === 'editor';
  const role = isEditor ? null : currentRole();
  const axes = SECTION_AXES[art.section] || [];
  const axisOrder = axes.slice().sort((x, y)=> (x.id === axisId ? -1 : 0) - (y.id === axisId ? -1 : 0));
  const vis = a => a.section === art.section && (isEditor || (role && articleVisibleToRole(a, role)));
  for(const ax of axisOrder){
    if(!ax.cats.some(c=>(art[ax.field] || []).indexOf(c.id) !== -1)) continue;
    // celé pořadí sekce: kategorie za sebou, v každé její články
    const seq = [];
    ax.cats.forEach(c=>{
      articles.filter(a=>vis(a) && (a[ax.field] || []).indexOf(c.id) !== -1).forEach(a=>seq.push({a: a, cat: c}));
    });
    let i = seq.findIndex(p=>p.a.id === art.id && p.cat.id === navCatId);
    if(i === -1) i = seq.findIndex(p=>p.a.id === art.id);
    if(i === -1) continue;
    const cat = seq[i].cat;
    const list = seq.filter(p=>p.cat.id === cat.id).map(p=>p.a);
    return {cat: cat, list: list, idx: list.findIndex(a=>a.id === art.id), prev: seq[i - 1] || null, next: seq[i + 1] || null};
  }
  return null;
}
function prevNextHtml(art){
  const sib = categorySiblings(art);
  if(!sib || (!sib.prev && !sib.next)) return '';
  const lbl = (p, dir)=> dir + (p.cat.id !== sib.cat.id ? ' · ' + escapeHtml(p.cat.label) : '');
  return '<div class="pn-nav">' +
    (sib.prev ? '<button class="pn-btn" data-pn="' + sib.prev.a.id + '" data-pn-cat="' + sib.prev.cat.id + '"><span class="pn-dir">' + lbl(sib.prev, '← Předchozí') + '</span><span class="pn-title">' + escapeHtml(sib.prev.a.title) + '</span></button>' : '') +
    (sib.next ? '<button class="pn-btn next" data-pn="' + sib.next.a.id + '" data-pn-cat="' + sib.next.cat.id + '"><span class="pn-dir">' + lbl(sib.next, 'Další →') + '</span><span class="pn-title">' + escapeHtml(sib.next.a.title) + '</span></button>' : '') +
    '</div><div class="pn-pos">' + escapeHtml(sib.cat.label) + ' · ' + (sib.idx + 1) + ' z ' + sib.list.length + '</div>';
}

/* ---------- odškrtávací postup (stav jen v tomto zařízení, každý den znovu) ---------- */
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function buildChecklist(art, body){
  const items = [];
  Array.from(body.children).forEach(el=>{
    if(el.tagName === 'UL' || el.tagName === 'OL'){ Array.from(el.children).forEach(li=>items.push(li)); return; }
    if(el.tagName !== 'DIV' || el.classList.contains('video-block') || el.classList.contains('kb-video')) return;
    const tx = (el.textContent || '').trim();
    if(!tx) return;
    if(tx.length < 40 && tx === tx.toUpperCase()) return;   // krátký nadpis velkými písmeny (RÁNO, VEČER…)
    items.push(el);
  });
  if(!items.length) return;
  const key = 'kb-check-' + art.id;
  let state = loadJSON(key);
  if(!state || state.day !== todayKey()) state = {day: todayKey(), done: []};
  const head = document.createElement('div');
  head.className = 'chk-head';
  body.parentNode.insertBefore(head, body);
  const done = document.createElement('div');
  done.className = 'chk-all';
  done.textContent = '✓ Hotovo – všechny kroky jsou odškrtnuté.';
  body.parentNode.insertBefore(done, body.nextSibling);
  const update = ()=>{
    const n = state.done.length;
    head.innerHTML = '<span class="chk-count">Odškrtnuto ' + n + ' z ' + items.length + '</span>' +
      '<span class="chk-bar"><span style="width:' + Math.round(n / items.length * 100) + '%"></span></span>' +
      (n ? '<button class="chk-reset" id="chkReset">Začít znovu</button>' : '') +
      '<span class="chk-note">Kliknutím na krok ho odškrtneš. Ukládá se jen v tomto zařízení a zítra se seznam sám vynuluje.</span>';
    done.hidden = n !== items.length;
    const r = head.querySelector('#chkReset');
    if(r) r.onclick = ()=>{ state.done = []; saveJSON(key, state); items.forEach(i=>i.classList.remove('done')); update(); };
  };
  items.forEach((el, i)=>{
    el.classList.add('chk-item');
    if(state.done.indexOf(i) !== -1) el.classList.add('done');
    el.addEventListener('click', e=>{
      if(e.target.closest('a, img, .video-thumb, iframe, video')) return;
      const at = state.done.indexOf(i);
      if(at === -1) state.done.push(i); else state.done.splice(at, 1);
      el.classList.toggle('done', at === -1);
      saveJSON(key, state);
      update();
    });
  });
  update();
}

// Malá písmena bez háčků a čárek: „Čištění“ → „cisteni“
function fold(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function plainText(html){
  const d = document.createElement('div');
  d.innerHTML = String(html || '').replace(/<img[^>]*>/g, ' ').replace(/<\/(div|h3|li|p)>/g, ' ');
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
function searchSnippet(a, q){
  const t = plainText(a.body);
  const i = fold(t).indexOf(q);
  if(i === -1) return '';
  const from = Math.max(0, i - 40), to = Math.min(t.length, i + q.length + 60);
  return '<span class="search-snippet">' + (from > 0 ? '…' : '') + escapeHtml(t.slice(from, i)) +
    '<mark>' + escapeHtml(t.slice(i, i + q.length)) + '</mark>' + escapeHtml(t.slice(i + q.length, to)) + (to < t.length ? '…' : '') + '</span>';
}

function fmtSize(b){
  b = b || 0;
  return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' kB' : (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
}
function safeFileName(n){

  ).join('') + '</div>';

function inlineFormat(escapedText){
  return escapedText.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

// JEDNORÁZOVÁ MIGRACE
function legacyContentToHtml(art){
  const lines = (art.content || '').split('\n');
  const out = [];
  let i = 0;
  while(i < lines.length){
    const raw = lines[i];
    const trimmed = raw.trim();

    const imgMatch = trimmed.match(/^\{img:(\d+)\}$/);
    if(imgMatch){
      const src = (art.images || [])[parseInt(imgMatch[1], 10)];
      if(src) out.push('<img src="' + src + '" alt="">');
      i++; continue;
    }
    if(trimmed === '{video}'){ i++; continue; }
    if(trimmed.indexOf('## ') === 0){
      out.push('<h3>' + inlineFormat(escapeHtml(trimmed.slice(3))) + '</h3>');
      i++; continue;
    }
    if(trimmed.indexOf('- ') === 0){
      const items = [];
      while(i < lines.length && lines[i].trim().indexOf('- ') === 0){
        items.push('<li>' + inlineFormat(escapeHtml(lines[i].trim().slice(2))) + '</li>');
        i++;
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    if(trimmed === ''){ out.push('<br>'); i++; continue; }
    out.push('<div>' + inlineFormat(escapeHtml(raw)) + '</div>');
    i++;
  }
  const referenced = referencedImageIndexes(art.content);
  (art.images || []).forEach((src, idx)=>{ if(referenced.indexOf(idx) === -1) out.push('<img src="' + src + '" alt="">'); });
  return out.join('');
}

function referencedImageIndexes(content){
  const idx = [];
  const re = /\{img:(\d+)\}/g;
  let m;
  while((m = re.exec(content || '')) !== null) idx.push(parseInt(m[1], 10));
  return idx;
}

        }).join('') +
