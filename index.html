      (BRANCHES.length ? '<select class="fmt-sel" id="fmtBranch" title="Označený odstavec jen pro jednu pobočku"><option value="">🏪 Jen pro pobočku…</option>' +
        BRANCHES.map(b=>'<option value="' + b.id + '">' + escapeHtml(b.name) + '</option>').join('') +
        '<option value="__off">✕ Zrušit blok pobočky</option></select>' : '') +
    '</div>' +
    '<input type="file" id="bodyImgInput" accept="image/*" style="display:none;">' +
    '<div class="art-body rich-editor" id="f-body" contenteditable="true">' + (art.body || '') + '</div>' +
    '<div class="art-body edit-preview" id="f-preview" hidden></div>' +
    '<label class="tag-check" style="margin-top:14px"><input type="checkbox" id="f-checklist"' + (art.checklist ? ' checked' : '') + '> ☑ Odškrtávací postup – zaměstnanec si během směny odškrtává jednotlivé kroky (odstavce a odrážky)</label>' +
    '<div class="field-label">Přílohy (PDF, Excel)</div>' +
    '<div class="field-hint">Soubor se hned nahraje na GitHub do složky files/ (nejvýš 20 MB). Pozor: repozitář je veřejný – kdo zná odkaz, soubor si stáhne. Nedávej sem citlivé dokumenty.</div>' +
    '<div id="attEdit"></div>' +
    '<input type="file" id="attInput" accept=".pdf,.xls,.xlsx,.csv" style="display:none;">' +
    '<button type="button" class="btn ghost" id="attAddBtn" style="margin-top:6px">📎 Přidat přílohu</button>' +
    '<div class="status" id="attStatus" style="margin-top:6px"></div>' +
    (BRANCHES.length ? '<div class="field-label">Pobočky</div><div class="field-hint">Pro které pobočky článek platí. Když nic nezaškrtneš, platí pro všechny.</div><div class="tag-box">' +
      BRANCHES.map(b=>'<label class="tag-check"><input type="checkbox" data-art-branch value="' + b.id + '"' + ((art.branches || []).indexOf(b.id) !== -1 ? ' checked' : '') + '> ' + escapeHtml(b.name) + '</label>').join('') + '</div>' : '') +
    '<div class="field-label">Související články</div>' +
    '<div class="field-hint">Zaškrtni články, které se čtenáři nabídnou jako „Souvisí s“ dole u tohoto článku.</div>' +
    relatedBoxHtml(art) +
    '<div class="field-hint" style="margin-top:10px">Aby čtenáři návod viděli, musí být přetažený aspoň do jedné kategorie povolené u své role (viz „Spravovat role“).</div>' +
    '<div class="row"><button class="btn" id="saveBtn">Uložit</button><button class="btn ghost" id="cancelBtn">Zrušit</button></div>';
}

function relatedBoxHtml(art){
  const others = articles.filter(a=>a.id !== art.id);
  if(!others.length) return '<div class="field-hint">Zatím nejsou žádné jiné články.</div>';
  return '<div class="tag-box">' + others.map(a=>
    '<label class="tag-check"><input type="checkbox" data-related value="' + a.id + '"' +
    ((art.related||[]).indexOf(a.id)!==-1 ? ' checked' : '') + '> ' + escapeHtml(a.title) + '</label>'
  ).join('') + '</div>';
}

function bindEditForm(art){
  if(!art.images) art.images = [];

  const bodyEl = $('f-body');

  // tlačítka lišty nesmí brát editoru kurzor ani výběr
  document.querySelectorAll('.fmt-toolbar .fmt-btn').forEach(b=>{
    b.addEventListener('mousedown', e=>e.preventDefault());
  });

  function selectionInside(tag){
    const sel = window.getSelection();
    if(!sel.rangeCount || !bodyEl.contains(sel.anchorNode)) return false;
    let node = sel.anchorNode;
    while(node && node !== bodyEl){
      if(node.nodeName === tag) return true;
      node = node.parentNode;
    }
    return false;
  }
  function updateFmtButtons(){
    if(!document.body.contains(bodyEl)){
      document.removeEventListener('selectionchange', updateFmtButtons);
      return;
    }
    const sel = window.getSelection();
    const inside = sel.rangeCount && bodyEl.contains(sel.anchorNode);
    $('fmtBold').classList.toggle('active', !!inside && document.queryCommandState('bold'));
    $('fmtHeading').classList.toggle('active', !!inside && selectionInside('H3'));
    $('fmtBullet').classList.toggle('active', !!inside && selectionInside('UL'));
  }
  document.addEventListener('selectionchange', updateFmtButtons);

  const fmtBold = $('fmtBold');
  if(fmtBold) fmtBold.onclick = ()=>{ bodyEl.focus(); document.execCommand('bold'); updateFmtButtons(); };
  const fmtHeading = $('fmtHeading');
  if(fmtHeading) fmtHeading.onclick = ()=>{
    bodyEl.focus();
    document.execCommand('formatBlock', false, selectionInside('H3') ? 'DIV' : 'H3');
    updateFmtButtons();
  };
  const fmtBullet = $('fmtBullet');
  if(fmtBullet) fmtBullet.onclick = ()=>{ bodyEl.focus(); document.execCommand('insertUnorderedList'); updateFmtButtons(); };

  let savedRange = null;
  function saveRange(){
    const sel = window.getSelection();
    if(sel.rangeCount && bodyEl.contains(sel.anchorNode)) savedRange = sel.getRangeAt(0);
  }
  bodyEl.addEventListener('mouseup', saveRange);
  bodyEl.addEventListener('keyup', saveRange);
  function restoreRange(){
    if(!savedRange) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }

  const fmtClear = $('fmtClear');
  if(fmtClear) fmtClear.onclick = ()=>{
    bodyEl.focus();
    if(selectionInside('UL')) document.execCommand('insertUnorderedList');
    document.execCommand('removeFormat');
    document.execCommand('formatBlock', false, 'DIV');
    updateFmtButtons();
  };

  function removeImgOverlay(){
    const existing = bodyEl.querySelector('.img-del-overlay');
    if(existing) existing.remove();
  }
  bodyEl.addEventListener('click', e=>{
    const vid = e.target.closest ? e.target.closest('.kb-video') : null;
    if(e.target.tagName === 'IMG' || vid){
      removeImgOverlay();
      const img = vid || e.target;
      const overlay = document.createElement('button');
      overlay.type = 'button';
      overlay.className = 'img-del-overlay';
      overlay.setAttribute('contenteditable', 'false');
      overlay.textContent = vid ? '× Smazat toto video' : '× Smazat tento obrázek';
      overlay.onclick = (ev)=>{ ev.stopPropagation(); img.remove(); overlay.remove(); };
      img.insertAdjacentElement('afterend', overlay);
    } else {
      removeImgOverlay();
    }
  });

  const fmtVideo = $('fmtVideo');
  if(fmtVideo) fmtVideo.onclick = ()=>{
    saveRange();
    const url = (prompt('Vlož odkaz na video (YouTube nebo Dropbox):') || '').trim();
    if(!url) return;
    bodyEl.focus();
    restoreRange();
    document.execCommand('insertHTML', false,
      '<div class="kb-video" contenteditable="false" data-url="' + escapeHtml(url) + '">🎬 Video: ' + escapeHtml(url) + '</div><div><br></div>');
  };

  const fmtImg = $('fmtImg');
  const bodyImgInput = $('bodyImgInput');
  if(fmtImg) fmtImg.onclick = ()=>{ saveRange(); bodyImgInput.click(); };
  if(bodyImgInput){
    bodyImgInput.addEventListener('change', async ()=>{
      const file = bodyImgInput.files && bodyImgInput.files[0];
      bodyImgInput.value = '';
      if(!file) return;
      try{
        const dataUrl = await resizeImage(file, 900, 0.72);
        bodyEl.focus();
        restoreRange();
        document.execCommand('insertImage', false, dataUrl);
      }catch(e){}
    });
  }

  bodyEl.addEventListener('paste', async (e)=>{
    const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
    const imgItem = items.find(it=>it.type && it.type.indexOf('image/') === 0);
    if(imgItem){
      e.preventDefault();
      const file = imgItem.getAsFile();
      if(!file) return;
      try{
        const dataUrl = await resizeImage(file, 900, 0.72);
        document.execCommand('insertImage', false, dataUrl);
      }catch(err){}
      return;
    }
    e.preventDefault();
    const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
    document.execCommand('insertText', false, text);
  });

  // --- odkaz na jiný článek ---
  const fmtLink = $('fmtLink');
  fmtLink.addEventListener('mousedown', saveRange);
  fmtLink.onchange = ()=>{
    const v = fmtLink.value;
    fmtLink.value = '';
    if(!v) return;
    bodyEl.focus();
    restoreRange();
    const sel = window.getSelection();
    const r = (sel.rangeCount && bodyEl.contains(sel.anchorNode)) ? sel.getRangeAt(0) : null;
    if(v === '__off'){
      let n = r ? r.startContainer : null;
      while(n && n !== bodyEl && !(n.tagName === 'A' && n.classList.contains('kb-link'))) n = n.parentNode;
      if(n && n !== bodyEl) n.replaceWith(...Array.from(n.childNodes));
      return;
    }
    const target = articles.find(a=>a.id === v);
    if(!target) return;
    const a = document.createElement('a');
    a.className = 'kb-link';
    a.setAttribute('data-art', v);
    a.setAttribute('href', '#' + v);
    if(r && !r.collapsed){
      a.textContent = r.toString();
      r.deleteContents();
      r.insertNode(a);
    } else {
      a.textContent = target.title;
      if(r) r.insertNode(a); else bodyEl.appendChild(a);
    }
    sel.removeAllRanges();
    const after = document.createRange();
    after.setStartAfter(a);
    after.collapse(true);
    sel.addRange(after);
  };
  // klik na odkaz v editoru nikam nevede (aby šel upravit)
  bodyEl.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('a.kb-link')) e.preventDefault(); });

  // --- Upravit / Náhled ---
  function showPreview(on){
    $('tabEdit').classList.toggle('on', !on);
    $('tabPrev').classList.toggle('on', on);
    document.querySelector('.fmt-toolbar').style.display = on ? 'none' : '';
    bodyEl.hidden = on;
    const pv = $('f-preview');
    pv.hidden = !on;
    if(!on){ pv.innerHTML = ''; return; }
    const clone = bodyEl.cloneNode(true);
    clone.querySelectorAll('.img-del-overlay').forEach(x=>x.remove());
    pv.innerHTML = '<div class="art-title">' + escapeHtml($('f-title').value || 'Bez názvu') + '</div>' + clone.innerHTML.replace(/ data-label="[^"]*"/g, '');
    processBranchBlocks(pv, false);
    bindArticleLinks(pv, null, true, true);
    bindInlineVideos(pv);
    bindLightbox(pv);
  }
  $('tabEdit').onclick = ()=>showPreview(false);
  $('tabPrev').onclick = ()=>showPreview(true);

  // --- blok textu jen pro pobočku ---
  bodyEl.querySelectorAll('.br-only').forEach(el=>{ el.setAttribute('data-label', 'Jen pobočka ' + (branchName(el.getAttribute('data-branch')) || '?')); });
  const fmtBranch = $('fmtBranch');
  if(fmtBranch){
    fmtBranch.addEventListener('mousedown', saveRange);
    fmtBranch.onchange = ()=>{
      const v = fmtBranch.value;
      fmtBranch.value = '';
      if(!v) return;
      bodyEl.focus();
      restoreRange();
      const sel = window.getSelection();
      const r = (sel.rangeCount && bodyEl.contains(sel.anchorNode)) ? sel.getRangeAt(0) : null;
      const topOf = n=>{
        if(!n || n === bodyEl || !bodyEl.contains(n)) return null;
        while(n.parentNode !== bodyEl) n = n.parentNode;
        return n;
      };
      if(v === '__off'){
        let n = r ? r.startContainer : null;
        while(n && n !== bodyEl && !(n.classList && n.classList.contains('br-only'))) n = n.parentNode;
        if(n && n !== bodyEl) n.replaceWith(...Array.from(n.childNodes));
        return;
      }
      const box = document.createElement('div');
      box.className = 'br-only';
      box.setAttribute('data-branch', v);
      box.setAttribute('data-label', 'Jen pobočka ' + branchName(v));
      const st = r ? topOf(r.startContainer === bodyEl ? bodyEl.childNodes[r.startOffset] : r.startContainer) : null;
      const en = r ? topOf(r.endContainer === bodyEl ? bodyEl.childNodes[Math.max(0, r.endOffset - 1)] : r.endContainer) : null;
      if(r && !r.collapsed && st && en){
        bodyEl.insertBefore(box, st);
        let n = st;
        while(n){ const next = n.nextSibling; box.appendChild(n); if(n === en) break; n = next; }
      } else {
        box.innerHTML = '<div>Text jen pro pobočku ' + escapeHtml(branchName(v)) + '…</div>';
        if(st && st.nextSibling) bodyEl.insertBefore(box, st.nextSibling); else bodyEl.appendChild(box);
      }
    };
  }

  // --- přílohy: nahrají se hned na GitHub do files/ ---
  let formFiles = (art.files || []).map(f=>Object.assign({}, f));
  function renderAttEdit(){
    $('attEdit').innerHTML = formFiles.map((f, i)=>
      '<div class="att-edit">' + fileIcon(f.name) + ' <span style="flex:1;min-width:0;overflow-wrap:anywhere">' + escapeHtml(f.name) +
      ' <small style="color:var(--cocoa-soft)">' + fmtSize(f.size) + '</small></span><button type="button" class="btn ghost" data-att-del="' + i + '" title="Odebrat přílohu">✕</button></div>'
    ).join('');
    $('attEdit').querySelectorAll('[data-att-del]').forEach(b=>{ b.onclick = ()=>{ formFiles.splice(+b.dataset.attDel, 1); renderAttEdit(); }; });
  }
  renderAttEdit();
  $('attAddBtn').onclick = ()=>$('attInput').click();
  $('attInput').onchange = async ()=>{
    const file = $('attInput').files[0];
    $('attInput').value = '';
    if(!file) return;
    if(!/\.(pdf|xlsx?|csv)$/i.test(file.name)){ $('attStatus').textContent = 'Jde nahrát jen PDF nebo Excel (xls, xlsx, csv).'; return; }
    if(file.size > 20 * 1024 * 1024){ $('attStatus').textContent = 'Soubor je větší než 20 MB.'; return; }
    let token = null;
    try{ token = localStorage.getItem('kb-gh-token'); }catch(e){}
    if(!token){ $('attStatus').textContent = 'Pro nahrání přílohy je potřeba GitHub token.'; return; }
    $('attStatus').textContent = 'Nahrávám ' + file.name + '…';
    $('attAddBtn').disabled = true;
    try{
      const b64 = await new Promise((res, rej)=>{
        const fr = new FileReader();
        fr.onerror = ()=>rej(new Error('read'));
        fr.onload = ()=>res(String(fr.result).split(',')[1] || '');
        fr.readAsDataURL(file);
      });
      const path = 'files/' + (await hashText(b64)) + '-' + safeFileName(file.name);
      const res = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + path, {
        method: 'PUT',
        headers: {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'},
        body: JSON.stringify({message: 'Příloha ' + file.name, content: b64, branch: 'main'})
      });
      if(res.status === 401 || res.status === 403) throw new Error('auth');
      if(!res.ok && res.status !== 422) throw new Error('put');   // 422 = stejný soubor už na GitHubu je
      formFiles.push({name: file.name, path: path, size: file.size});
      renderAttEdit();
      $('attStatus').textContent = 'Nahráno. Ulož článek a publikuj – na webu bude soubor ke stažení do pár minut.';
    }catch(e){
      $('attStatus').textContent = e.message === 'auth' ? 'Nahrání selhalo: neplatný token nebo chybí oprávnění.' : 'Nahrání selhalo (síť nebo GitHub). Zkus to znovu.';
    }
    $('attAddBtn').disabled = false;
  };

  editSnapshot = editFormState();

  $('saveBtn').onclick = ()=>{
    removeImgOverlay();
    art.title = $('f-title').value.trim() || 'Bez názvu';
    art.section = $('f-section').value;
    art.body = $('f-body').innerHTML.replace(/ data-label="[^"]*"/g, '');
    art.checklist = $('f-checklist').checked;
    art.files = formFiles;
    art.branches = Array.from(document.querySelectorAll('[data-art-branch]:checked')).map(el=>el.value);
    art.related = Array.from(document.querySelectorAll('[data-related]:checked')).map(el=>el.value);
    art.updatedAt = new Date().toISOString();
    if(art.isNew){ delete art.isNew; articles.push(art); }
    const ok = saveArticles();
    if(ok){
      activeId = art.id;
      sectionId = art.section;
      axisId = currentAxes()[0].id;
      editing = false;
      videoOpen = false;
      render();
      scrollToMainOnMobile();
    }
  };
  $('cancelBtn').onclick = ()=>{
    editing = false;
    if(art.isNew) activeId = null;
    render();
  };
}

/* ---------- role (jen editor) ---------- */
function roleCatBoxHtml(cats, selected){
  return '<div class="tag-box">' + cats.map(c=>
    '<label class="tag-check"><input type="checkbox" data-role-cat value="' + c.id + '"' +
    ((selected||[]).indexOf(c.id)!==-1 ? ' checked' : '') + '> ' + escapeHtml(c.label) + '</label>'
  ).join('') + '</div>';
}

function roleEditHtml(role){
  return '<div class="field-label">Název role</div>' +
    '<input class="f-title" id="r-name" value="' + escapeHtml(role.label||'') + '">' +
    '<div class="field-hint">Nová role zatím nevidí žádnou kategorii – zaškrtni tady, co jí zpřístupníš.</div>' +
    BASE_SECTIONS.filter(b=>sectionExists(b.id)).map(b=>{
      const name = SECTIONS.find(x=>x.id === b.id).label;
      const axes = SECTION_AXES[b.id];
      return axes.map(ax=>'<div class="field-label">' + escapeHtml(name + (axes.length > 1 ? ' – ' + ax.label.toLowerCase() : '')) + '</div>' +
        roleCatBoxHtml(ax.cats, role.allowedCats)).join('');
    }).join('') +
    CUSTOM_SECTIONS.map(cs=>'<div class="field-label">' + escapeHtml(cs.label) + '</div>' +
      (cs.cats.length ? roleCatBoxHtml(cs.cats, role.allowedCats) : '<div class="field-hint">Sekce zatím nemá kategorie.</div>')).join('') +
    '<div class="row"><button class="btn" id="saveRoleBtn">Uložit</button><button class="btn ghost" id="cancelRoleBtn">Zrušit</button></div>';
}

function bindRoleEditForm(role){
  $('saveRoleBtn').onclick = ()=>{
    role.label = $('r-name').value.trim() || 'Bez názvu';
    role.allowedCats = Array.from(document.querySelectorAll('[data-role-cat]:checked')).map(el=>el.value);
    const idx = roles.findIndex(r=>r.id===role.id);
    if(idx !== -1) roles[idx] = role;
    saveRoles();
    editingRoleId = null;
    render();
  };
  $('cancelRoleBtn').onclick = ()=>{ editingRoleId = null; render(); };
}

function renderRolesMain(){
  if(editingRoleId){
    const role = roles.find(r=>r.id===editingRoleId);
    if(!role){ editingRoleId = null; }
    else{
      $('main').innerHTML = roleEditHtml(role);
      bindRoleEditForm(role);
      return;
    }
  }
  let html = '<div class="art-title">Role</div>' +
    '<div class="field-hint">Role určuje, které návody čtenář uvidí: článek se mu ukáže, když má role povolenou aspoň jednu z jeho kategorií. Pak ho vidí v obou pohledech (podle postupu i podle manuálu) – pohled mění jen řazení. Nová role zatím nevidí nic.</div>' +
    '<div class="row"><input class="f-title" id="newRoleName" placeholder="Název nové role (např. Plac, Kuchyně, Vedoucí)" style="flex:1;font-size:14px;font-weight:400;font-family:inherit;"><button class="btn" id="addRoleBtn">Přidat roli</button></div>';
  if(roles.length){
    html += roles.map(r=>
      '<div class="role-row"><span>' + escapeHtml(r.label) + ' <span class="tag-chip">' + r.allowedCats.length + ' kategorií</span></span>' +
      '<span><button class="btn ghost" data-edit-role="' + r.id + '">Upravit</button> <button class="btn red" data-del-role="' + r.id + '">Smazat</button></span></div>'
    ).join('');
  } else {
    html += '<div class="status" style="margin-top:14px">Zatím žádné role.</div>';
  }
  html += '<div class="row"><button class="btn ghost" id="backToArticles">Zpět na návody</button></div>';
  $('main').innerHTML = html;
  $('addRoleBtn').onclick = ()=>{
    const name = $('newRoleName').value.trim();
    if(!name) return;
    const r = {id:uid(), label:name, allowedCats:[]};
    roles.push(r);
    saveRoles();
    editingRoleId = r.id;
    render();
  };
  document.querySelectorAll('[data-edit-role]').forEach(b=>{
    b.onclick = ()=>{ editingRoleId = b.dataset.editRole; render(); };
  });
  document.querySelectorAll('[data-del-role]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.armed !== '1'){ b.dataset.armed = '1'; b.textContent = 'Opravdu?'; return; }
      const delId = b.dataset.delRole;
      roles = roles.filter(r=>r.id !== delId);
      saveRoles();
      if(readerRoleId === delId){
        readerRoleId = null;
        try{ localStorage.removeItem('kb-reader-role'); }catch(e){}
      }
      render();
    };
  });
  $('backToArticles').onclick = ()=>{ view = 'article'; render(); };
}

/* ---------- pobočky (jen editor) ---------- */
let branchMenuOpen = false;
function renderBranch(){
  const w = $('branchWrap');
  if(!BRANCHES.length){ w.innerHTML = ''; return; }
  if(branchId && !BRANCHES.some(b=>b.id === branchId)) branchId = '';
  let h = '<button class="branch-btn" id="branchBtn"><span style="font-size:18px">🏪</span><span style="flex:1;min-width:0"><span class="bl">Pobočka</span><b>' +
    escapeHtml(branchId ? branchName(branchId) : 'Všechny pobočky') + '</b></span><span>▾</span></button>';
  if(branchMenuOpen){
    h += '<div class="branch-menu">' + BRANCHES.map(b=>'<button class="branch-opt' + (b.id === branchId ? ' on' : '') + '" data-branch-pick="' + b.id + '">' + escapeHtml(b.name) + '</button>').join('') +
      '<button class="branch-opt' + (!branchId ? ' on' : '') + '" data-branch-pick="">Všechny pobočky</button></div>';
  }
  w.innerHTML = h;
  $('branchBtn').onclick = ()=>{ branchMenuOpen = !branchMenuOpen; renderBranch(); };
  w.querySelectorAll('[data-branch-pick]').forEach(b=>{
    b.onclick = ()=>{
      if(!canLeaveEdit()) return;
      branchId = b.dataset.branchPick;
      branchMenuOpen = false;
      try{ localStorage.setItem('kb-branch', branchId); }catch(e){}
      editing = false;
      render();
    };
  });
}
function renderBranchesMain(){
  let html = '<div class="art-title">Pobočky</div>' +
    '<div class="field-hint">Pobočky pro přepínač nahoře v panelu (zobrazí se, až bude aspoň jedna). U článku pak zaškrtneš, pro které pobočky platí, a v textu můžeš označit odstavce „Jen pro pobočku“.</div>' +
    BRANCHES.map(b=>'<div class="role-row"><input class="f-title" data-br-name="' + b.id + '" value="' + escapeHtml(b.name) + '" style="flex:1;font-size:14px;font-family:inherit;padding:6px 8px">' +
      '<button class="btn red" data-br-del="' + b.id + '">Smazat</button></div>').join('') +
    '<div class="row"><input class="f-title" id="newBranchName" placeholder="Název pobočky (např. Praha – Vinohrady)" style="flex:1;font-size:14px;font-weight:400;font-family:inherit;"><button class="btn" id="addBranchBtn">Přidat pobočku</button></div>' +
    '<div class="row"><button class="btn ghost" id="backFromBranches">Zpět na návody</button></div>';
  $('main').innerHTML = html;
  $('main').querySelectorAll('[data-br-name]').forEach(inp=>{
    inp.onchange = ()=>{
      const b = BRANCHES.find(x=>x.id === inp.dataset.brName);
      if(!b) return;
      b.name = inp.value.trim() || b.name;
      inp.value = b.name;
      saveBranches();
      renderBranch();
    };
  });
  $('main').querySelectorAll('[data-br-del]').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.armed !== '1'){ btn.dataset.armed = '1'; btn.textContent = 'Opravdu?'; return; }
      const id = btn.dataset.brDel;
      BRANCHES = BRANCHES.filter(x=>x.id !== id);
      articles.forEach(a=>{ if(a.branches) a.branches = a.branches.filter(x=>x !== id); });
      saveArticles();
      saveBranches();
      if(branchId === id){ branchId = ''; try{ localStorage.setItem('kb-branch', ''); }catch(e){} }
      render();
    };
  });
  $('addBranchBtn').onclick = ()=>{
    const name = $('newBranchName').value.trim();
    if(!name) return;
    BRANCHES.push({id: 'b' + Date.now().toString(36), name: name});
    saveBranches();
    render();
  };
  $('backFromBranches').onclick = ()=>{ view = 'home'; render(); };
}

/* ---------- historie článku (z publikací na GitHubu) ---------- */
function parseDataJs(text){
  try{ return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1)); }catch(e){}
  try{ return new Function(text + ';return INITIAL_DATA;')(); }catch(e){}
  return null;
}
function articleSnapshot(a){
  if(!a) return null;
  return {
    title: a.title || '',
    body: a.body != null ? a.body : legacyContentToHtml(a),
    section: a.section || 'sop',
    tags: [].concat(a.postupTags || [], a.manualTags || [], a.wikiTags || [], a.troubleshootTags || [], a.customTags || []).join(','),
    videoUrl: a.videoUrl || '',
    related: (a.related || []).join(','),
    files: (a.files || []).map(f=>f.name).join(','),
    branches: (a.branches || []).join(',')
  };
}
function snapshotChanges(prev, cur){
  if(!prev && cur) return ['vytvořen'];
  if(prev && !cur) return ['smazán'];
  const ch = [];
  if(prev.title !== cur.title) ch.push('název');
  if(prev.body !== cur.body) ch.push('text');
  if(prev.section !== cur.section) ch.push('sekce');
  if(prev.tags !== cur.tags) ch.push('kategorie');
  if(prev.videoUrl !== cur.videoUrl) ch.push('video');
  if(prev.related !== cur.related) ch.push('související');
  if((prev.files || '') !== (cur.files || '')) ch.push('přílohy');
  if((prev.branches || '') !== (cur.branches || '')) ch.push('pobočky');
  return ch;
}
async function fetchCommits(path){
  const url = 'https://api.github.com/repos/' + GH_REPO + '/commits?path=' + path + '&per_page=30';
  let token = null;
  try{ token = localStorage.getItem('kb-gh-token'); }catch(e){}
  let res = token ? await fetch(url, {headers:{'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + token}, cache:'no-store'}) : null;
  if(!res || !res.ok) res = await fetch(url, {headers:{'Accept':'application/vnd.github+json'}, cache:'no-store'});
  if(!res.ok) throw new Error('commits');
  return await res.json();
}
async function fetchVersion(sha, path){
  const raw = await fetch('https://raw.githubusercontent.com/' + GH_REPO + '/' + sha + '/' + path);
  if(!raw.ok) return null;
  return parseDataJs(await raw.text());
}

/* ---------- celková historie změn (log) ---------- */
let logData = null;   // {loading, progress, error, entries:[{date, who, lines:[], arts:[{id,title,snap}]}], openKey}
function catMapOf(data){
  const m = {};
  ['postupCats','manualCats','wikiCats','troubleshootCats'].forEach(k=>(data[k] || []).forEach(c=>{ m[c.id] = c.label; }));
  (data.customSections || []).forEach(cs=>(cs.cats || []).forEach(c=>{ m[c.id] = c.label; }));
  return m;
}
function sectionNamesOf(data){
  const base = {sop:'📋 Postupy (SOP)', wiki:'🏢 Firemní wiki', troubleshooting:'🆘 Troubleshooting'};
  const bs = data.baseSections || {renamed:{}, deleted:[]};
  const m = {};
  Object.keys(base).forEach(k=>{ if((bs.deleted || []).indexOf(k) === -1) m[k] = (bs.renamed || {})[k] || base[k]; });
  (data.customSections || []).forEach(cs=>{ m[cs.id] = cs.label; });
  return m;
}
function diffKbData(prev, cur){
  const lines = [], arts = [];
  const P = {}, C = {};
  (prev.seedAll || []).forEach(a=>{ P[a.id] = a; });
  (cur.seedAll || []).forEach(a=>{ C[a.id] = a; });
  const added = [], removed = [], changed = [];
  Object.keys(C).forEach(id=>{
    if(!P[id]){ added.push(C[id]); return; }
    const ch = snapshotChanges(articleSnapshot(P[id]), articleSnapshot(C[id]));
    if(ch.length) changed.push({a: C[id], ch: ch});
  });
  Object.keys(P).forEach(id=>{ if(!C[id]) removed.push(P[id]); });
  if(added.length) lines.push({label:'Přidáno', items: added.map(a=>({id:a.id, text:a.title}))});
  if(changed.length) lines.push({label:'Upraveno', items: changed.map(x=>({id:x.a.id, text:x.a.title + ' (' + x.ch.join(', ') + ')'}))});
  if(removed.length) lines.push({label:'Smazáno', items: removed.map(a=>({text:a.title}))});
  added.concat(changed.map(x=>x.a)).forEach(a=>arts.push({id:a.id, title:a.title, snap:articleSnapshot(a)}));
  // kategorie
  const pc = catMapOf(prev), cc = catMapOf(cur), catLines = [];
  Object.keys(cc).forEach(id=>{ if(!(id in pc)) catLines.push('nová „' + cc[id] + '“'); else if(pc[id] !== cc[id]) catLines.push('„' + pc[id] + '“ → „' + cc[id] + '“'); });
  Object.keys(pc).forEach(id=>{ if(!(id in cc)) catLines.push('smazaná „' + pc[id] + '“'); });
  if(catLines.length) lines.push({label:'Kategorie', items: catLines.map(t=>({text:t}))});
  // sekce
  const ps = sectionNamesOf(prev), csn = sectionNamesOf(cur), secLines = [];
  Object.keys(csn).forEach(id=>{ if(!(id in ps)) secLines.push('nová ' + csn[id]); else if(ps[id] !== csn[id]) secLines.push(ps[id] + ' → ' + csn[id]); });
  Object.keys(ps).forEach(id=>{ if(!(id in csn)) secLines.push('smazaná ' + ps[id]); });
  if(secLines.length) lines.push({label:'Sekce', items: secLines.map(t=>({text:t}))});
  // role
  const pr = {}, cr = {}, roleLines = [];
  (prev.roles || []).forEach(r=>{ pr[r.id] = r; });
  (cur.roles || []).forEach(r=>{ cr[r.id] = r; });
  Object.keys(cr).forEach(id=>{
    if(!pr[id]) roleLines.push('nová „' + cr[id].label + '“');
    else if(pr[id].label !== cr[id].label) roleLines.push('„' + pr[id].label + '“ → „' + cr[id].label + '“');
    else if((pr[id].allowedCats || []).slice().sort().join() !== (cr[id].allowedCats || []).slice().sort().join()) roleLines.push('„' + cr[id].label + '“ – změna viditelných kategorií');
  });
  Object.keys(pr).forEach(id=>{ if(!cr[id]) roleLines.push('smazaná „' + pr[id].label + '“'); });
  if(roleLines.length) lines.push({label:'Role', items: roleLines.map(t=>({text:t}))});
  if(JSON.stringify(prev.branches || []) !== JSON.stringify(cur.branches || [])) lines.push({label:'Pobočky', items:[{text:'upravený seznam poboček'}]});
  if(JSON.stringify(prev.home || null) !== JSON.stringify(cur.home || null)) lines.push({label:'Úvodní stránka', items:[{text:'upravené dlaždice nebo nadpis'}]});
  return {lines: lines, arts: arts};
}
async function loadLog(){
  logData = {loading: true, progress: '', error: '', entries: [], openKey: ''};
  render();
  try{
    const commits = (await fetchCommits(GH_FILE)).reverse();
    let prev = null;
    const entries = [];
    for(let i = 0; i < commits.length; i++){
      if(view !== 'log') return;
      logData.progress = (i + 1) + '/' + commits.length;
      renderLogMain();
      const data = await fetchVersion(commits[i].sha, GH_FILE);
      if(!data || !Array.isArray(data.seedAll)) continue;
      const c = commits[i];
      const e = {date: c.commit.author.date, who: (c.author && c.author.login) || c.commit.author.name, lines: [], arts: []};
      if(!prev){ e.lines = [{label:'Výchozí stav', items:[{text:data.seedAll.length + ' článků'}]}]; }
      else { const d = diffKbData(prev, data); e.lines = d.lines; e.arts = d.arts; }
      if(e.lines.length) entries.push(e);
      prev = data;
    }
    if(view !== 'log') return;
    logData.entries = entries.reverse();
    logData.loading = false;
  }catch(err){
    logData.loading = false;
    logData.error = 'Historii se nepodařilo načíst z GitHubu. Zkus to za chvíli znovu.';
  }
  if(view === 'log') renderLogMain();
}
function renderLogMain(){
  if(view !== 'log' || !logData) return;
  let html = '<div class="art-title">Historie změn</div>' +
    '<div class="field-hint">Všechny publikace znalostní báze (posledních 30), od nejnovější. U každé je vidět, co se od předchozí publikace změnilo. Kliknutím na článek zobrazíš jeho tehdejší podobu. Nepublikované úpravy z prohlížeče tu nejsou.</div>';
  if(logData.loading) html += '<div class="status">Načítám historii… ' + logData.progress + '</div>';
  else if(logData.error) html += '<div class="status">' + escapeHtml(logData.error) + '</div>';
  else if(!logData.entries.length) html += '<div class="status">Zatím žádné publikované změny.</div>';
  else html += logData.entries.map((e, ei)=>{
    const d = new Date(e.date);
    const when = d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    let h = '<div class="log-entry"><div class="log-head"><b>' + when + '</b> · ' + escapeHtml(e.who) + '</div>';
    e.lines.forEach(l=>{
      h += '<div class="log-line"><span class="log-label">' + escapeHtml(l.label) + ':</span> ' + l.items.map(it=>{
        const art = it.id && e.arts.find(a=>a.id === it.id);
        return art ? '<button class="log-art" data-log="' + ei + ':' + it.id + '">' + escapeHtml(it.text) + '</button>' : '<span>' + escapeHtml(it.text) + '</span>';
      }).join('<span class="log-sep">·</span>') + '</div>';
    });
    e.arts.forEach(a=>{
      if(logData.openKey === ei + ':' + a.id){
        h += '<div class="log-preview"><div class="field-label" style="margin-top:0">' + escapeHtml(a.snap.title) + ' – podoba z této publikace</div><div class="art-body">' + a.snap.body + '</div></div>';
      }
    });
    return h + '</div>';
  }).join('');
  html += '<div class="row"><button class="btn ghost" id="backFromLog">Zpět na návody</button></div>';
  $('main').innerHTML = html;
  $('main').querySelectorAll('[data-log]').forEach(b=>{
    b.onclick = ()=>{ logData.openKey = (logData.openKey === b.dataset.log) ? '' : b.dataset.log; renderLogMain(); };
  });
  $('backFromLog').onclick = ()=>{ view = 'article'; logData = null; render(); };
}

async function loadHistory(artId){
  historyData = {artId: artId, loading: true, error: '', versions: [], openIdx: -1};
  render();
  try{
    const commits = (await fetchCommits(GH_FILE)).reverse(); // od nejstarší
    let prev = null;
    const versions = [];
    for(let i = 0; i < commits.length; i++){
      if(!historyData || historyData.artId !== artId) return;
      historyData.progress = (i + 1) + '/' + commits.length;
      renderHistoryMain();
      const c = commits[i];
      const raw = await fetch('https://raw.githubusercontent.com/' + GH_REPO + '/' + c.sha + '/' + GH_FILE);
      if(!raw.ok) continue;
      const data = parseDataJs(await raw.text());
      if(!data || !Array.isArray(data.seedAll)) continue;
      const cur = articleSnapshot(data.seedAll.find(a=>a.id === artId));
      if(!prev && !cur) continue;
      const ch = snapshotChanges(prev, cur);
      if(ch.length){
        versions.push({
          date: c.commit.author.date,
          who: (c.author && c.author.login) || c.commit.author.name,
          changes: ch,
          snap: cur
        });
      }
      prev = cur;
    }
    if(!historyData || historyData.artId !== artId) return;
    historyData.versions = versions.reverse(); // nejnovější nahoře
    historyData.loading = false;
  }catch(e){
    if(!historyData) return;
    historyData.loading = false;
    historyData.error = 'Historii se nepodařilo načíst z GitHubu. Zkus to za chvíli znovu.';
  }
  if(view === 'history') renderHistoryMain();
}
function renderHistoryMain(){
  if(view !== 'history' || !historyData) return;
  const art = articles.find(a=>a.id === historyData.artId);
  let html = '<div class="art-title">Historie: ' + escapeHtml(art ? art.title : historyData.artId) + '</div>' +
    '<div class="field-hint">Změny článku podle publikací na GitHubu (posledních 30). Nepublikované úpravy z prohlížeče tu nejsou.</div>';
  if(historyData.loading){
    html += '<div class="status">Načítám historii… ' + (historyData.progress || '') + '</div>';
  } else if(historyData.error){
    html += '<div class="status">' + escapeHtml(historyData.error) + '</div>';
  } else if(!historyData.versions.length){
    html += '<div class="status">Článek zatím nemá žádnou publikovanou změnu.</div>';
  } else {
    html += historyData.versions.map((v, i)=>{
      const d = new Date(v.date);
      const when = d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
      let row = '<div class="role-row"><span><b>' + when + '</b> · ' + escapeHtml(v.who) + ' · změněno: ' + escapeHtml(v.changes.join(', ')) + '</span>' +
        (v.snap ? '<button class="btn ghost" data-hist="' + i + '">' + (historyData.openIdx === i ? 'Skrýt' : 'Zobrazit') + '</button>' : '') + '</div>';
      if(historyData.openIdx === i && v.snap){
        row += '<div style="border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:6px;background:var(--paper)">' +
          '<div class="field-label" style="margin-top:0">' + escapeHtml(v.snap.title) + '</div>' +
          '<div class="art-body">' + v.snap.body + '</div></div>';
      }
      return row;
    }).join('');
  }
  html += '<div class="row"><button class="btn ghost" id="backFromHistory">Zpět na článek</button></div>';
  $('main').innerHTML = html;
  document.querySelectorAll('[data-hist]').forEach(b=>{
    b.onclick = ()=>{
      const i = parseInt(b.dataset.hist, 10);
      historyData.openIdx = (historyData.openIdx === i) ? -1 : i;
      renderHistoryMain();
    };
  });
  $('backFromHistory').onclick = ()=>{ view = 'article'; historyData = null; render(); };
}

      '<li><b>🏪 Pobočky</b> (dole v panelu) – seznam poboček. U článku zaškrtneš, pro které pobočky platí. Odstavce, které platí jen pro jednu pobočku, označ a v liště nástrojů vyber <b>🏪 Jen pro pobočku…</b>; blok zrušíš stejnou nabídkou (✕ Zrušit blok).</li>' +
      '<li><b>📎 Přidat přílohu</b> v úpravě článku nahraje PDF nebo Excel. Soubory jsou veřejně dostupné, nedávej sem citlivé dokumenty.</li>' +
      '<li>Nad nadpisem úvodu přidáš <b>obrázek do záhlaví</b>. Vlastní obrázek můžeš dát i sekci – při přejmenování ✎ klikni na její ikonu a zvol 🖼 Obrázek z počítače.</li>' +
      '<li>Pod dlaždicemi na úvodu zaškrtneš, které sekce se ukážou jako <b>seznam článků</b>.</li>' +
      '<li><b>Úvodní stránku</b> upravíš přímo na ní: klikni do nadpisu, názvu nebo popisu dlaždice a piš. Kliknutím na ikonu ji změníš – nebo tam dáš vlastní obrázek z počítače (🖼 Vybrat obrázek…, nejlépe PNG s průhledným pozadím nebo SVG), dole v dlaždici vybereš, kam vede, šipkami ← → měníš pořadí. Prázdná čárkovaná dlaždice přidá novou. Ukládá se hned.</li>' +
      '<li><b>🔖 QR štítky</b> (dole v panelu) – vyber články a vytiskni štítky s QR kódem k nalepení na pracoviště.</li>' +
      '<li>Novou sekci přidáš tlačítkem <b>+</b> v liště pod sekcemi. Sekci přejmenuješ ✎ (kliknutím na ikonu změníš i ikonu) nebo smažeš ✕ v její hlavičce v panelu (jen prázdnou, aspoň jedna musí zůstat). Kdo ji uvidí, nastavíš v rolích.</li>' +
      '<li>Přepínání editor/čtenář je v bloku <b>Pohled</b> dole v liště (na mobilu tlačítko <b>👁</b>); pod <b>👤</b> vybereš roli čtenáře – vidí ho jen prohlížeč s uloženým tokenem. Na novém zařízení otevři odkaz končící <b>#editor</b> a zadej token.</li>' +
      '</ul>' +
      '<h3>Uložit a publikovat</h3><ul>' +
      '<li><b>Uložit</b> ukládá jen do tohoto prohlížeče – ostatní změny zatím nevidí.</li>' +
      '<li><b>☁ Publikovat na web</b> pošle vše na GitHub a do pár minut to uvidí všichni. Při prvním publikování zadáš token.</li>' +
      '<li>Needitujte ve dvou současně – kdo publikuje později, přepíše změny toho druhého. Před úpravami obnov stránku, po úpravách hned publikuj.</li>' +
      '<li><b>⬇ Uložit zálohu</b> stáhne všechna data do souboru, <b>⬆ Nahrát zálohu</b> je obnoví.</li>' +
      '</ul>';
  }
  html += '</div><div class="row"><button class="btn ghost" id="backToArticles3">Zpět na návody</button></div>';
  $('main').innerHTML = html;
  $('backToArticles3').onclick = ()=>{ view = 'article'; render(); };
}

/* ---------- QR štítky k vytištění (odkaz rovnou na článek) ---------- */
let qrSelected = [];
let qrLibState = '';   // '' | 'loading' | 'ok' | 'error'
function loadQrLib(cb){
  if(qrLibState === 'ok') return cb();
  if(qrLibState === 'loading') return;
  qrLibState = 'loading';
  const sc = document.createElement('script');
  sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  sc.onload = ()=>{ qrLibState = 'ok'; cb(); };
  sc.onerror = ()=>{ qrLibState = 'error'; cb(); };
  document.head.appendChild(sc);
}
function qrSvg(text){
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag(4, 16);   // okraj (tichá zóna) je nutný pro spolehlivé načtení
}
function renderQrMain(){
  const base = location.origin + location.pathname;
  let html = '<div class="no-print"><div class="art-title">QR štítky</div>' +
    '<div class="field-hint">Zaškrtni články, vytiskni a nalep štítky na místo, kde se postup používá (kávovar, stroj na zmrzlinu, kasa…). Zaměstnanec namíří fotoaparát telefonu na kód a otevře se mu rovnou daný článek. Doporučujeme samolepicí papír nebo zalaminovat.</div>' +
    '<div class="qr-pick">' + SECTIONS.map(sec=>{
      const list = articles.filter(a=>a.section === sec.id);
      if(!list.length) return '';
      return '<div class="field-label">' + escapeHtml(sec.label) + '</div>' + list.map(a=>
        '<label><input type="checkbox" data-qr="' + a.id + '"' + (qrSelected.indexOf(a.id) !== -1 ? ' checked' : '') + '> ' + escapeHtml(a.title) + '</label>'
      ).join('');
    }).join('') + '</div>' +
    '<div class="row"><button class="btn" id="qrPrintBtn"' + (qrSelected.length ? '' : ' disabled') + '>📄 Vytisknout štítky (' + qrSelected.length + ')</button>' +
    '<button class="btn ghost" id="backFromQr">Zpět na návody</button></div></div>';
  if(qrSelected.length){
    if(qrLibState === 'ok'){
      html += '<div class="qr-sheet">' + qrSelected.map(id=>{
        const a = articles.find(x=>x.id === id);
        if(!a) return '';
        return '<div class="qr-label"><div class="qr-img">' + qrSvg(base + '#' + id) + '</div>' +
          '<div><div class="qr-name">' + escapeHtml(a.title) + '</div><div class="qr-hint">Naskenuj telefonem – návod ve znalostní bázi Sladké dílny</div></div></div>';
      }).join('') + '</div>';
    } else if(qrLibState === 'error'){
      html += '<div class="status">Nepodařilo se načíst generátor QR kódů (je potřeba internet). Zkus to znovu.</div>';
    } else {
      html += '<div class="status">Připravuji QR kódy…</div>';
      loadQrLib(()=>{ if(view === 'qr') renderQrMain(); });
    }
  }
  $('main').innerHTML = html;
  document.querySelectorAll('[data-qr]').forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.qr;
      qrSelected = qrSelected.filter(x=>x !== id);
      if(cb.checked) qrSelected.push(id);
      if(qrLibState === 'error') qrLibState = '';
      renderQrMain();
    };
  });
  $('qrPrintBtn').onclick = ()=>{ window.print(); };
  $('backFromQr').onclick = ()=>{ view = 'article'; render(); };
}

function render(){
  renderBranch();
  updateRailRole();
  renderSectionSwitch();
  renderAxisSwitch();
  renderCatList();
  if(view === 'home') renderHome();
  else if(view === 'roles') renderRolesMain();
  else if(view === 'help') renderHelpMain();
  else if(view === 'history') renderHistoryMain();
  else if(view === 'log') renderLogMain();
  else if(view === 'qr') renderQrMain();
  else if(view === 'branches') renderBranchesMain();
  else renderMain();
}

$('pvEditor').onclick = ()=>{ setKbMode('editor'); };
$('pvMenuEditor').onclick = ()=>{ setKbMode('editor'); };
$('pvReader').onclick = e=>{ e.stopPropagation(); if($('roleMenu').hidden) openRoleMenu(); else $('roleMenu').hidden = true; };
$('helpBtn').onclick = ()=>{ if(!canLeaveEdit()) return; editing = false; view = 'help'; render(); scrollToMainOnMobile(); };
$('homeLink').onclick = ()=>{ goHome(); };
$('helpBtnM').onclick = ()=>$('helpBtn').onclick();
$('railHome').onclick = ()=>{ goHome(); };
$('railRole').onclick = e=>{ e.stopPropagation(); if($('roleMenu').hidden) openRoleMenu(); else $('roleMenu').hidden = true; };
$('toolsBtn').onclick = e=>{ e.stopPropagation(); $('toolsMenu').classList.toggle('open'); };
$('toolsMenu').addEventListener('click', ()=>{ $('toolsMenu').classList.remove('open'); });
document.addEventListener('click', e=>{
  if(!e.target.closest('#toolsBtn')) $('toolsMenu').classList.remove('open');
  const m = $('roleMenu');
  if(!m.hidden && !m.contains(e.target) && !e.target.closest('#railRole') && !e.target.closest('#pvReader')) m.hidden = true;
});
$('branchesBtn').onclick = ()=>{ if(!canLeaveEdit()) return; editing = false; view = 'branches'; render(); scrollToMainOnMobile(); };
$('logBtn').onclick = ()=>{ if(!canLeaveEdit()) return; editing = false; view = 'log'; loadLog(); scrollToMainOnMobile(); };
$('qrBtn').onclick = ()=>{ if(!canLeaveEdit()) return; editing = false; view = 'qr'; render(); scrollToMainOnMobile(); };
$('rolesBtn').onclick = ()=>{ if(!canLeaveEdit()) return; editing = false; view = 'roles'; editingRoleId = null; render(); scrollToMainOnMobile(); };
$('addBtn').onclick = ()=>{
  if(!canLeaveEdit()) return;
  activeId = uid();
  editing = true;
  videoOpen = false;
  view = 'article';
  const blank = {id:activeId, isNew:true, section:sectionId, title:'', body:'', content:'', postupTags:[], manualTags:[], wikiTags:[], troubleshootTags:[], customTags:[], images:[], videoUrl:'', related:[], files:[], branches:[]};
  renderSectionSwitch();
  renderAxisSwitch();
  renderCatList();
  $('main').innerHTML = editFormHtml(blank);
  bindEditForm(blank);
  scrollToMainOnMobile();
};

$('publishBtn').onclick = ()=>{ publishToGitHub(); };

$('exportBtn').onclick = ()=>{
  const payload = {
    articles, roles,
    postupCats: POSTUP_CATS,
    manualCats: MANUAL_CATS,
    wikiCats: WIKI_CATS,
    troubleshootCats: TROUBLESHOOT_CATS,
    customSections: CUSTOM_SECTIONS,
    baseSections: BASE_SECTION_STATE,
    home: HOME,
    branches: BRANCHES,
    sectionIcons: SECTION_ICONS
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'znalostni-baze-zaloha.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
$('importBtn').onclick = ()=>$('importFile').click();
$('importFile').addEventListener('change', ()=>{
  const file = $('importFile').files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const newArticles = Array.isArray(parsed) ? parsed : parsed.articles;
      const newRoles = Array.isArray(parsed) ? [] : (parsed.roles || []);
      if(!Array.isArray(newArticles)) throw new Error('neplatný formát');
      articles = newArticles;
      articles.forEach(a=>{
        if(!a.images) a.images = [];
        if(a.videoUrl == null) a.videoUrl = '';
        if(!a.section) a.section = 'sop';
        if(!a.wikiTags) a.wikiTags = [];
        if(!a.troubleshootTags) a.troubleshootTags = [];
        if(!a.related) a.related = [];
        if(a.body == null) a.body = legacyContentToHtml(a);
        if(!a.customTags) a.customTags = [];
        if(!a.files) a.files = [];
        if(!a.branches) a.branches = [];
        migrateVideoField(a);
      });
      roles = newRoles;
      if(!Array.isArray(parsed) && Array.isArray(parsed.customSections)){
        CUSTOM_SECTIONS = parsed.customSections;
        saveCustomSections();
      }
      if(!Array.isArray(parsed) && parsed.baseSections){
        BASE_SECTION_STATE = parsed.baseSections; normBaseState();
        saveBaseSections();
      }
      if(!Array.isArray(parsed) && parsed.home && Array.isArray(parsed.home.tiles)){ HOME = parsed.home; saveHome(); }
      if(!Array.isArray(parsed) && Array.isArray(parsed.branches)){ BRANCHES = parsed.branches; saveBranches(); }
      if(!Array.isArray(parsed) && parsed.sectionIcons && typeof parsed.sectionIcons === 'object'){ SECTION_ICONS = parsed.sectionIcons; saveSectionIcons(); }
      rebuildSections();
      articles.forEach(a=>{ if(!sectionExists(a.section)) a.section = firstSectionId(); });
      sectionId = firstSectionId(); axisId = currentAxes()[0].id;
      if(!Array.isArray(parsed) && Array.isArray(parsed.postupCats) && parsed.postupCats.length){
        POSTUP_CATS.length = 0;
        parsed.postupCats.forEach(c=>POSTUP_CATS.push(c));
        saveEditableCats('postup');
      }
      if(!Array.isArray(parsed) && Array.isArray(parsed.manualCats) && parsed.manualCats.length){
        MANUAL_CATS.length = 0;
        parsed.manualCats.forEach(c=>MANUAL_CATS.push(c));
        saveEditableCats('manual');
      }
      if(!Array.isArray(parsed) && Array.isArray(parsed.wikiCats) && parsed.wikiCats.length){
        WIKI_CATS.length = 0;
        parsed.wikiCats.forEach(c=>WIKI_CATS.push(c));
        saveEditableCats('wiki');
      }
      if(!Array.isArray(parsed) && Array.isArray(parsed.troubleshootCats) && parsed.troubleshootCats.length){
        TROUBLESHOOT_CATS.length = 0;
        parsed.troubleshootCats.forEach(c=>TROUBLESHOOT_CATS.push(c));
        saveEditableCats('troubleshooting');
      }
      saveArticles();
      saveRoles();
      activeId = articles.length ? articles[0].id : null;
      editing = false;
      videoOpen = false;
      view = 'article';
      render();
      $('status').textContent = 'Záloha nahrána.';
    }catch(e){
      $('status').textContent = 'Import se nezdařil – soubor neodpovídá formátu zálohy.';
    }
  };
  reader.readAsText(file);
  $('importFile').value = '';
});

// Offline: jednou načtená znalostní báze se otevře i bez internetu (soubor sw.js)
if('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
